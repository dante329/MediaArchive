function batchLimitValue(){
  const sel = $("#batchLimit");
  if (!sel) return "200";
  if (sel.value === "custom") {
    const v = parseInt($("#batchLimitCustom")?.value, 10);
    return v > 0 ? String(v) : "200";
  }
  return sel.value;
}

function renderPastePreview(){
  const box = $("#batchParse");
  if (!box) return;
  const urls = extractUrls($("#batchText")?.value || "");
  if (!urls.length) {
    box.innerHTML = "";
    box.style.display = "none";   // 没内容就别占地方、别放提示字
  } else {
    box.style.display = "";
    const show = urls.slice(0, 6).map(u => '<div>· <span class="u">' + esc(u.length > 96 ? u.slice(0, 96) + "…" : u) + '</span></div>').join("");
    box.innerHTML = '<b>识别到 ' + urls.length + ' 个链接</b>' + show
      + (urls.length > 6 ? '<div>… 还有 ' + (urls.length - 6) + ' 个</div>' : "");
  }
  batchCount();
}

function batchCount(){
  if (BATCH.tab === "paste") {
    const n = extractUrls($("#batchText")?.value || "").length;
    $("#batchGo").textContent = n ? ("归档 " + n + " 个链接") : "归档链接";
    $("#batchGo").disabled = !n;
    return;
  }
  $("#batchGo").textContent = "归档选中（" + BATCH.sel.size + "）";
  $("#batchGo").disabled = BATCH.sel.size === 0;
  const tg = $("#batchTargets");
  if (tg) tg.disabled = BATCH.sel.size === 0;
}

function batchTabs(){
  [...document.querySelectorAll("#batchTabs button")].forEach(b =>
    b.classList.toggle("on", b.dataset.src === BATCH.tab));
  const paste = BATCH.tab === "paste";
  const list = BATCH.tab === "list";
  $("#batchBar").style.display = paste ? "none" : "";
  $("#batchPaste").style.display = paste ? "flex" : "none";
  $("#batchParse").style.display = paste ? "" : "none";
  $("#batchList").style.display = list ? "flex" : "none";
  $("#batchGrid").style.display = paste ? "none" : "";
  $("#batchBack").style.display = BATCH.url ? "" : "none";
  $("#batchMsg").textContent = "";
  $("#batchInfo").textContent = "";
  // 不清除 batchLoginTip，保持登录状态/昵称显示
  if (paste) renderPastePreview();
  else batchCount();
}

function batchClose(){
  $("#batch").classList.remove("on");
  sessionStorage.removeItem("batchOpen");
  if (BATCH.poll) { clearInterval(BATCH.poll); BATCH.poll = 0; }
  // 关闭批量归档窗口 = 真正打断解析；切 tab 不会
  Object.entries(BATCH.jobs).forEach(([tab, job]) => {
    try { job.ac.abort(); } catch (e) {}
    batchTabBadge(tab, false);
  });
  BATCH.jobs = {};
  $("#batchLogin").disabled = false;
  batchCount();
}

const SRC_STATUS = {};   // 登录态缓存：开批量归档窗口时先秒显示，再后台校对
function applySourceStatus(platform, r){
  const ok = !!r[platform];
  const nick = r[platform + "_nickname"] || "";
  const st = r.login || {};
  const inLogin = st.state === "waiting_tasks" || st.state === "waiting_scan";
  $("#batchLoginTip").textContent = ok ? ("已登录" + (nick ? " · " + nick : "")) : (inLogin ? (st.message || "登录中…") : "未登录");
  $("#batchLoginTip").className = "bhint" + (ok ? "" : " warn");
  $("#batchLogin").style.display = (ok || inLogin) ? "none" : "";
  $("#batchLogout").style.display = ok ? "" : "none";
  if (inLogin) startLoginPoll();
  return ok;
}
async function batchStatus(){
  try {
    const { platform } = batchPK();
    if (!platform) {
      $("#batchLogin").style.display = "none";
      $("#batchLoginTip").textContent = "";
      return;
    }
    if (SRC_STATUS[platform]) applySourceStatus(platform, SRC_STATUS[platform]);  // 秒显示
    const r = await fetch("/api/source/status?platform=" + encodeURIComponent(platform)).then(x => x.json());
    SRC_STATUS[platform] = r;
    applySourceStatus(platform, r);
  } catch (e) {
    $("#batchLogin").style.display = "";
    $("#batchLoginTip").textContent = "登录状态未知";
  }
}

function startLoginPoll(){
  if (BATCH.poll) return;
  BATCH.poll = setInterval(async () => {
    try {
      const r = await fetch("/api/source/login/status").then(x => x.json());
      const st = r.login || {};
      $("#batchLoginTip").textContent = st.message || "登录中…";
      $("#batchLoginTip").className = "bhint warn";
      $("#batchLogin").disabled = true;
      if (["done", "error", "cancelled", "idle"].includes(st.state)) {
        clearInterval(BATCH.poll); BATCH.poll = 0;
        $("#batchLogin").disabled = false;
        if (st.state === "done") {
          toast("登录成功");
          $("#batchLogin").style.display = "none";
          batchStatus(); // 刷新以显示账号名
          batchLoad(false);
        } else if (st.state === "error" || st.state === "cancelled") {
          toast(st.message || "登录失败");
          $("#batchLoginTip").textContent = "未登录";
          $("#batchLoginTip").className = "bhint warn";
          $("#batchLogin").style.display = "";
        }
      }
    } catch (e) {}
  }, 1500);
}

/* 解析任务按 tab 记账：切走不打断，结果写回该 tab 的缓存；切回来直接看到。
   只有关闭整个批量归档窗口才会 abort。 */
function batchTabBadge(tab, on){
  const b = [...document.querySelectorAll("#batchTabs button")].find(x => x.dataset.src === tab);
  if (b) b.classList.toggle("loading", !!on);
}

function batchJobFor(tab, refresh){
  const old = BATCH.jobs[tab];
  if (old) { try { old.ac.abort(); } catch (e) {} }
  const ac = new AbortController();
  const job = { ac, started: Date.now() };
  BATCH.jobs[tab] = job;
  batchTabBadge(tab, true);
  return job;
}

function batchJobDone(tab, job){
  if (BATCH.jobs[tab] === job) delete BATCH.jobs[tab];
  batchTabBadge(tab, false);
}

async function batchLoad(refresh, tabOverride){
  const tab = tabOverride || BATCH.tab;
  if (tab === "paste") return;
  if (tab === "list") { if (!tabOverride) await batchListLoad(); return; }
  const a = tab.split("|");
  const platform = a[0], kind = a[1];
  if (!platform) return;
  const cur = BATCH.cache[tab];
  const urlAtStart = (tab === BATCH.tab) ? BATCH.url : (cur ? cur.url : "");
  const job = batchJobFor(tab, refresh);
  if (tab === BATCH.tab) {
    BATCH.loadedTab = tab;
    const grid = $("#batchGrid");
    grid.style.display = "";
    if (!(cur && cur.items && cur.items.length)) {
      grid.innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">读取中…</div>';
    }
    $("#batchInfo").textContent = "";
  }
  const q = new URLSearchParams({ platform, kind, limit: batchLimitValue() });
  if (refresh) q.set("refresh", "1");
  if (urlAtStart) q.set("url", urlAtStart);
  try {
    const r = await fetch("/api/source/items?" + q, { signal: job.ac.signal }).then(x => x.json());
    if (!r.ok) {
      if (tab === BATCH.tab) {
        const grid = $("#batchGrid");
        if (!r.logged_in) {
          $("#batchLoginTip").textContent = "未登录";
          $("#batchLoginTip").className = "bhint warn";
          $("#batchLogin").style.display = "";
          grid.innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">未登录，点右上角「登录」扫码</div>';
        } else {
          grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">' + esc(r.error || "读取失败") + '</div>';
        }
      }
      return;
    }
    // 结果写回该 tab 的缓存：切走了也不丢，切回来直接渲染
    const prev = BATCH.cache[tab];
    BATCH.cache[tab] = {
      items: r.items || [],
      sel: prev && prev.sel ? prev.sel : new Set(),
      url: urlAtStart,
      listUrl: prev ? prev.listUrl : ""
    };
    if (tab === BATCH.tab) {
      BATCH.items = BATCH.cache[tab].items.slice();
      BATCH.sel = new Set(BATCH.cache[tab].sel);
      renderBatch();
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
    if (tab === BATCH.tab) {
      $("#batchGrid").innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">读取失败：' + esc(e.message) + '</div>';
    }
  } finally {
    batchJobDone(tab, job);
  }
}

async function batchLogin(){
  const { platform } = batchPK();
  if (!platform) return;
  $("#batchLogin").disabled = true;
  toast("正在暂停队列并准备登录窗口…");
  try {
    const r = await fetch("/api/source/login", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform }) }).then(x => x.json());
    if (r.already) {
      toast("已经登录了");
      $("#batchLogin").disabled = false;
      $("#batchLogin").style.display = "none";
      batchStatus(); // 刷新以显示账号名
      batchLoad(false);
      return;
    }
    if (!r.ok) {
      toast(r.error || "登录启动失败");
      $("#batchLogin").disabled = false;
      if (r.login) startLoginPoll();
      return;
    }
    startLoginPoll();
  } catch (e) {
    toast("登录启动失败：" + e.message);
    $("#batchLogin").disabled = false;
  }
}

function batchListInit(){
  // 不清除登录状态显示
  $("#batchInfo").textContent = "";
  if (BATCH.items && BATCH.items.length) { renderBatch(); return; }
  $("#batchGrid").innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">支持：抖音博主、B站合集/分P、YouTube 频道/播放列表、X / Instagram / 微博主页</div>';
}

async function batchListLoad(){
  const raw = $("#batchListUrl").value || "";
  const url = extractUrl(raw);
  if (!url) { toast("没识别到链接"); return; }
  BATCH.listUrl = url;
  BATCH.loadedTab = "list";
  BATCH.items = []; BATCH.sel.clear(); BATCH.url = "";
  const grid = $("#batchGrid");
  grid.innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">读取中…</div>';
  $("#batchInfo").textContent = "";
  try {
    const r = await fetch("/api/source/items?platform=auto&kind=list&url=" + encodeURIComponent(url)
      + "&limit=" + encodeURIComponent(batchLimitValue()) + "&refresh=1")
      .then(x => x.json());
    if (BATCH.tab !== "list" || BATCH.loadedTab !== "list") return;
    if (!r.ok) {
      grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">' + esc(r.error || "读取失败") + '</div>';
      return;
    }
    BATCH.items = r.items || [];
    BATCH.sel.clear();
    renderBatch();
    batchSaveCache();
  } catch (e) {
    if (BATCH.tab !== "list") return;
    grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">读取失败：' + esc(e.message) + '</div>';
  }
}

function batchVisible(){
  const q = ($("#batchSearch").value || "").trim().toLowerCase();
  const onlyNew = $("#batchOnlyNew").checked;
  return BATCH.items.filter(it => {
    if (onlyNew && it.archived) return false;
    if (q && !(((it.title || "") + " " + (it.id || "")).toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderBatch(){
  const list = batchVisible();
  const total = BATCH.items.length;
  const arch = BATCH.items.filter(x => x.archived).length;
  const empty = !total ? "没有读到作品"
    : (list.length ? "" : ($("#batchOnlyNew")?.checked ? "这个列表里的作品都已归档；取消「只看未归档」可以查看" : "没有匹配的作品"));
  $("#batchGrid").innerHTML = list.map(it => {
    const sel = BATCH.sel.has(String(it.id));
    let cover = it.cover || "";
    if (cover.startsWith("//")) cover = "https:" + cover;
    const isCol = it.type === "collection";
    return `<div class="bcard${sel ? " sel" : ""}" data-id="${esc(it.id)}" data-type="${isCol ? "col" : "item"}">
      ${isCol ? '<span class="badge">收藏夹</span>' : `<input type="checkbox" class="chk" ${sel ? "checked" : ""}>`}
      ${cover ? `<img class="cov" src="${esc(cover)}" loading="lazy" referrerpolicy="no-referrer">` : '<div class="cov"></div>'}
      <div class="bt">${esc(it.title || it.id)}</div>
      <div class="ba">${it.archived ? '<span class="arch">已归档</span>' : ""}${isCol && !it.archived ? "点开查看" : ""}</div>
    </div>`;
  }).join("") || '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">' + empty + '</div>';
  $("#batchInfo").textContent = total ? ("显示 " + list.length + " / 共 " + total + " · 已归档 " + arch) : "";
  batchCount();
}

async function batchGo(targets){
  let urls = [];
  if (BATCH.tab === "paste") {
    urls = extractUrls($("#batchText")?.value || "");
  } else {
    urls = BATCH.items.filter(it => BATCH.sel.has(String(it.id))).map(it => it.url);
  }
  if (!urls.length) { toast("没有可归档的内容"); return; }
  $("#batchGo").disabled = true;
  $("#batchTargets").disabled = true;
  try {
    const payload = { urls };
    if (targets) payload.targets = targets;
    const r = await fetch("/api/archive_batch", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }).then(x => x.json());
    if (r.ok) {
      toast(targets ? "已加入 " + r.count + " 条，归档后自动归到指定分类" :
                    "已加入 " + r.count + " 条，任务面板里看进度");
      BATCH.sel.clear(); renderBatch(); batchSaveCache();
    }
    else toast(r.error || "加入失败");
  } catch (e) {
    toast("加入失败：" + e.message);
  }
  batchCount();   // 按钮可用性交给 batchCount 统一管，别留下禁用残影
  $("#batchTargets").disabled = BATCH.sel.size === 0;
}

$("#btnBatch").onclick = () => {
  // 如果已经打开，直接恢复显示（不重置状态）
  if ($("#batch").classList.contains("on")) return;
  BATCH.tab = "douyin|like"; BATCH.url = ""; BATCH.listUrl = ""; BATCH.items = []; BATCH.sel.clear(); BATCH.loadedTab = "";
  BATCH.cache = {};
  $("#batchSearch").value = ""; $("#batchOnlyNew").checked = true;
  $("#batchText").value = "";
  $("#batch").classList.add("on");
  sessionStorage.setItem("batchOpen", "1");
  batchTabs(); batchStatus(); batchLoad(false);
};
$("#batchClose").onclick = batchClose;
// 点击遮罩不关闭，只能通过关闭按钮或再次点击主页按钮恢复
$("#batchTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-src]");
  if (!b || b.dataset.src === BATCH.tab) return;
  batchSaveCache(); // 保存当前 tab 数据
  BATCH.tab = b.dataset.src;
  $("#batchSearch").value = ""; $("#batchOnlyNew").checked = true;
  // 尝试从缓存恢复
  if (batchRestoreCache(BATCH.tab)) {
    BATCH.loadedTab = BATCH.tab;
    batchTabs();
    if (BATCH.tab === "list") {
      if ($("#batchListUrl")) $("#batchListUrl").value = BATCH.listUrl || "";
      if (BATCH.items.length) renderBatch();
      else batchListInit();
      return;
    }
    if (BATCH.tab === "paste") { renderPastePreview(); return; }
    // 有缓存且有内容 → 直接渲染
    if (BATCH.items.length) { renderBatch(); batchStatus(); return; }
    // 有缓存但内容为空：如果后台还在跑就显示读取中，否则重新加载
    if (BATCH.jobs[BATCH.tab]) {
      $("#batchGrid").innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">读取中…</div>';
      batchStatus();
      return;
    }
    // 缓存为空且没在跑 → 重新加载（可能上次返回了空结果）
    batchLoad(false);
    batchStatus();
    return;
  }
  // 无缓存，全新加载
  BATCH.url = ""; BATCH.items = []; BATCH.sel.clear(); BATCH.loadedTab = "";
  batchTabs();
  if (BATCH.tab === "paste") { renderPastePreview(); return; }
  if (BATCH.tab === "list") { batchListInit(); return; }
  batchStatus();
  // 这个 tab 已经有解析任务在跑（刚才切走的那次）：不重发请求，等它写回缓存
  if (BATCH.jobs[BATCH.tab]) {
    $("#batchGrid").innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">读取中…（后台解析未打断）</div>';
    return;
  }
  batchLoad(false);
});
$("#batchRefresh").onclick = () => {
  if (BATCH.tab === "list") { batchListLoad(); return; }
  if (BATCH.tab === "paste") return;
  if (BATCH.jobs[BATCH.tab]) { toast("这个列表正在解析中，完成后自动刷新"); return; }
  batchLoad(true);
};
$("#batchListGo").onclick = () => batchListLoad();
$("#batchListUrl").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); batchListLoad(); } });
$("#batchLimit").onchange = function(){
  const custom = this.value === "custom";
  $("#batchLimitCustom").style.display = custom ? "" : "none";
  if (custom) $("#batchLimitCustom").focus();
};
$("#batchLimitCustom").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (BATCH.tab === "list") batchListLoad();
    else if (BATCH.tab !== "paste") batchLoad(true);
  }
});
$("#batchSearch").oninput = () => renderBatch();
$("#batchOnlyNew").onchange = () => renderBatch();
$("#batchAll").onclick = () => {
  // 「全选」= 全选当前筛选结果：勾上「只看未归档」就只选未归档的，搜了关键词就只选匹配的
  const list = batchVisible().filter(it => it.type !== "collection");
  if (!list.length) { toast("当前筛选下没有可选的作品"); return; }
  const all = list.every(it => BATCH.sel.has(String(it.id)));
  list.forEach(it => {
    const k = String(it.id);
    if (all) BATCH.sel.delete(k); else BATCH.sel.add(k);
  });
  renderBatch();
};
$("#batchBack").onclick = () => { BATCH.url = ""; BATCH.sel.clear(); $("#batchBack").style.display = "none"; batchLoad(false); };
$("#batchLogin").onclick = batchLogin;
$("#batchLogout").onclick = async () => {
  const platform = batchPK().platform || "douyin";
  const ok = await askConfirm("退出登录", "退出后需要重新扫码才能批量归档。", "退出", true);
  if (!ok) return;
  toast("处理中…");
  const r = await fetch("/api/source/logout", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ platform })
  }).then(x => x.json()).catch(() => null);
  if (r && r.ok) {
    toast("已退出登录");
    $("#batchLogout").style.display = "none";
    $("#batchLogin").style.display = "";
    $("#batchLoginTip").textContent = "未登录";
    $("#batchLoginTip").className = "bhint warn";
  } else {
    toast("退出失败：" + ((r && r.error) || ""));
  }
};
$("#batchGo").onclick = batchGo;
$("#batchText").oninput = () => renderPastePreview();
const backTop = $("#backTop");
if(backTop){
  const mainEl = document.querySelector("main");
  const useMain = !!(mainEl && mainEl.offsetParent !== null &&
                     ["auto","scroll"].includes(getComputedStyle(mainEl).overflowY));
  const scrollBox = useMain ? mainEl : document.scrollingElement;
  const syncBackTop = () => {
    const y = (scrollBox && scrollBox.scrollTop) || window.scrollY || 0;
    backTop.classList.toggle("on", y > 500);
  };
  window.addEventListener("scroll", syncBackTop, {passive:true});
  if(scrollBox && scrollBox !== document.scrollingElement){
    scrollBox.addEventListener("scroll", syncBackTop, {passive:true});
  }
  backTop.onclick = () => {
    if(scrollBox && scrollBox.scrollTo) scrollBox.scrollTo({top:0, behavior:"smooth"});
    window.scrollTo({top:0, behavior:"smooth"});
  };
  syncBackTop();
}
$("#batchGrid").addEventListener("click", e => {
  const card = e.target.closest(".bcard");
  if (!card) return;
  const id = card.dataset.id;
  if (card.dataset.type === "col") {
    const it = BATCH.items.find(x => String(x.id) === id);
    if (it) { BATCH.url = it.url; BATCH.sel.clear(); $("#batchBack").style.display = ""; batchLoad(false); }
    return;
  }
  // 点勾选框本身时不要 preventDefault：原生 checkbox 的 pre-click 翻转会被撤销，
  // 结果就是「卡片选中了但框里没勾」（老 bug）
  if (!e.target.matches("input.chk")) e.preventDefault();
  if (BATCH.sel.has(id)) BATCH.sel.delete(id); else BATCH.sel.add(id);
  card.classList.toggle("sel", BATCH.sel.has(id));
  const chk = card.querySelector(".chk");
  if (chk) chk.checked = BATCH.sel.has(id);
  batchCount();
});

/* ---------- 归档到指定分类（平台 / 博主 / 收藏夹 组合） ---------- */
const TG = { platform: "", author_key: "", collections: new Set(),
  open: { platform: true, author: true, collection: true },
  q: { platform: "", author: "", collection: "" } };

function tgSecHeader(grp, title){
  return `<div class="tgsec" data-grp="${grp}" data-open="${TG.open[grp] ? 1 : 0}">
    <span class="tgcaret"></span><b>${title}</b>
    <input class="tgq" data-q="${grp}" type="text" placeholder="搜索" value="${esc(TG.q[grp] || "")}">
  </div><div class="tgbody" data-body="${grp}" ${TG.open[grp] ? "" : 'style="display:none"'}>`;
}

function tgRender(){
  const box = $("#tgList");
  if (!box) return;
  const qOf = g => (TG.q[g] || "").trim().toLowerCase();
  const match = (g, label) => !qOf(g) || String(label).toLowerCase().includes(qOf(g));
  const plats = (__platforms || []).filter(p => match("platform", p.platform_cn) || match("platform", p.platform));
  const authors = (__authors || [])
    .filter(a => !TG.platform || a.platform === TG.platform)
    .filter(a => match("author", a.author))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));   // 主页置顶的博主排最前
  const cols = (collectionsCache || []).filter(c => match("collection", c.name));
  let html = "";
  // 平台：点已选中的蓝点 = 取消选择
  html += tgSecHeader("platform", "平台");
  html += `<div class="pickrow" data-tg-p=""><input type="radio" name="tgp" ${!TG.platform ? "checked" : ""}><span class="pt">自动识别</span></div>`;
  html += plats.map(p => `<div class="pickrow" data-tg-p="${esc(p.platform)}">
      <input type="radio" name="tgp" ${TG.platform === p.platform ? "checked" : ""}>
      <span class="pt">${esc(p.platform_cn)}</span><span class="pa">${p.n} 条</span></div>`).join("");
  html += "</div>";
  // 博主：同样点已选中可取消；选了平台只列该平台博主
  html += tgSecHeader("author", "博主");
  html += `<div class="pickrow" data-tg-a=""><input type="radio" name="tga" ${!TG.author_key ? "checked" : ""}><span class="pt">自动识别</span></div>`;
  html += authors.map(a => `<div class="pickrow" data-tg-a="${esc(a.author_key || a.author)}">
      <input type="radio" name="tga" ${TG.author_key === (a.author_key || a.author) ? "checked" : ""}>
      <span class="pt">${esc(a.author)}${a.pinned ? '<i class="sub">置顶</i>' : ""}</span><span class="pa">${esc(a.platform_cn || "")}</span></div>`).join("");
  html += "</div>";
  // 收藏夹：多选
  html += tgSecHeader("collection", "收藏夹");
  html += cols.map(c => `<div class="pickrow" data-tg-c="${esc(String(c.id))}">
      <input type="checkbox" ${TG.collections.has(String(c.id)) ? "checked" : ""}>
      <span class="pt">${esc(c.name)}</span><span class="pa">${c.n || 0} 条</span></div>`).join("");
  html += `<div class="pickrow" data-tg-cnew="1"><span class="pt" style="color:var(--blue)">＋ 新建收藏夹…</span></div>`;
  html += "</div>";
  box.innerHTML = html;
  const n = (TG.platform ? 1 : 0) + (TG.author_key ? 1 : 0) + TG.collections.size;
  $("#tgCount").textContent = n ? ("已选 " + n + " 项归属") : "";
  $("#tgOk").disabled = BATCH.sel.size === 0;
}

function openBatchTargets(){
  if (BATCH.sel.size === 0) { toast("先选中要归档的作品"); return; }
  TG.platform = ""; TG.author_key = ""; TG.collections.clear();
  TG.q = { platform: "", author: "", collection: "" };
  TG.open = { platform: true, author: true, collection: true };
  tgRender();
  $("#batchTargetsBox").classList.add("on");
}

$("#tgList").addEventListener("click", async e => {
  const rowP = e.target.closest("[data-tg-p]");
  const rowA = e.target.closest("[data-tg-a]");
  const rowC = e.target.closest("[data-tg-c]");
  const rowNew = e.target.closest("[data-tg-cnew]");
  if (rowNew) {
    const name = await askInput("新建收藏夹", "归档完成后自动把作品加进去", "");
    if (!name) return;
    const r = await fetch("/api/collection/create", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name }) }).then(x => x.json()).catch(() => null);
    if (r && r.ok && r.id) TG.collections.add(String(r.id));
    else if (r && r.id) TG.collections.add(String(r.id));
    else toast("新建失败：" + ((r && r.error) || ""));
    const cols = await fetch("/api/collections").then(x => x.json()).catch(() => []);
    collectionsCache = Array.isArray(cols) ? cols : [];
    tgRender();
    return;
  }
  // 点标题栏 = 收起 / 展开（搜索框里打字不算）
  const sec = e.target.closest(".tgsec");
  if (sec && !e.target.matches(".tgq")) {
    const g = sec.dataset.grp;
    TG.open[g] = !TG.open[g];
    tgRender();
    return;
  }
  if (rowP) {
    const v = rowP.dataset.tgP || "";
    TG.platform = (v && v === TG.platform) ? "" : v;   // 点已选中的蓝点 = 取消
    tgRender();
    return;
  }
  if (rowA) {
    const v = rowA.dataset.tgA || "";
    TG.author_key = (v && v === TG.author_key) ? "" : v;
    tgRender();
    return;
  }
  if (rowC) {
    const id = rowC.dataset.tgC;
    if (TG.collections.has(id)) TG.collections.delete(id); else TG.collections.add(id);
    tgRender();
    return;
  }
});
// 分区内搜索：只过滤行，不重渲染（保住输入框焦点）
$("#tgList").addEventListener("input", e => {
  if (!e.target.matches(".tgq")) return;
  const g = e.target.dataset.q;
  TG.q[g] = e.target.value;
  const kw = e.target.value.trim().toLowerCase();
  document.querySelectorAll(`[data-body="${g}"] .pickrow`).forEach(row => {
    const label = (row.querySelector(".pt")?.textContent || "").toLowerCase();
    row.style.display = (!kw || label.includes(kw)) ? "" : "none";
  });
});
$("#tgClear").onclick = () => { TG.platform = ""; TG.author_key = ""; TG.collections.clear(); tgRender(); };
$("#tgClose").onclick = () => $("#batchTargetsBox").classList.remove("on");
$("#tgOk").onclick = () => {
  const targets = {};
  if (TG.platform) targets.platform = TG.platform;
  if (TG.author_key) targets.author_key = TG.author_key;
  if (TG.collections.size) targets.collections = [...TG.collections].map(id => ({ id }));
  $("#batchTargetsBox").classList.remove("on");
  batchGo(Object.keys(targets).length ? targets : null);
};
$("#batchTargets").onclick = openBatchTargets;

/* ---------- 隐藏：作品 / 博主 / 平台 / 分类 ---------- */
async function hideThings(kind, keys, label){
  keys = (Array.isArray(keys) ? keys : [keys]).filter(k => k !== undefined && k !== null && k !== "");
  if (!keys.length) return;
  const r = await fetch("/api/hide", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind, keys, hidden: true }) }).then(x => x.json()).catch(() => null);
  if (r && r.ok) {
    toast("已隐藏 " + label + " · 空白处右键「管理已隐藏」可恢复");
    // 当前筛选正好落在被隐藏的对象上 → 退回全部，避免空屏
    if (kind === "platform" && keys.includes(platformKeyFor(state.platform))) state.platform = "";
    if (kind === "author" && keys.includes(state.author_key || state.author)) { state.author = ""; state.author_key = ""; }
    if (kind === "collection" && keys.includes(String(state.collection))) state.collection = null;
    loadAll();
  } else {
    toast("隐藏失败：" + ((r && r.error) || ""));
  }
}

async function hideConfirm(kind, keys, label){
  const ok = await askConfirm("隐藏" + label,
    "隐藏后 App 内不再展示" + label + "（文件与记录都保留）。\n恢复：空白处右键 → 管理已隐藏。", "隐藏");
  if (!ok) return;
  hideThings(kind, keys, label);
}

async function openHiddenManager(){
  const r = await fetch("/api/hidden").then(x => x.json()).catch(() => null);
  if (!r || !r.ok) { toast("读取隐藏名单失败"); return; }
  const box = $("#hmList");
  const rows = [];
  const itemName = id => {
    const it = (itemsCache || []).find(x => String(x.id) === String(id));
    return it ? (it.title || ("作品 #" + id)) : ("作品 #" + id);
  };
  const authorName = k => {
    const a = (__authors || []).find(x => (x.author_key || x.author) === k);
    return a ? a.author : k;
  };
  const platName = k => {
    const p = (__platforms || []).find(x => x.platform === k);
    return p ? p.platform_cn : k;
  };
  const colName = id => {
    const c = (collectionsCache || []).find(x => String(x.id) === String(id));
    return c ? c.name : ("分类 #" + id);
  };
  (r.items || []).forEach(k => rows.push(["item", k, itemName(k), "作品"]));
  (r.authors || []).forEach(k => rows.push(["author", k, authorName(k), "博主"]));
  (r.platforms || []).forEach(k => rows.push(["platform", k, platName(k), "平台"]));
  (r.collections || []).forEach(k => rows.push(["collection", k, colName(k), "分类"]));
  box.innerHTML = rows.length ? rows.map((x, i) =>
    `<div class="hmgrow" data-i="${i}"><span class="k">${x[3]}</span><span class="t">${esc(x[2])}</span>
     <button class="small" data-un="1">恢复</button></div>`).join("")
    : '<div class="bhint" style="padding:20px 8px">当前没有隐藏内容。右键作品 / 博主 / 平台 / 分类即可隐藏</div>';
  box.querySelectorAll("[data-un]").forEach(btn => {
    btn.onclick = async () => {
      const i = +btn.closest(".hmgrow").dataset.i;
      const [kind, key] = rows[i];
      const rr = await fetch("/api/hide", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind, keys: [key], hidden: false }) }).then(x => x.json()).catch(() => null);
      if (rr && rr.ok) { loadAll(); openHiddenManager(); }
    };
  });
  $("#hiddenMgrBox").classList.add("on");
}
$("#hmClose").onclick = () => $("#hiddenMgrBox").classList.remove("on");
$("#hmClearAll").onclick = async () => {
  const ok = await askConfirm("全部恢复", "把所有隐藏的作品 / 博主 / 平台 / 分类都恢复展示？", "恢复");
  if (!ok) return;
  const r = await fetch("/api/hide", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ kind: "all", hidden: false }) }).then(x => x.json()).catch(() => null);
  if (r && r.ok) { loadAll(); openHiddenManager(); }
};

/* 主列表多选条：隐藏选中的作品 */
$("#bulkHide").onclick = async () => {
  const ids = [...selected];
  if (!ids.length) return;
  const ok = await askConfirm("隐藏作品", "隐藏选中的 " + ids.length + " 个作品？App 内不再展示，文件保留。", "隐藏");
  if (!ok) return;
  await hideThings("item", ids, ids.length + " 个作品");
  exitBulkMode();
};
