<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>媒体归档</title>
<style>
/* ==================== 主题 ==================== */
:root{
  --green-dot:#18e05c; --amber:#f5a524;
  --bg:#f4f5f7; --card:#ffffff; --input:#f5f6f8; --line:#e5e8ec;
  --txt:#1f2329; --dim:#8b939d; --ok:#34a853;
  --blue:#1a8cff; --blue-l:#eaf3ff; --blue-d:#0f5fb0; --btntxt:#ffffff;
  --pinned:#eceef1; --thumbA:#eceef1; --thumbB:#e0e3e8;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 8px 22px rgba(16,24,40,.13);
  --danger:#e5484d; --danger-l:#fff0f0;
  --hover:rgba(16,24,40,.045);
  --overlay:rgba(24,28,34,.45);
}

/* 默认 —— 中性灰 + 蓝 */
html[data-theme="default"]{
  --green-dot:#18e05c;
  --bg:#f4f5f7; --card:#ffffff; --input:#f5f6f8; --line:#e5e8ec;
  --txt:#1f2329; --dim:#8b939d; --ok:#34a853;
  --blue:#1a8cff; --blue-l:#eaf3ff; --blue-d:#0f5fb0; --btntxt:#ffffff;
  --pinned:#eceef1; --thumbA:#eceef1; --thumbB:#e0e3e8;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 8px 22px rgba(16,24,40,.13);
  --danger:#e5484d; --danger-l:#fff0f0;
  --hover:rgba(16,24,40,.045);
  --overlay:rgba(24,28,34,.45);
}

/* 深夜 —— 纯黑极简 */
html[data-theme="deep"]{
  --green-dot:#4ade80; --amber:#fbbf24;
  --bg:#111113; --card:#1c1c1f; --input:#1c1c1f; --line:#2c2c30;
  --txt:#e5e5e7; --dim:#71717a; --ok:#4ade80;
  --blue:#3b82f6; --blue-l:#172554; --blue-d:#93c5fd; --btntxt:#ffffff;
  --pinned:#222225; --thumbA:#1e1e22; --thumbB:#28282e;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --shadow-lg:0 14px 38px rgba(0,0,0,.5);
  --danger:#f87171; --danger-l:#2d1515;
  --hover:rgba(255,255,255,.04);
  --overlay:rgba(0,0,0,.55);
}

/* 暮光 —— 黄昏紫橙 */
html[data-theme="twilight"]{
  --green-dot:#7ecba1; --amber:#f0c060;
  --bg:#1a1025; --card:#241535; --input:#241535; --line:#3a2548;
  --txt:#ede0d4; --dim:#8a7090; --ok:#7ecba1;
  --blue:#e8956a; --blue-l:#3d2535; --blue-d:#f0b898; --btntxt:#1a1025;
  --pinned:#2e1d40; --thumbA:#2a1838; --thumbB:#352045;
  --shadow:0 1px 4px rgba(0,0,0,.4);
  --shadow-lg:0 14px 38px rgba(0,0,0,.5);
  --danger:#e85d75; --danger-l:#3d1525;
  --hover:rgba(232,149,106,.06);
  --overlay:rgba(26,16,37,.55);
}

/* 薄荷 —— 清新自然 */
html[data-theme="mint"]{
  --green-dot:#10b981; --amber:#f59e0b;
  --bg:#f0fdf8; --card:#ffffff; --input:#ecfdf5; --line:#d1fae5;
  --txt:#0f2e23; --dim:#5f8a7a; --ok:#10b981;
  --blue:#059669; --blue-l:#d1fae5; --blue-d:#047857; --btntxt:#ffffff;
  --pinned:#e6f7f0; --thumbA:#d5f0e5; --thumbB:#c0e8d8;
  --shadow:0 1px 3px rgba(5,150,105,.06);
  --shadow-lg:0 8px 22px rgba(5,150,105,.12);
  --danger:#ef4444; --danger-l:#fee2e2;
  --hover:rgba(5,150,105,.04);
  --overlay:rgba(15,46,35,.35);
}

/* 拿铁 —— 暖棕咖啡 */
html[data-theme="latte"]{
  --green-dot:#6a8a3f; --amber:#d4930a;
  --bg:#faf6f1; --card:#ffffff; --input:#f5efe8; --line:#e8ddd0;
  --txt:#3b2d20; --dim:#8c7a68; --ok:#6a8a3f;
  --blue:#c2703e; --blue-l:#f5e6d8; --blue-d:#9a5528; --btntxt:#ffffff;
  --pinned:#f0e8dc; --thumbA:#ede3d5; --thumbB:#e0d2c0;
  --shadow:0 1px 3px rgba(60,45,32,.06);
  --shadow-lg:0 8px 22px rgba(60,45,32,.12);
  --danger:#c0392b; --danger-l:#fbeae7;
  --hover:rgba(60,45,32,.04);
  --overlay:rgba(60,45,32,.35);
}

/* 靛蓝 —— 科技紫蓝 */
html[data-theme="indigo"]{
  --green-dot:#22c55e; --amber:#f59e0b;
  --bg:#f5f5ff; --card:#ffffff; --input:#eef0ff; --line:#dde0f5;
  --txt:#1e1b4b; --dim:#6366a0; --ok:#22c55e;
  --blue:#4f46e5; --blue-l:#e0e7ff; --blue-d:#3730a3; --btntxt:#ffffff;
  --pinned:#e8e8f8; --thumbA:#e0e0f5; --thumbB:#d0d0ee;
  --shadow:0 1px 3px rgba(79,70,229,.06);
  --shadow-lg:0 8px 22px rgba(79,70,229,.12);
  --danger:#ef4444; --danger-l:#fee2e2;
  --hover:rgba(79,70,229,.04);
  --overlay:rgba(30,27,75,.35);
}

/* 珊瑚 —— 暖橙活力 */
html[data-theme="coral"]{
  --green-dot:#16a34a; --amber:#ea580c;
  --bg:#fff8f6; --card:#ffffff; --input:#fff0ec; --line:#fdd;
  --txt:#2d1f1a; --dim:#8c6b5f; --ok:#16a34a;
  --blue:#e8553a; --blue-l:#ffe8e2; --blue-d:#c0392b; --btntxt:#ffffff;
  --pinned:#fff0ec; --thumbA:#ffe8e2; --thumbB:#ffd6cc;
  --shadow:0 1px 3px rgba(232,85,58,.06);
  --shadow-lg:0 8px 22px rgba(232,85,58,.12);
  --danger:#dc2626; --danger-l:#fee2e2;
  --hover:rgba(232,85,58,.04);
  --overlay:rgba(45,31,26,.35);
}

/* 冰川 —— 冷调天蓝 */
html[data-theme="glacier"]{
  --green-dot:#10b981; --amber:#f59e0b;
  --bg:#f0f9ff; --card:#ffffff; --input:#e0f2fe; --line:#bae6fd;
  --txt:#0c2d48; --dim:#5b8aa5; --ok:#10b981;
  --blue:#0284c7; --blue-l:#e0f2fe; --blue-d:#0369a1; --btntxt:#ffffff;
  --pinned:#e0f0fa; --thumbA:#d5eef8; --thumbB:#c0e4f2;
  --shadow:0 1px 3px rgba(2,132,199,.06);
  --shadow-lg:0 8px 22px rgba(2,132,199,.12);
  --danger:#ef4444; --danger-l:#fee2e2;
  --hover:rgba(2,132,199,.04);
  --overlay:rgba(12,45,72,.35);
}

/* 极光 —— 冰岛夜空 */
html[data-theme="aurora"]{
  --green-dot:#34d399; --amber:#fbbf24;
  --bg:#0c1220; --card:#131b2e; --input:#131b2e; --line:#1e2d45;
  --txt:#e0ecf4; --dim:#5a7a94; --ok:#34d399;
  --blue:#2dd4a8; --blue-l:#0d2e28; --blue-d:#6ee7c0; --btntxt:#0c1220;
  --pinned:#162035; --thumbA:#152030; --thumbB:#1a2840;
  --shadow:0 1px 4px rgba(0,0,0,.45);
  --shadow-lg:0 14px 38px rgba(0,0,0,.5);
  --danger:#f87171; --danger-l:#2d1520;
  --hover:rgba(45,212,168,.06);
  --overlay:rgba(0,0,0,.55);
}

/* 石墨 —— 编织纹理暗色 */
html[data-theme="graphite"]{
  --green-dot:#22c55e; --amber:#eab308;
  --bg:#0e0e10; --card:#161618; --input:#161618; --line:#252528;
  --txt:#d4d4d8; --dim:#5c5c63; --ok:#22c55e;
  --blue:#e0e0e0; --blue-l:#1e1e22; --blue-d:#ffffff; --btntxt:#0a0a0a;
  --pinned:#1a1a1e; --thumbA:#141416; --thumbB:#1c1c20;
  --shadow:0 1px 4px rgba(0,0,0,.6);
  --shadow-lg:0 14px 38px rgba(0,0,0,.6);
  --danger:#ef4444; --danger-l:#2a1215;
  --hover:rgba(255,255,255,.04);
  --overlay:rgba(0,0,0,.6);
}

/* 跟随系统：浅色→默认，深色→深夜 */
@media (prefers-color-scheme: light){
  html[data-theme="auto"]{
    --green-dot:#18e05c; --amber:#f5a524;
    --bg:#f4f5f7; --card:#ffffff; --input:#f5f6f8; --line:#e5e8ec;
    --txt:#1f2329; --dim:#8b939d; --ok:#34a853;
    --blue:#1a8cff; --blue-l:#eaf3ff; --blue-d:#0f5fb0; --btntxt:#ffffff;
    --pinned:#eceef1; --thumbA:#eceef1; --thumbB:#e0e3e8;
    --shadow:0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 8px 22px rgba(16,24,40,.13);
    --danger:#e5484d; --danger-l:#fff0f0;
    --hover:rgba(16,24,40,.045);
    --overlay:rgba(24,28,34,.45);
  }
}

@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --green-dot:#4ade80; --amber:#fbbf24;
    --bg:#111113; --card:#1c1c1f; --input:#1c1c1f; --line:#2c2c30;
    --txt:#e5e5e7; --dim:#71717a; --ok:#4ade80;
    --blue:#3b82f6; --blue-l:#172554; --blue-d:#93c5fd; --btntxt:#ffffff;
    --pinned:#222225; --thumbA:#1e1e22; --thumbB:#28282e;
    --shadow:0 1px 3px rgba(0,0,0,.5);
    --shadow-lg:0 14px 38px rgba(0,0,0,.5);
    --danger:#f87171; --danger-l:#2d1515;
    --hover:rgba(255,255,255,.04);
    --overlay:rgba(0,0,0,.55);
  }
}


.authorlink{color:inherit;text-decoration:none;cursor:pointer}
.authorlink:hover{text-decoration:underline}
/* 全局隐藏滚动条，保留滚动能力 */
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
*{scrollbar-width:none!important;-ms-overflow-style:none!important}
::-webkit-scrollbar{display:none!important}
html,body,aside,#authors,.mediagrid,.hist,.wrap{scrollbar-width:none!important}
/* 滚动到两端时的"橡皮筋"和锚定跳动，会让整页框架晃 */
html{overscroll-behavior:none;overflow-anchor:none;scroll-behavior:auto}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
body{overscroll-behavior-y:none;overflow-anchor:none;overscroll-behavior-x:contain}
.wrap,.grid,aside,#authors{overscroll-behavior:contain;overflow-anchor:none}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

header{position:relative;flex:none;z-index:20;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  contain:layout style;
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);padding:10px 20px}
.bar{display:flex;align-items:center;gap:10px;max-width:1560px;margin:0 auto}
.status{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;
  background:var(--bg);font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.dot.ok{background:var(--green-dot,#18e05c);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--green-dot,#18e05c) 20%,transparent)}
.dot.bad{background:var(--danger);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.dot.cancel{background:var(--dim);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--dim) 16%,transparent)}
.dot.queued{background:var(--dim);box-shadow:0 0 0 3px color-mix(in srgb,var(--dim) 16%,transparent)}
.dot.wait{background:var(--amber,#f5a524);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--amber,#f5a524) 20%,transparent)}
input[type=text]{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line);
  color:var(--txt);padding:9px 13px;border-radius:9px;font-size:13.5px;outline:none;transition:.15s}
input[type=text]:focus{background:var(--card);border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,140,255,.12)}
button{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:9px 14px;
  border-radius:9px;cursor:pointer;font-size:13.5px;white-space:nowrap;transition:.15s;font-family:inherit}
button:hover{border-color:var(--line);background:var(--input)}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--btntxt);font-weight:600}
button.primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
button.primary:disabled{opacity:.55;cursor:default}
button.danger{color:var(--danger);border-color:var(--danger)}
button.danger:hover{background:var(--danger-l);border-color:var(--danger)}
button.small{padding:5px 10px;font-size:12.5px;border-radius:7px}

.wrap{display:flex;align-items:stretch;gap:16px;max-width:1560px;
  width:100%;margin:0 auto;padding:16px 20px 18px;
  flex:1 1 auto;min-height:0;overflow:hidden}
aside{position:static;width:236px;flex:0 0 236px;min-height:0;height:auto;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;align-self:stretch;
  scrollbar-width:none;-ms-overflow-style:none}

aside::-webkit-scrollbar{display:none;width:0;height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px;
  display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.panel h3 .chev{margin-left:auto;display:inline-flex;flex:none;opacity:.55;transition:transform .18s}
.panel h3 .chev svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.panel.collapsed h3{margin-bottom:0}
.panel.collapsed > :not(h3){display:none}
.panel.collapsed h3 .chev{transform:rotate(-90deg)}
.chip .cx{display:none;flex:none;width:16px;height:16px;border-radius:4px;color:var(--dim);
  font-size:13px;line-height:1;align-items:center;justify-content:center}
.chip:hover .cx{display:inline-flex}
.chip .cx:hover{background:var(--danger-l);color:var(--danger)}
.panel input[type=text]{width:100%;font-size:13px;padding:8px 11px}

.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:13.5px;transition:.12s}
.chip:hover{background:var(--bg)}
.chip.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.chip b{font-weight:500;color:var(--dim);font-size:12px}
.chip.on b{color:var(--blue)}

main{flex:1 1 auto;min-width:0;min-height:0;height:auto;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.banner{display:flex;align-items:center;gap:12px;background:var(--blue-l);border:1px solid var(--line);
  color:var(--blue-d);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner.hidden{display:none}
.banner button{margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:box-shadow .18s ease,border-color .18s ease;box-shadow:var(--shadow);
  position:relative;display:flex;flex-direction:column}
.card:hover{box-shadow:var(--shadow-lg);border-color:var(--line)}
.card.missing{opacity:.75}
body.bulkmode .card{cursor:pointer}
body.bulkmode .card::after{content:"";position:absolute;inset:0;border-radius:14px;
  border:2px solid transparent;pointer-events:none}
.card.selected{outline:2px solid var(--blue);outline-offset:-2px}
.thumb{position:relative;background:var(--bg);aspect-ratio:4/3;display:flex;
  align-items:center;justify-content:center;overflow:hidden;flex:none}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{color:var(--dim);font-size:30px}
.card .body{flex:1;display:flex;flex-direction:column;min-height:0}
.badge{position:absolute;top:8px;left:8px;
  background:color-mix(in srgb,var(--card) 94%,transparent);border-radius:6px;
  padding:2px 8px;font-size:11px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge.v{color:var(--blue-d)}
.badge.i{color:var(--blue-d)}
.badge.miss{background:var(--danger-l);color:var(--danger)}
.del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:7px;
  background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;
  display:none;align-items:center;justify-content:center;font-size:15px;line-height:1;padding:0}
.body{padding:10px 12px 12px}
.title{font-size:13.5px;font-weight:600;line-height:1.4;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.author{margin-top:7px;font-size:12.5px;color:var(--blue);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:5px;font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--dim);padding:70px 0}
.empty .big{font-size:34px;color:var(--dim);margin-bottom:10px}
.statpanel{font-size:12.5px;color:var(--dim);line-height:1.75}
.statpanel b{color:var(--txt);font-weight:600;font-size:13.5px}

.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.imgs img{margin:0;cursor:zoom-in}
.kvtitle{font-weight:600;line-height:1.45;display:block;margin-bottom:2px}
.kv{font-size:12.5px;color:var(--dim);display:grid;grid-template-columns:80px 1fr;gap:6px 12px;margin:12px 0 0}
.kv b{color:var(--txt);font-weight:500}

/* 选择框 */
.card.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,140,255,.18)}
.badge{top:auto;bottom:8px;left:8px;right:auto}
/* 批量条 */
.bulkbar{display:flex;align-items:center;gap:10px;background:var(--blue-l);border:1px solid var(--blue-l);
  color:var(--blue-d);border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:13px;font-weight:600}
.bulkbar.hidden{display:none}
.loadmore{display:flex;justify-content:center;padding:18px 0 6px}
.loadmore.hidden{display:none}
.bulkbar .sp{flex:1}
/* 收藏夹面板：跟平台/博主同级 */
.collpanel h3 .cname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collpanel h3 .ccnt{font-weight:500;color:var(--dim);font-size:11.5px;margin-left:2px;flex:none}
.collpanel h3 .chev{margin-left:auto}
.collpanel.on h3 .cname{color:var(--blue)}
.cbody{max-height:38vh;overflow:auto;margin:0 -4px}
.citem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;
  font-size:12.5px;color:var(--txt)}
.citem:hover{background:var(--bg)}
.citem .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ca{flex:none;color:var(--dim);font-size:11px;max-width:90px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cempty{color:var(--dim);font-size:12px;padding:4px 8px;line-height:1.5}

/* 右键菜单 */
.ctxmenu{position:fixed;z-index:120;min-width:190px;max-width:300px;padding:5px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-lg);display:none;font-size:13px;color:var(--txt)}
.ctxmenu.on{display:block}
.ctxmenu .mi{padding:7px 10px;border-radius:6px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxmenu .mi:hover{background:var(--hover)}
.ctxmenu .mi.danger{color:var(--danger)}
.ctxmenu .mi.danger:hover{background:var(--danger-l)}
.ctxmenu .sep{height:1px;background:var(--line);margin:4px 6px}

/* 批量添加作品到分类 */
.pick{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;
  justify-content:center;z-index:85;padding:24px}
.pick.on{display:flex}
.pickbox{background:var(--card);border-radius:14px;width:580px;max-width:100%;max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.pickhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pickhead b{font-size:14px}
.pickhead .sp{flex:1}
.pickbox input[type=text]{margin:10px 16px;width:calc(100% - 32px)}
.picklist{flex:1;overflow:auto;padding:2px 8px 8px;min-height:120px}
.pickrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;
  cursor:pointer;font-size:12.5px;color:var(--txt)}
.pickrow:hover{background:var(--bg)}
.pickrow input{flex:none;accent-color:var(--blue)}
.pickrow .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickrow .pa{flex:none;color:var(--dim);font-size:11.5px;max-width:130px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pickrow .ptag{flex:none;color:var(--blue-d);background:var(--blue-l);border-radius:4px;
  padding:1px 5px;font-size:10.5px}
.pickrow.in{opacity:.6}
.pickfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.pickfoot .sp{flex:1}
.pickfoot #pickCount{color:var(--dim);font-size:12px}

/* 自定义对话框 */
.dlg{position:fixed;inset:0;background:rgba(24,28,34,.4);display:none;align-items:center;
  justify-content:center;z-index:80;padding:24px}
.dlg.on{display:flex}
.dlgbox{background:var(--card);border-radius:14px;padding:22px;width:400px;max-width:100%;
  box-shadow:0 18px 44px rgba(16,24,40,.22)}
.dlgt{font-size:15px;font-weight:600;margin-bottom:10px}
.dlgx{font-size:13.5px;color:var(--dim);line-height:1.6;margin-bottom:18px;word-break:break-word;
  white-space:pre-line}
.dlgbtns{display:flex;justify-content:flex-end;gap:10px}
/* toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);
  background:rgba(28,31,35,.92);color:var(--btntxt);padding:10px 18px;border-radius:10px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.22s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.todo{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;margin-bottom:3px}
.todo:hover{background:var(--hover)}
.todochk{flex:none;width:15px;height:15px;margin:0;accent-color:var(--blue);cursor:pointer}
input.todoedit{flex:1;min-width:0 !important;width:auto;border:1px solid transparent;
  background:transparent;color:var(--txt);font:inherit;font-size:13px;
  line-height:1.45;padding:3px 5px;border-radius:5px;outline:none;
  box-shadow:none;-webkit-appearance:none}
input.todoedit:hover{background:var(--input);border-color:transparent}
input.todoedit:focus{background:var(--card);border-color:transparent;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 20%,transparent)}
.sub2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:14px 0 6px}
.sub2.withbtn{justify-content:space-between}
.sub2 .small{padding:2px 8px;font-size:12px;line-height:1.4}
.notebox{width:100%;min-height:96px;resize:vertical;box-sizing:border-box;
  padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--input);color:var(--txt);font:inherit;font-size:13px;
  line-height:1.65;outline:none}
.notebox:focus{background:var(--card);border-color:var(--blue);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 12%,transparent)}
.notebox::placeholder{color:var(--dim)}
.todoDel{flex:none;border:none;background:transparent;color:var(--dim);
  cursor:pointer;font-size:15px;padding:0 4px;line-height:1;border-radius:4px}
.todoDel:hover{background:var(--danger-l);color:var(--danger)}

.todo .pri{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px}
.pri.high{background:var(--danger-l);color:var(--danger)}
.pri.medium{background:var(--blue-l);color:var(--blue-d)}
.pri.low{background:var(--blue-l);color:var(--blue-d)}
.todo .why{color:var(--dim);font-size:12px;display:block;margin-top:2px}


/* 历史记录 */
.histwrap{flex:1;position:relative;min-width:160px}
.histwrap input{width:100%}
.hist{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);z-index:40;overflow:hidden;display:none}
.hist.on{display:block}
.hist .item{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;
  color:var(--dim);white-space:nowrap;overflow:hidden}
.hist .item:hover{background:var(--blue-l)}
.hist .item .u{flex:1;overflow:hidden;text-overflow:ellipsis}
.hist .item .x{flex:none;color:var(--dim2);font-size:15px;line-height:1;padding:0 3px;border-radius:4px;
  opacity:0;transition:.12s}
.hist .item:hover .x{opacity:1}
.hist .item .x:hover{color:var(--danger);background:var(--danger-l)}
.hist .more,.hist .clear{display:block;width:100%;text-align:center;padding:8px;font-size:12px;
  color:var(--dim);border:none;border-top:1px solid var(--line2);background:var(--input);cursor:pointer}
.hist .more:hover,.hist .clear:hover{background:var(--bg);color:var(--txt)}
.hist .clear{color:var(--danger)}
/* 任务面板 */
.tasks{position:fixed;top:64px;right:20px;width:390px;max-width:calc(100vw - 40px);
  z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:9px 13px;font-size:13px;pointer-events:auto;
  box-shadow:0 8px 24px rgba(16,24,40,.14)}
.task .dot{flex:none}
.task .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.task .s{flex:none;font-size:12px;color:var(--dim)}
.task button{flex:none;padding:3px 9px;font-size:12px;border-radius:6px}
/* 视频全屏 */
.vwrap{position:relative;width:100%;display:block}
/* 整个详情窗口全屏：视频在上，概要在下可滚动 */

/* 可多开的浮动详情面板 */
.dpanel{position:fixed;width:920px;max-width:94vw;height:76vh;min-width:400px;min-height:280px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:60;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(16,24,40,.30)}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:var(--input);cursor:move;user-select:none;flex:none}
.traffic{display:flex;gap:8px;flex:none;align-items:center}
.dotbtn{width:12px;height:12px;border-radius:50%;border:none;padding:0;cursor:pointer;
  font-size:9px;font-weight:800;line-height:12px;text-align:center;color:transparent;
  font-family:-apple-system,sans-serif;transition:color .1s}
.dotbtn.close{background:#ff5f57}
.dotbtn.min{background:#febc2e}
.dotbtn.max{background:#28c840}
.traffic:hover .dotbtn{color:rgba(0,0,0,.55)}
.dotbtn:active{filter:brightness(.85)}
.rs{position:absolute;z-index:12}
.rs.n{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rs.s{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rs.e{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rs.w{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rs.ne{top:0;right:0;width:14px;height:14px;cursor:nesw-resize}
.rs.nw{top:0;left:0;width:14px;height:14px;cursor:nwse-resize}
.rs.se{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.rs.sw{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize}
.dpanel.minimized{height:auto !important;min-height:0}
.dpanel.minimized .pbody{display:none}
.phead .t{flex:1;min-width:0;font-weight:600;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pbody{flex:1;overflow:auto;padding:14px 16px;min-height:0}
.dpanel:fullscreen{width:100vw;height:100vh;max-width:none;border-radius:0}
.dpanel:fullscreen .pbody{display:flex;flex-direction:column}
.dpanel:fullscreen .vwrap{flex:none}
.dpanel:fullscreen .vwrap video{max-height:58vh;width:100%;object-fit:contain;background:#000}
.dpanel:fullscreen .mediagrid .mcell{flex:0 0 clamp(320px, 32%, 560px)}
.pbody video{width:100%;max-height:62vh;border-radius:10px;display:block;background:#000}

/* 独立详情模式（在原生窗口里打开时） */
body.detail-mode header,
body.detail-mode .wrap,
body.detail-mode .tasks,
body.detail-mode .bulkbar{display:none !important}

/* 详情页：整页滚动，不受主页面「body 不滚」的约束 */
body.detail-mode{
  display:block !important;
  height:auto !important;
  min-height:100vh !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  background:var(--bg) !important;
}
html:has(body.detail-mode){ background:var(--bg) !important }
html:has(body.detail-mode){overflow-y:auto !important;height:auto !important}
#detailRoot{max-width:1180px;margin:0 auto;padding:0 22px 60px}
/* ---------- 自定义视频播放器 ---------- */
/* 沉浸式播放器：视频铺满视口，两侧用自身模糊副本 */
.player{position:relative;width:100%;height:100vh;overflow:hidden;
  background:#000;display:flex;align-items:center;justify-content:center}
.player .pbg{position:absolute;inset:-60px;background-size:cover;
  background-position:center;filter:blur(40px) brightness(.5) saturate(1.35);
  transform:scale(1.12);z-index:0;pointer-events:none}
.player video{position:relative;z-index:1;width:100%;height:100%;
  object-fit:contain;background:transparent;border-radius:0}

.pbar{position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;align-items:center;gap:10px;padding:26px 18px 16px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.5) 40%,rgba(0,0,0,.78))}
.pbtn{flex:none;width:32px;height:32px;padding:0;border:none;background:transparent;
  color:#fff;cursor:pointer;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;transition:background .12s}
.pbtn:hover{background:rgba(255,255,255,.14)}
.pbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pbtn.play svg{fill:currentColor;stroke:none}

.pseek{flex:1;min-width:60px;height:22px;display:flex;align-items:center;cursor:pointer;
  position:relative;touch-action:none}
.pseek .rail{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.26);
  overflow:hidden;position:relative}
.pseek .fill{height:100%;width:0;background:#fff;border-radius:2px;
  transition:width .08s linear}
.pseek:hover .rail{height:5px}
.pseek .knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .12s;
  box-shadow:0 1px 5px rgba(0,0,0,.35)}
.pseek:hover .knob,.pseek.dragging .knob{transform:translate(-50%,-50%) scale(1)}

.ptime{flex:none;font-size:12px;color:rgba(255,255,255,.6);
  font-variant-numeric:tabular-nums;letter-spacing:.2px;user-select:none}
.ptime b{color:#fff;font-weight:500}

.pbtn.rate{width:auto;min-width:44px;padding:0 8px;font-size:12px;
  font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
.player:fullscreen{height:100vh}
.player:fullscreen .pbar{background:rgba(20,20,22,.85);border-top-color:rgba(255,255,255,.12)}
.player:fullscreen .pbtn{color:#fff}
.player:fullscreen .ptime{color:rgba(255,255,255,.6)}
.player:fullscreen .ptime b{color:#fff}
.player:fullscreen .pseek .rail{background:rgba(255,255,255,.22)}

.iconbtn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;
  justify-content:center;flex:none}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.iconbtn.primary svg{stroke:#fff}
.iconbtn:hover{opacity:.85}
.dactbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}

/* 媒体分组展示 */
/* ---------- 图文：Telegram 式气泡网格 ---------- */
.pgallery{display:flex;flex-direction:column;gap:0;margin:0 -22px 14px}
.bubble{display:grid;gap:0;overflow:hidden;background:#000}
.bcell{position:relative;overflow:hidden;cursor:default;background:#0a0a0c}
.bcell img{width:100%;height:100%;object-fit:cover;display:block;cursor:default}
.bcell video{width:100%;height:100%;object-fit:cover;display:block}
.bcell .player{height:100%;border-radius:0}

/* 1 张：整宽，按图比例（上限 78vh） */
.bubble.n1{grid-template-columns:1fr}
.bubble.n1 .bcell{max-height:78vh}
.bubble.n1 .bcell img{object-fit:contain;max-height:78vh}

/* 2 张：左右各半，整体 2:1 */
.bubble.n2{grid-template-columns:1fr 1fr;aspect-ratio:2/1}

/* 3 张：左大占两行 + 右侧两张 */
.bubble.n3{grid-template-columns:1.62fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1.42/1}
.bubble.n3 .bcell:first-child{grid-row:span 2}

/* 4 张：2×2 */
.bubble.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1.16/1}

/* 5-6 张：上排 3 + 下排 3 */
.bubble.n5,.bubble.n6{grid-template-columns:repeat(3,1fr);aspect-ratio:1.5/1}

.mediagrid{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;
  scrollbar-width:thin}
/* 每格至少能放下 2 个：46% 宽，最小 300px，最大 520px */
.mediagrid .mcell{flex:0 0 clamp(300px, 46%, 520px)}
.mcell{position:relative;overflow:hidden;isolation:isolate;background:var(--bg);border-radius:12px;padding:8px}
.mcell img{width:100%;border-radius:8px;display:block;cursor:zoom-in}
.mcell .smallvid{width:100%;border-radius:8px;margin-top:8px;background:#000;max-height:150px;display:block}
/* 详情页缩略图上的实况角标：跟灯箱里的 chip 完全同一套样式 */
.ltag{position:absolute;top:12px;left:12px;z-index:2}
.mcell .cap{font-size:11px;color:var(--dim);margin-top:6px;text-align:center}

/* 设置表单 */
.subtitle{font-size:11.5px;color:var(--dim);font-weight:600;letter-spacing:.4px;
  margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line2)}
.subtitle:first-of-type{margin-top:8px;padding-top:0;border-top:none}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;padding:6px 4px;font-size:12.5px;border-radius:8px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:var(--btntxt)}
.aiactions{display:flex;align-items:center;gap:10px;margin-top:4px}

/* 图片放大 */
.lightbox{position:fixed;inset:0;background:rgba(8,9,11,.96);display:none;
  align-items:center;justify-content:center;z-index:200;cursor:default;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:contain}
.lightbox.on{display:flex}
.lightbox.dragging{cursor:grabbing}
.lbstage{position:absolute;inset:0;overflow:hidden;touch-action:none;transform-origin:50% 50%;transition:transform .18s cubic-bezier(.2,.8,.2,1);will-change:transform}
.lblayer{position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh;
  object-fit:contain;display:block;will-change:transform;
  transition:transform .22s cubic-bezier(.25,.7,.3,1);
  -webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.lblayer[hidden]{display:none}
#lbimgA,#lbimgB{-webkit-user-drag:none}
/* video 没有内在尺寸前会塌成 0×0，必须给明确宽高 */
#lbvid{width:100%;height:100%;object-fit:contain;background:#000}
#lbvid[hidden]{display:none}
.lbNav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;
  border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;z-index:4}
.lbNav:hover{background:rgba(255,255,255,.22)}
.lbNav.prev{left:22px}
.lbNav.next{right:22px}
.lbNav[hidden]{display:none}
.lbplayhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:8px;padding:11px 20px;border:none;
  border-radius:24px;background:rgba(0,0,0,.62);color:#fff;font-size:14px;
  font-family:inherit;cursor:pointer;backdrop-filter:blur(12px);z-index:4}
.lbplayhint:hover{background:rgba(0,0,0,.78)}
.lbplayhint svg{width:16px;height:16px;fill:currentColor;stroke:none}
.lbtop{position:absolute;top:16px;left:16px;z-index:5}
/* 实况 chip：参照 iOS 实况控件的深色半透明胶囊 + 点环图标 */
.livechip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 9px;
  border:none;border-radius:17px;background:rgba(22,20,22,.42);color:#fff;
  font-size:16.5px;font-weight:600;line-height:1;font-family:inherit;cursor:pointer;
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  text-shadow:0 1px 2px rgba(0,0,0,.18);
  transition:background .15s}
.livechip:hover{background:rgba(22,20,22,.56)}
.livechip[hidden]{display:none}
.livechip .lc{width:21px;height:21px;flex:none;fill:none;stroke:currentColor}
.livechip .caret{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.livechip.open .caret{transform:rotate(180deg)}

.livedrop{position:absolute;top:40px;left:0;width:212px;padding:5px 0;
  border-radius:18px;background:var(--card);
  box-shadow:0 16px 40px rgba(0,0,0,.24),0 2px 8px rgba(0,0,0,.06);
  overflow:hidden}
.livedrop[hidden]{display:none}
.livedrop button{display:flex;align-items:center;gap:13px;width:100%;height:54px;padding:0 18px;
  border:none;background:transparent;color:var(--txt);font-size:17.5px;font-family:inherit;
  font-weight:400;text-align:left;cursor:pointer}
.livedrop button:hover{background:var(--hover)}
.livedrop button svg{width:23px;height:23px;flex:none;fill:none;stroke:currentColor}
.livedrop button svg[hidden]{display:none}
.livedrop .sep{height:1px;background:var(--line);margin:0 12px}

.lightbox.zoomed{cursor:grab}
.lightbox.zoomed.dragging{cursor:grabbing}
.lbCount{position:absolute;top:18px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.7);font-size:12.5px;font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.4);padding:3px 12px;border-radius:20px;z-index:4;
  pointer-events:none}

/* 实况：左下角「播放实况」入口，自动播放关闭时也能一眼看见 */
.lblive{position:absolute;left:16px;bottom:20px;z-index:4;
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;
  border:none;border-radius:17px;background:rgba(0,0,0,.55);color:#fff;
  font-size:12.5px;font-family:inherit;cursor:pointer;backdrop-filter:blur(12px);
  transition:background .16s,color .16s}
.lblive[hidden]{display:none}
.lblive:hover{background:rgba(0,0,0,.72)}
.lblive svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.lblive.playing{background:rgba(26,140,255,.92);color:#fff}
.lblive.playing svg .tri{animation:lbpulse 1.1s ease-in-out infinite}
@keyframes lbpulse{0%,100%{opacity:1}50%{opacity:.35}}

@media(max-width:780px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:none}}
.statusbar{width:236px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  height:38px;padding:0 14px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);
  font-size:12.5px;color:var(--dim);user-select:none;box-sizing:border-box;
  overflow:hidden;position:relative;
  transition:border-color .2s ease, background .2s ease}

/* 状态点：8px 实心圆，带一圈柔光 */
.statusbar .dot{width:8px;height:8px;border-radius:50%;flex:none;
  transition:background .2s ease, box-shadow .2s ease}
/* 正常：亮绿 */
.statusbar .dot.ok{background:var(--green-dot,#18e05c);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--green-dot,#18e05c) 20%,transparent),
             0 0 6px color-mix(in srgb,var(--green-dot,#18e05c) 35%,transparent)}
/* 处理中：琥珀 + 呼吸 */
.statusbar .dot.wait{background:var(--amber,#f5a524);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--amber,#f5a524) 22%,transparent),
             0 0 8px color-mix(in srgb,var(--amber,#f5a524) 40%,transparent);
  animation:sdPulse 1.4s ease-in-out infinite}
/* 警告：琥珀（抖音 CDP 断开等） */
.statusbar .dot.warn{background:var(--amber,#f5a524);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--amber,#f5a524) 22%,transparent),
             0 0 6px color-mix(in srgb,var(--amber,#f5a524) 35%,transparent)}
/* 失败：红 */
.statusbar .dot.bad{background:var(--danger);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.statusbar .stext{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--txt);font-weight:500;text-align:center}

/* 处理中：琥珀描边 + 点呼吸 */
.statusbar.busy{cursor:pointer;border-color:color-mix(in srgb,var(--amber,#f5a524) 45%,var(--line))}
@keyframes sdPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.85)}
}
.statusbar.busy:hover{border-color:color-mix(in srgb,var(--amber,#f5a524) 75%,var(--line))}

/* 警告：琥珀描边 */
.statusbar.warn-border{border-color:color-mix(in srgb,var(--amber,#f5a524) 45%,var(--line))}
/* 失败：红描边 */
.statusbar.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}

/* 每个任务自己的进度条 */
.taskrow .tprog{flex:none;width:84px;height:4px;border-radius:2px;
  background:rgba(0,0,0,.09);overflow:hidden}
.taskrow .tbar{height:100%;width:0;border-radius:2px;background:var(--blue);
  transition:width .35s linear}
.taskrow .tbar.pending{background:color-mix(in srgb,var(--blue) 45%,transparent);
  width:100%!important}   /* 下载中总量未知：铺满淡化，不动 */
.taskrow .tbar.indet{background:var(--blue);width:38%!important;
  animation:tmove 1.3s ease-in-out infinite}   /* 抓取中：左右扫 */
@keyframes tmove{0%{margin-left:0}50%{margin-left:62%}100%{margin-left:0}}
.taskpop{position:absolute;top:60px;left:14px;width:420px;max-height:300px;overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:12px;display:none;
  box-shadow:var(--shadow-lg);z-index:80;padding:6px}
.taskpop.on{display:block}
.taskrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:12.5px}
.taskrow:hover{background:var(--bg)}
.taskrow .u{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.taskrow .s{flex:none;color:var(--dim);font-size:11.5px;min-width:70px;text-align:right}
.taskrow .x{flex:none;border:none;background:transparent;color:var(--dim);cursor:pointer;
  font-size:14px;padding:2px 6px;border-radius:6px}
.taskrow .x:hover{background:var(--danger-l);color:var(--danger)}
.batchbox{width:880px;max-width:96vw;height:84vh}
.batchtabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.batchtabs button{border:1px solid var(--line);background:transparent;color:var(--dim);
  font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer}
.batchtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.batchbar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
.batchbar input[type=text]{flex:1;min-width:140px;margin:0}
.batchonly{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);white-space:nowrap}
.batchlist{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.batchlist input{flex:1;margin:0}
.batchparse{margin-top:8px;font-size:12px;color:var(--dim);max-height:110px;overflow:auto;line-height:1.75;word-break:break-all}
.batchparse b{color:var(--txt)}
.batchparse .u{color:var(--blue)}

.batchgrid{flex:1;overflow:auto;padding:12px 14px;display:grid;

.bhint{font-size:12px;color:var(--dim)}
.bhint.warn{color:#e8a53a}
.bcard{position:relative;border-radius:10px;background:var(--bg);padding:6px;cursor:pointer;

<script>
window.onerror = (m, src, line) => {
  toast("脚本错误: " + m);
  return false;
};
const $ = s => document.querySelector(s);
let state = { q:"", platform:"", author:"", author_key:"", collection:null, active:true };   // author_key=博主稳定ID

/* 刷新时恢复上次的分类：sessionStorage 在同一个窗口内保留，App 重启后自动清空 */
(function restoreState(){
  try{
    const saved = sessionStorage.getItem("ma_state");
    if(saved){ Object.assign(state, JSON.parse(saved)); state.author_key = state.author_key || ""; }
  }catch(e){}
})();
function saveState(){
  try{ sessionStorage.setItem("ma_state", JSON.stringify(state)); }catch(e){}
}
let current = null;
let selected = new Set();
let __authors = [];
let __platforms = [];

function askConfirm(title, text, okText, danger){
  return new Promise(resolve => {
    $("#dlgTitle").textContent = title;
    $("#dlgText").textContent = text || "";
    $("#dlgOk").style.display = "";
    $("#dlgCancel").textContent = "取消";
    $("#dlgOk").textContent = okText || "确定";
    $("#dlgOk").className = danger ? "danger" : "primary";
    $("#dlg").classList.add("on");
    const done = v => { $("#dlg").classList.remove("on"); resolve(v); };
    $("#dlgOk").onclick = () => done(true);
    $("#dlgCancel").onclick = () => done(false);
    $("#dlg").onclick = e => { if(e.target.id === "dlg") done(false); };
  });
}
function askInput(title, hint, defaultValue){
  return new Promise(resolve => {
    $("#dlgTitle").textContent = title;
    $("#dlgText").textContent = hint || "";
    const inp = $("#dlgInput");
    inp.style.display = "";
    inp.value = defaultValue || "";
    $("#dlgOk").style.display = "";
    $("#dlgOk").textContent = "确定";
    $("#dlgOk").className = "primary";
    $("#dlgCancel").textContent = "取消";
    $("#dlg").classList.add("on");
    setTimeout(() => { inp.focus(); inp.select(); }, 60);
    const close = v => {
      $("#dlg").classList.remove("on");
      inp.style.display = "none";
      resolve(v);
    };
    const submit = () => {
      const v = inp.value.trim();
      close(v || null);
    };
    $("#dlgOk").onclick = submit;
    $("#dlgCancel").onclick = () => close(null);
    inp.onkeydown = e => {
      if(e.key === "Enter"){ e.preventDefault(); submit(); }
      if(e.key === "Escape"){ e.preventDefault(); close(null); }
    };
    $("#dlg").onclick = e => { if(e.target.id === "dlg") close(null); };
  });
}

/* ---------- 自定义右键菜单 ---------- */
let itemsCache = [];
let collectionsCache = [];
let panelSaved = {};
let ctxTarget = null;      // { item?, author?, platform? }

function showCtxMenu(x, y, opts){
  const m = document.getElementById("ctxmenu");
  const rows = [];
  const add = (label, fn, cls) => rows.push({label, fn, cls});
  const sep = () => rows.push({sep:true});

  // ---- 右键落在某个分类上 ----
  if(opts.collection){
    const c = opts.collection;
    add("添加作品…", () => openPickForCollection(c.id));
    sep();
    add("重命名分类「" + c.name + "」…", async () => {
      const name = await askInput("重命名分类", "", c.name);
      if(!name || name === c.name) return;
      toast("处理中…");
      const r = await fetch("/api/collection/rename", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id: c.id, name })}).then(x=>x.json()).catch(()=>null);

/* ---------- 长按拖动排序 ---------- */
let dragState = null;
let dragRaf = null;

/** FLIP：DOM 顺序变化后让其他元素从旧位置滑到新位置 */
function flip(container, mutate){
  const items = [...container.children].filter(c => c.classList.contains("chip"));
  const before = new Map();
  items.forEach(c => before.set(c, c.getBoundingClientRect().top));
  mutate();
  items.forEach(c => {
    if(c.classList.contains("dragging")) return;
    const b = before.get(c);
    if(b === undefined) return;
    const dy = b - c.getBoundingClientRect().top;
    if(!dy) return;
    c.style.transition = "none";
    c.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      c.style.transition = "transform .2s cubic-bezier(.2,.8,.3,1)";
      c.style.transform = "";
    });
  });
}

function makeDraggable(container, kind, keyOf){
  container.querySelectorAll(".chip[data-drag]").forEach(chip => {
    let holdTimer = null;
    let downX = 0, downY = 0;

    chip.addEventListener("pointerdown", e => {
      if(e.button !== 0 || dragState) return;
      downX = e.clientX; downY = e.clientY;
      const rect = chip.getBoundingClientRect();

      // 按下瞬间就禁掉文本选择，否则长按那 360ms 里已经被选上了
      document.body.classList.add("no-select");
      window.getSelection()?.removeAllRanges();
      const unlock = () => {
        document.body.classList.remove("no-select");
        window.getSelection()?.removeAllRanges();
      };
      chip.addEventListener("pointerup", unlock, {once:true});
      chip.addEventListener("pointercancel", unlock, {once:true});
      chip.addEventListener("pointerleave", () => {
        // 没有在拖拽就解锁（长按没触发、只是划过去了）
        if(!dragState) unlock();
      }, {once:true});

      holdTimer = setTimeout(() => {
        holdTimer = null;
        beginDrag(chip, e, rect);
      }, 360);

      const onMove = ev => {
        if(holdTimer && Math.hypot(ev.clientX - downX, ev.clientY - downY) > 8){
          clearTimeout(holdTimer); holdTimer = null;
        }
      };
      chip.addEventListener("pointermove", onMove, {passive:true});
      chip.addEventListener("pointerup", () => {
        if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
        chip.removeEventListener("pointermove", onMove);
      }, {once:true});
    });

    function beginDrag(el, downEvent, rect){
      const ph = document.createElement("div");
      ph.className = "chip-ph";
      ph.style.height = rect.height + "px";
      el.parentNode.insertBefore(ph, el);

      el.classList.add("dragging");
      el.style.position = "fixed";
      el.style.left = rect.left + "px";
      el.style.top = rect.top + "px";
      el.style.width = rect.width + "px";
      el.style.margin = "0";

      document.body.classList.add("is-dragging");

      dragState = {
        el, ph, container, kind, keyOf,
        startX: downEvent.clientX,
        startY: downEvent.clientY,
        curX: 0, curY: 0,
      };
      if(navigator.vibrate) navigator.vibrate(6);
    }
  });
}

document.addEventListener("pointermove", e => {
  const st = dragState;
  if(!st) return;
  e.preventDefault();
  st.curX = e.clientX - st.startX;
  st.curY = e.clientY - st.startY;

  if(dragRaf) return;
  dragRaf = requestAnimationFrame(() => {
    dragRaf = null;
    const s = dragState;
    if(!s) return;

    // 用 transform 跟随鼠标：不触发重排，零延迟
    s.el.style.transform = `translate(${s.curX}px, ${s.curY}px)`;
    // 兜底：把任何已经产生的选区清掉
    const sel = window.getSelection();
    if(sel && sel.rangeCount && String(sel).length) sel.removeAllRanges();

    // 计算插入位置
    // 只有带 data-drag 的才参与让位，「全部」固定不动
    const others = [...s.container.children]
      .filter(c => c !== s.el && c !== s.ph && c.dataset.drag === "1");
    let target = null;
    for(const o of others){
      const r = o.getBoundingClientRect();
      if(e.clientY < r.top + r.height / 2){ target = o; break; }
    }
    if(s.ph.nextElementSibling !== (target || null)){
      flip(s.container, () => {
        if(target) s.container.insertBefore(s.ph, target);
        else s.container.appendChild(s.ph);
      });
    }
  });
}, {passive:false});

document.addEventListener("pointerup", async () => {
  // 无论有没有在拖拽，都解锁选择
  document.body.classList.remove("no-select");
  const st = dragState;
  if(!st) return;
  dragState = null;

  flip(st.container, () => {
    st.container.insertBefore(st.el, st.ph);
    st.ph.remove();
  });

  st.el.classList.remove("dragging");
  st.el.style.cssText = "";
  st.el.style.position = "relative";
  document.body.classList.remove("is-dragging");

  const keys = [...st.container.children]
    .filter(c => c.classList.contains("chip") && c.dataset.drag === "1")
    .map(c => st.keyOf(c)).filter(Boolean);

  fetch("/api/reorder", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({kind: st.kind, keys})}).catch(() => {});
});

document.addEventListener("pointercancel", () => {
  document.body.classList.remove("no-select");
  const st = dragState;
  if(!st) return;
  dragState = null;
  st.container.insertBefore(st.el, st.ph);
  st.ph.remove();
  st.el.classList.remove("dragging");
  st.el.style.cssText = "";
  st.el.style.position = "relative";
  document.body.classList.remove("is-dragging");
});

const _toastQueue = [];
const TOAST_MAX = 3;
const TOAST_DURATION = 3000;
function toast(msg){
  const container = document.getElementById("toastContainer");
  if(!container) return;
  // If already at max, remove oldest
  while(_toastQueue.length >= TOAST_MAX){
    const old = _toastQueue.shift();
    if(old && old.parentNode) old.remove();
  }
  const t = document.createElement("div");
  t.className = "toast";
  t.style.cssText = "position:relative;left:auto;bottom:auto;transform:none;background:rgba(28,31,35,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .22s;pointer-events:auto;white-space:nowrap";
  t.textContent = msg;
  container.appendChild(t);
  _toastQueue.push(t);
  requestAnimationFrame(() => { t.style.opacity = "1"; });
  setTimeout(() => {
    t.style.opacity = "0";
    setTimeout(() => {
      if(t.parentNode) t.remove();
      const idx = _toastQueue.indexOf(t);
      if(idx >= 0) _toastQueue.splice(idx, 1);
    }, 250);
  }, TOAST_DURATION);
}

function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function apiFetch(url, opts){
  try{
    const r = await fetch(url, opts);
    return await r.json();
  }catch(e){
    toast("网络请求失败：" + (e.message || "请检查服务是否运行"));
    return null;
  }
}

function fmtSize(n){
  if(!n) return "0 B";
  const u = ["B","KB","MB","GB"]; let i = 0;
  while(n >= 1024 && i < u.length-1){ n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
}

const ITEMS_PAGE = 60;
let hasMoreItems = false;
let _loadToken = 0;

function itemsQuery(offset){
  const p = new URLSearchParams({ q: state.q, platform: state.platform,
                                  limit: String(ITEMS_PAGE), offset: String(offset || 0) });
  if(state.author_key) p.set("author_key", state.author_key);
  else p.set("author", state.author);
  if(state.collection) p.set("collection", state.collection);
  return p;
}

function updateLoadMore(){
  const box = $("#loadMore");
  if(box) box.classList.toggle("hidden", !hasMoreItems);
}

async function loadAll(){
  saveState();
  const myToken = ++_loadToken;
  try{
    const [items, plats, authors, stats, cols] = await Promise.all([
      fetch("/api/items?" + itemsQuery(0)).then(r => r.json()),
      fetch("/api/platforms").then(r => r.json()),
      fetch("/api/authors").then(r => r.json()),
      fetch("/api/stats").then(r => r.json()),
      fetch("/api/collections").then(r => r.json()).catch(() => [])
    ]);
    if(myToken !== _loadToken) return; // stale, discard
    collectionsCache = Array.isArray(cols) ? cols : [];
    // 分类被删掉了 → 清掉选择重新加载
    if(state.collection && !collectionsCache.some(c => String(c.id) === String(state.collection))){
      state.collection = null;
      return loadAll();
    }
    const shown = state.active ? (items || []) : [];
    itemsCache = shown;
    hasMoreItems = (items || []).length >= ITEMS_PAGE;
    updateLoadMore();
    __authors = authors || [];
    __platforms = plats || [];
    renderItems(shown); renderPlatforms(plats); renderAuthors(authors);
    renderCollections(collectionsCache);
    const emptyEl = $("#empty");
    if(emptyEl){
      if(state.active && shown.length === 0){
        emptyEl.style.display = "";
        emptyEl.innerHTML = state.collection
          ? '<div class="big">☆</div>这个分类还没有内容：右键左侧分类标题 → 添加作品'
          : '<div class="big">◍</div>没有匹配的作品';
      }else if(!state.active){
        emptyEl.style.display = "";
        emptyEl.innerHTML = '<div class="big">◍</div>点左侧「全部」、平台或博主开始浏览';
      }else{
        emptyEl.style.display = "none";
      }
    }
    (items || []).forEach(i => { if(i.source_url) urlTitleMap[i.source_url] = i.title; });
    const sp = $("#statBody");
    if(sp) sp.innerHTML = `总计 <b>${stats.items}</b> 条作品<br>占用空间 <b>${fmtSize(stats.size)}</b>`;
    const miss = items.filter(i => i.missing).length;
    if(miss > 0 && !state.q && !state.platform && !state.author){
      $("#bannerText").textContent = `有 ${miss} 条记录的文件已不存在（可能在 Finder 里被删掉了）`;
      $("#banner").classList.remove("hidden");
    }else{
      $("#banner").classList.add("hidden");
    }
  }catch(e){
    setStatus("bad", "数据读取失败");
  }
}

function hasLivePair(files){
  const imgs = new Set();
  (files || []).forEach(f => { if(f.kind === "image") imgs.add(f.name.replace(/\.[^.]+$/, "")); });
  return (files || []).some(f => {
    if(f.kind !== "video") return false;
    const base = f.name.replace(/\.[^.]+$/, "");
    if(/\.mov$/i.test(f.name)) return imgs.has(base);
    if(/_live$/i.test(base)) return imgs.has(base.replace(/_live$/i, ""));
    return false;
  });
}

function mediaPath(url){
  try{ return new URL(url, location.origin).searchParams.get("p") || ""; }catch(e){ return ""; }
}
function mediaVer(url){
  try{ return new URL(url, location.origin).searchParams.get("v") || ""; }catch(e){ return ""; }
}
function thumbURL(f){
  const p = mediaPath(f && f.url);
  return p ? "/api/thumb?v=" + encodeURIComponent(mediaVer(f.url)) + "&p=" + encodeURIComponent(p) + "&w=480" : "";
}
function posterURL(f){
  const p = mediaPath(f && f.url);
  return p ? "/api/poster?v=" + encodeURIComponent(mediaVer(f.url)) + "&p=" + encodeURIComponent(p) : "";
}

function renderItems(items){
  const g = $("#grid"); g.innerHTML = "";
  $("#empty").style.display = "none";
  const frag = document.createDocumentFragment();
  items.forEach(it => {
    const fl = it.files || [];
    const vidF = fl.find(f => f.kind === "video" && !/_live|^\d+\.mov$/i.test(f.name));
    const imgF = fl.find(f => f.kind === "image");
    const isVid = !!vidF;
    const card = document.createElement("div");
    card.className = "card" + (it.missing ? " missing" : "") + (it.analyzed ? " analyzed" : "");
    card.dataset.id = String(it.id);
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="thumb">
        ${vidF ? `<img src="${posterURL(vidF)}" loading="lazy" decoding="async" alt="">`
               : imgF ? `<img src="${thumbURL(imgF)}" loading="lazy" decoding="async" alt="">`
               : `<div class="ph">◌</div>`}
        <div class="badge ${it.missing ? "miss" : (isVid ? "v" : "i")}">${it.missing ? "文件已丢失" : (it.type === "视频" ? "视频" : it.type === "音频" ? "音频" : "图文")}</div>
      </div>
      <div class="body">
        <div class="title">${esc(it.title) || "（无标题）"}</div>
        <div class="author"><a href="#" class="authorlink" data-author="${esc(it.author || "")}" data-author-key="${esc(it.author_id || it.author || "")}">${esc(it.author) || "未知博主"}</a></div>
        <div class="meta">
          <span>${esc(it.platform_cn)}</span>
          <span>${it.created || it.saved}</span>
          ${it.digg ? `<span>♡ ${it.digg}</span>` : ""}
        </div>
      </div>`;
    if(selected.has(it.id)) card.classList.add("selected");
    // 记录按下位置，用来判断"拖动选文字"还是"真的点击"；同时支持长按进多选
    let downPos = null;
    let longTimer = null;
    let longFired = false;          // 长按已经触发过，用来吃掉松手后的那次 click
    card.onmousedown = ev => {
      downPos = { x: ev.clientX, y: ev.clientY };
      longFired = false;
      longTimer = setTimeout(() => {
        longTimer = null;
        longFired = true;           // ← 标记：这次点击是长按引起的
        enterBulkMode();
        if(!selected.has(it.id)) toggleSelect(it.id, card);
      }, 500);
    };
    card.onmouseup = () => { if(longTimer){ clearTimeout(longTimer); longTimer = null; } };
    card.onmouseleave = () => { if(longTimer){ clearTimeout(longTimer); longTimer = null; } };
    card.onclick = (ev) => {
      // 0) 长按刚触发过 → 吃掉这次点击，否则会把刚选中的又取消掉
      if(longFired){ longFired = false; return; }
      // 1) 拖动超过 5px（选文字）→ 不当点击
      if(downPos){
        const moved = Math.hypot(ev.clientX - downPos.x, ev.clientY - downPos.y);
        downPos = null;
        if(moved > 5) return;
      }
      // 长按刚触发过 → 这次点击不再响应
      if(longTimer === null && bulkMode && !selected.has(it.id) === false) { /* 继续走多选切换 */ }
      // 2) 页面上有选中的文字 → 用户想 ⌘C，别抢
      const sel = window.getSelection && window.getSelection();
      if(sel && sel.toString().trim().length > 0) return;
      // 3) 点博主名/外链 → 交给专门的处理
      if(ev.target.closest(".authorlink") || ev.target.closest("a[href^='http']")) return;
      if(selected.size > 0){ toggleSelect(it.id, card); return; }
      // App 内：交给原生窗口；浏览器里：回退到浮动面板
      if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openDetail){
        window.webkit.messageHandlers.openDetail.postMessage({
          id: String(it.id), title: it.title || "",
          platform: it.platform || "", item_id: it.item_id || ""
        });
      }else{
        openItem(it);
      }
    };
    frag.appendChild(card);
  });
  g.appendChild(frag);
  // Keyboard navigation for card grid
  g.addEventListener("keydown", e => {
    const card = e.target.closest(".card");
    if(!card) return;
    if(e.key === "Enter"){
      e.preventDefault();
      card.click();
      return;
    }
    const cards = [...g.querySelectorAll(".card")];
    const idx = cards.indexOf(card);
    if(idx < 0) return;
    // Compute columns from grid layout
    const gridStyle = getComputedStyle(g);
    const cols = gridStyle.gridTemplateColumns.split(" ").length || 1;
    let next = -1;
    if(e.key === "ArrowRight") next = Math.min(idx + 1, cards.length - 1);
    else if(e.key === "ArrowLeft") next = Math.max(idx - 1, 0);
    else if(e.key === "ArrowDown") next = Math.min(idx + cols, cards.length - 1);
    else if(e.key === "ArrowUp") next = Math.max(idx - cols, 0);
    if(next >= 0 && next !== idx){
      e.preventDefault();
      cards[next].focus();
    }
  });
}

  const box = $("#collectionPanels"); if(!box) return;
  box.innerHTML = "";
  (list || []).forEach(c => {
    const panel = document.createElement("div");
    panel.className = "panel collpanel" + (String(state.collection) === String(c.id) ? " on" : "");
    panel.dataset.panel = "col-" + c.id;
    panel.dataset.cid = c.id;
    const items = c.items || [];
    panel.innerHTML = `<h3>
        <span class="cname" title="在网格中查看「${esc(c.name)}」">${esc(c.name)}</span>
        <b class="ccnt">${c.n}</b>

        ? items.map(it => `<div class="citem" data-id="${it.id}" title="${esc(it.title || "")}">
             <span class="ct">${esc(it.title || "（无标题）")}</span>
