async function openWorkById(id){
  const it = await fetch("/api/item?id=" + encodeURIComponent(id)).then(r => r.json()).catch(() => null);
  if(!it || !it.id){ toast("作品不存在"); return; }
  if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openDetail){
    window.webkit.messageHandlers.openDetail.postMessage({
      id: String(it.id), title: it.title || "",
      platform: it.platform || "", item_id: it.item_id || ""
    });
  }else{
    openItem(it);
  }
}

async function deleteCollection(c){
  if(!c) return;
  const ok = await askConfirm("删除分类「" + c.name + "」？",
    "只删除这个分类，里面的作品不会被删除。", "删除", true);
  if(!ok) return;
  const r = await fetch("/api/collection/delete", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ id: c.id })
  }).then(x => x.json()).catch(() => null);
  if(r && r.ok){
    if(String(state.collection) === String(c.id)) state.collection = null;
    toast("已删除分类「" + c.name + "」");
    loadAll();
  }else{
    toast("删除失败：" + ((r && r.error) || "未知错误"));
  }
}

async function addItemsToCollection(ids){
  if(!ids || !ids.length) return;
  const names = collectionsCache.map(c => c.name);
  const hint = names.length
    ? "已有分类：" + names.join("、") + "\n输入分类名；新名字会自动创建"
    : "输入一个分类名，会自动创建";
  const name = await askInput("加入分类", hint, names[0] || "");
  if(!name) return;
  const r = await fetch("/api/collection/add_by_name", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, item_ids: ids })
  }).then(x => x.json()).catch(() => null);
  if(r && r.ok){
    toast(`已把 ${ids.length} 项加入「${r.name}」`);
    exitBulkMode();
    loadAll();
  }else{
    toast("加入失败：" + ((r && r.error) || "未知错误"));
  }
}

async function removeItemsFromCollection(ids){
  if(!state.collection || !ids || !ids.length) return;
  const c = collectionsCache.find(x => String(x.id) === String(state.collection));
  const r = await fetch("/api/collection/remove", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ id: state.collection, item_ids: ids })
  }).then(x => x.json()).catch(() => null);
  if(r && r.ok){
    toast(`已从「${c ? c.name : "分类"}」移出 ${r.changed} 项`);
    exitBulkMode();
    loadAll();
  }else{
    toast("移出失败：" + ((r && r.error) || "未知错误"));
  }
}

async function createCollection(){
  const name = await askInput("新建分类", "例如：灵感、教程、待看", "");
  if(!name) return null;
  const r = await fetch("/api/collection/create", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name })
  }).then(x => x.json()).catch(() => null);
  if(r && r.ok){ toast("已创建分类「" + name + "」"); loadAll(); return r; }
  toast("创建失败：" + ((r && r.error) || "未知错误"));
  return null;
}

/* 分类里「添加作品」：批量勾选，一次加一个或多个 */
let pickState = null;

async function openPickForCollection(cid){
  const c = collectionsCache.find(x => String(x.id) === String(cid));
  if(!c){ toast("分类不存在"); return; }
  let all = [], ex = [];
  try{
    const [items, ids] = await Promise.all([
      fetch("/api/items?limit=500").then(r => r.json()),
      fetch("/api/collection/ids?id=" + encodeURIComponent(cid)).then(r => r.json())
    ]);
    all = Array.isArray(items) ? items : [];
    ex = (ids && ids.ids) || [];
  }catch(e){}
  pickState = { cid, cname: c.name, all, existing: new Set(ex.map(String)) };
  $("#pickTitle").textContent = "添加作品到「" + c.name + "」";
  $("#pickQ").value = "";
  renderPickList();
  $("#pick").classList.add("on");
  setTimeout(() => $("#pickQ").focus(), 60);
}

function renderPickList(){
  if(!pickState) return;
  const q = ($("#pickQ").value || "").trim().toLowerCase();
  const rows = pickState.all.filter(it =>
    !q || ((it.title || "") + " " + (it.author || "")).toLowerCase().includes(q));
  $("#pickList").innerHTML = rows.map(it => {
    const inCol = pickState.existing.has(String(it.id));
    return `<label class="pickrow${inCol ? " in" : ""}">
      <input type="checkbox" value="${it.id}" ${inCol ? "checked disabled" : ""}>
      <span class="pt">${esc(it.title || "（无标题）")}</span>
      <span class="pa">${esc(it.author || "")}</span>
      ${inCol ? '<span class="ptag">已在</span>' : ''}
    </label>`;
  }).join("") || `<div style="padding:18px;text-align:center;color:var(--dim);font-size:12.5px">没有匹配的作品</div>`;
  updatePickCount();
}

function updatePickCount(){
  const n = $("#pickList").querySelectorAll('input[type="checkbox"]:checked:not(:disabled)').length;
  $("#pickCount").textContent = n ? `新选 ${n} 项` : "勾选要加入的作品";
  $("#pickOk").disabled = n === 0;
}

function closePick(){
  $("#pick").classList.remove("on");
  pickState = null;
}

/* 侧栏折叠：平台 / 博主 / 分类 / 搜索，状态记在 localStorage */
function wirePanel(panel){
  if(!panel || panel.dataset.wired) return;
  panel.dataset.wired = "1";
  const h = panel.querySelector("h3"); if(!h) return;
  if(!h.querySelector(".chev")){
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
    h.appendChild(chev);
  }
  if(panelSaved[panel.dataset.panel]) panel.classList.add("collapsed");
  h.addEventListener("click", e => {
    if(e.target.closest("button, .cname, .ccnt")) return;
    panel.classList.toggle("collapsed");
    panelSaved[panel.dataset.panel] = panel.classList.contains("collapsed");
    try{ localStorage.setItem("ma_panels", JSON.stringify(panelSaved)); }catch(e){}
  });
}

function initPanels(){
  try{ panelSaved = JSON.parse(localStorage.getItem("ma_panels") || "{}") || {}; }catch(e){ panelSaved = {}; }
  document.querySelectorAll("aside .panel[data-panel]").forEach(wirePanel);
}

function renderPlatforms(rows){
  const box = $("#platforms"); box.innerHTML = "";
  const total = rows.reduce((a,b) => a + b.n, 0);
  const mk = (label, n, key, cur) => {
    const d = document.createElement("div");
    d.className = "chip" + (cur === key ? " on" : "");
    d.tabIndex = 0;
    d.role = "button";
    d.setAttribute("role", "button");
    d.innerHTML = `<span>${esc(label)}</span><b>${n}</b>`;
    d.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); d.click(); }
    });
    return d;
  };
  const all = mk("全部", total, "", state.platform);
  if(state.active && !state.platform && !state.collection) all.classList.add("on");
  else all.classList.remove("on");
  all.onclick = () => {
    state.active = true;
    state.collection = null;
    state.platform = ""; state.author = "";
    loadAll();
  };
  box.appendChild(all);
  rows.forEach(r => {
    const d = mk(r.platform_cn, r.n, r.platform_cn, state.platform);
    d.dataset.platformKey = r.platform || "";
    d.dataset.platformLabel = r.platform_cn || "";
    d.dataset.drag = "1";
    d.style.position = "relative";
    d.onclick = () => { state.active = true; state.platform = r.platform_cn; state.author = ""; state.collection = null; loadAll(); };
    box.appendChild(d);
  });
  makeDraggable(box, "platforms", c => c.dataset.platformKey || "");
}

function renderAuthors(rows){
  const box = $("#authors"); box.innerHTML = "";
  const filtered = state.platform ? rows.filter(r => r.platform_cn === state.platform) : rows;
  const all = document.createElement("div");
  all.className = "chip" + (state.active && !state.author && !state.collection ? " on" : "");
  all.tabIndex = 0;
  all.setAttribute("role", "button");
  all.innerHTML = "<span>全部</span>";
  all.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); all.click(); }
  });
  all.onclick = () => {
    state.active = true;
    state.collection = null;
    state.author = ""; state.author_key = ""; state.platform = "";
    loadAll();
  };
  box.appendChild(all);
  filtered.forEach(r => {
    const d = document.createElement("div");
    const key = r.author_key || r.author || "";
    const on = state.author_key ? state.author_key === key : state.author === r.author;
    d.className = "chip" + (on ? " on" : "");
    d.tabIndex = 0;
    d.setAttribute("role", "button");
    d.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.author) || "?"}</span><b>${r.n}</b>`;
    d.dataset.author = r.author || "";
    d.dataset.authorKey = key;
    d.dataset.drag = "1";
    d.style.position = "relative";
    if(r.pinned) d.classList.add("pinned");
    d.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); d.click(); }
    });
    d.onclick = () => { state.active = true; state.author = r.author; state.author_key = key; state.platform = ""; state.collection = null; loadAll(); };
    box.appendChild(d);
  });
  makeDraggable(box, "authors", c => c.dataset.author || "");
  // 自动滚动到当前选中的博主
  if(state.author){
    const on = box.querySelector(".chip.on");
    if(on) setTimeout(() => on.scrollIntoView({block: "nearest", behavior: "smooth"}), 60);
  }
}

let panelZ = 60;
let urlTitleMap = {};   // source_url → 标题

function addResizers(p){
  const MINW = 420, MINH = 260;
  ["n","s","e","w","ne","nw","se","sw"].forEach(dir => {
    const h = document.createElement("div");
    h.className = "rs " + dir;
    p.appendChild(h);
    h.addEventListener("mousedown", e => {
      e.preventDefault(); e.stopPropagation();
      const r = p.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const sw = r.width, sh = r.height, sl = r.left, st = r.top;
      const move = ev => {
        let w = sw, hh = sh, l = sl, t = st;
        if(dir.includes("e")) w = Math.max(MINW, sw + (ev.clientX - sx));
        if(dir.includes("s")) hh = Math.max(MINH, sh + (ev.clientY - sy));
        if(dir.includes("w")){ w = Math.max(MINW, sw - (ev.clientX - sx)); l = sl + (sw - w); }
        if(dir.includes("n")){ hh = Math.max(MINH, sh - (ev.clientY - sy)); t = st + (sh - hh); }
        p.style.width = w + "px";
        p.style.height = hh + "px";
        p.style.left = l + "px";
        p.style.top = t + "px";
      };
      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  });
}

function openItem(it){
  // 已打开的同一作品 → 置顶
  const exist = [...document.querySelectorAll(".dpanel")].find(p => p.dataset.item === String(it.id));
  if(exist){ exist.style.zIndex = ++panelZ; return; }

  const idx = document.querySelectorAll(".dpanel").length;
  const p = document.createElement("div");
  p.className = "dpanel";
  p.dataset.item = String(it.id);
  p.style.left = Math.min(72 + idx * 26, Math.max(20, window.innerWidth - 960)) + "px";
  p.style.top = Math.min(56 + idx * 26, Math.max(20, window.innerHeight - 640)) + "px";
  p.style.zIndex = ++panelZ;
  p.innerHTML = `
    <div class="phead">
      <div class="traffic">
        <button class="dotbtn close" data-act="close" title="关闭">✕</button>
        <button class="dotbtn min" data-act="min" title="收起">−</button>
        <button class="dotbtn max" data-act="full" title="全屏">⤢</button>
      </div>
      <div class="t">${esc(it.title) || "（无标题）"}</div>
      <button class="small" data-act="reveal">Finder</button>
    </div>
    <div class="pbody"></div>`;
  document.body.appendChild(p);

  const body = p.querySelector(".pbody");
  const meta = renderPanelContent(it, body) || {};

  // 八向拖拽改大小
  addResizers(p);

  // 置顶
  p.addEventListener("mousedown", () => { p.style.zIndex = ++panelZ; }, true);

  // 拖动
  const head = p.querySelector(".phead");
  head.addEventListener("mousedown", e => {
    if(e.target.closest("button")) return;
    const ox = e.clientX - p.offsetLeft, oy = e.clientY - p.offsetTop;
    const move = ev => {
      p.style.left = Math.max(0, Math.min(window.innerWidth - 120, ev.clientX - ox)) + "px";
      p.style.top = Math.max(0, Math.min(window.innerHeight - 60, ev.clientY - oy)) + "px";
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  // 按钮
  p.querySelector('[data-act="close"]').onclick = () => p.remove();
  p.querySelector('[data-act="min"]').onclick = () => {
    p.classList.toggle("minimized");
    p.querySelector('[data-act="min"]').textContent = p.classList.contains("minimized") ? "+" : "−";
    p.querySelector('[data-act="min"]').title = p.classList.contains("minimized") ? "展开" : "收起";
  };
  // 双击标题栏也能收起/展开
  p.querySelector(".phead").addEventListener("dblclick", e => {
    if(e.target.closest("button")) return;
    p.querySelector('[data-act="min"]').click();
  });
  p.querySelector('[data-act="reveal"]').onclick = () => fetch("/api/reveal", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ path: it.folder })
  });
  const maxBtn = p.querySelector('[data-act="full"]');
  maxBtn.onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else p.requestFullscreen?.().catch(() => toast("这个环境不支持全屏"));
  };
  p.addEventListener("fullscreenchange", () => {
    const on = document.fullscreenElement === p;
    maxBtn.textContent = on ? "⤡" : "⤢";
    maxBtn.title = on ? "退出全屏" : "全屏";
  });
  p.addEventListener("webkitfullscreenchange", () => {
    const on = document.webkitFullscreenElement === p;
    maxBtn.textContent = on ? "⤡" : "⤢";
  });
  return p;
}

// 原帖优先交给本机客户端（有注册对应 scheme 才用），否则回落到网页
function nativeURLFor(platform, itemId, sourceUrl){
  const id = itemId ? String(itemId) : "";
  switch(String(platform || "").toLowerCase()){
    case "xiaohongshu":
      return id ? "xhsdiscover://item/" + encodeURIComponent(id) : "xhsdiscover://";
    case "douyin":
      return id ? "douyin-pc://aweme/detail/" + encodeURIComponent(id) : "";
    case "telegram": {
      const m = String(sourceUrl || "").match(/t\.me\/(?:s\/)?([^/?#]+)\/(\d+)/);
      return m ? "tg://resolve?domain=" + encodeURIComponent(m[1]) + "&post=" + m[2] : "tg://";
    }
    case "bilibili":
      return id ? "bilibili://video/" + encodeURIComponent(id) : "bilibili://";
    case "youtube":
      return id ? "youtube://watch?v=" + encodeURIComponent(id) : "youtube://";
    case "tiktok":
      return id ? "snssdk1233://aweme/detail/" + encodeURIComponent(id) : "snssdk1233://";
    case "weibo": return "sinaweibo://";
    case "reddit": return "reddit://";
    case "instagram": return "instagram://";
    case "kuaishou": return "kwai://";
    default: return "";
  }
}

// 博主主页也优先交给本机客户端
function nativeUserURLFor(platform, authorUrl, authorId){
  const u = String(authorUrl || "");
  const id = String(authorId || "");
  switch(String(platform || "").toLowerCase()){
    case "xiaohongshu": {
      const m = u.match(/user\/profile\/([0-9a-f]+)/i);
      const uid = (m && m[1]) || id;
      return uid ? "xhsdiscover://user/" + encodeURIComponent(uid) : "xhsdiscover://";
    }
    case "douyin": {
      const m = u.match(/user\/([^/?#]+)/);
      return m ? "douyin-pc://user/profile/" + encodeURIComponent(m[1]) : "";
    }
    case "telegram": {
      const m = u.match(/t\.me\/([^/?#]+)/);
      return m ? "tg://resolve?domain=" + encodeURIComponent(m[1]) : "tg://";
    }
    case "bilibili": {
      const m = u.match(/space\.bilibili\.com\/(\d+)/);
      return m ? "bilibili://space/" + m[1] : "bilibili://";
    }
    case "youtube":
      return "youtube://";
    default:
      return "";
  }
}

function renderPanelContent(it, b){
  b.innerHTML = "";
  const files = it.files || [];
  // 只把「真正的实况配对」合成一组：01.jpg + 01_live.mp4，或 01.jpg + 01.mov。
  // 普通同名视频（01.mp4）不再跟图片配对，避免把普通图文误标成实况。
  const imgByStem = new Map();
  files.forEach(f => {
    if(f.kind !== "image") return;
    const stem = f.name.replace(/\.[^.]+$/, "");
    if(!imgByStem.has(stem)) imgByStem.set(stem, f);
  });
  const groups = new Map();
  const groupOf = key => {
    if(!groups.has(key)) groups.set(key, {});
    return groups.get(key);
  };
  files.forEach(f => {
    if(f.kind === "audio") return;   // 音频只用于导出，界面上不展示
    const base = f.name.replace(/\.[^.]+$/, "");
    if(f.kind === "image"){
      const g = groupOf(base);
      if(!g.image) g.image = f;
      return;
    }
    const stem = base.replace(/_(live|mov)$/i, "");
    const liveName = /_live$/i.test(base) || /\.mov$/i.test(f.name);
    if(liveName && imgByStem.has(stem)){
      const g = groupOf(stem);
      if(!g.video) g.video = f;      // 实况伴生视频：跟着图片走
    }else{
      const g = groupOf("__v__:" + f.url);
      g.video = f;                   // 普通视频：单独一格
    }
  });
  const keys = [...groups.keys()].sort((a, b) => {
    const ai = a.startsWith("__v__:"), bi = b.startsWith("__v__:");
    if(ai !== bi) return ai ? 1 : -1;
    return a.localeCompare(b, "zh-CN", {numeric: true});
  });

  if(it.missing){
    const tip = document.createElement("div");
    tip.className = "banner";
    tip.style.margin = "0 0 14px";
    tip.textContent = "这条记录的文件已经不在磁盘上了（可能在 Finder 里被删除）。可以点右上角「删除」清掉记录。";
    b.appendChild(tip);
  }

  const onlyVideo = keys.length === 1 && groups.get(keys[0]).video
                    && !groups.get(keys[0]).image;
  if(onlyVideo){
    const vsrc = groups.get(keys[0]).video.url;
    let vposter = "";
    try{
      vposter = "/api/poster?p=" + encodeURIComponent(decodeURIComponent(vsrc.split("p=")[1] || ""));
    }catch(e){}
    const pl = buildPlayer(vsrc, vposter);
    b.appendChild(pl.wrap);
    setTimeout(() => pl.video.play().catch(()=>{}), 200);
  }else if(keys.length){
    // 图文：Telegram 式气泡网格，每气泡最多 4 张
    const gallery = document.createElement("div");
    gallery.className = "pgallery";

    const cells = [];
    keys.forEach(k => {
      const g = groups.get(k);
      const cell = document.createElement("div");
      cell.className = "bcell";

      let thumb = null;
      if(g.image){
        const im = document.createElement("img");
        im.src = thumbURL(g.image); im.loading = "lazy"; im.decoding = "async";
        cell.appendChild(im);
        thumb = im;
      }else if(g.video){
        const pl = buildPlayer(g.video.url, (() => {
          try{ return "/api/poster?p=" + encodeURIComponent(decodeURIComponent(g.video.url.split("p=")[1] || "")); }
          catch(e){ return ""; }
        })());
        cell.appendChild(pl.wrap);
        thumb = pl.wrap;
      }

      // 实况 = 同 stem 的图 + 实况伴生视频（01.jpg + 01_live.mp4 / 01.mov）
      const isLive = !!(g.image && g.video);
      let liveTag = null;
      if(isLive){
        // 跟灯箱里的实况 chip 用同一套 DOM，视觉 1:1
        liveTag = document.createElement("button");
        liveTag.type = "button";
        liveTag.className = "livechip ltag";
        liveTag.title = "查看实况";
        liveTag.innerHTML = document.getElementById("lbLiveBtn").innerHTML;
        cell.appendChild(liveTag);
      }
      const meta = {
        cell,
        img: g.image ? g.image.url : "",
        vid: isLive ? g.video.url : "",     // 非实况时清空 vid，避免误判
        isLive
      };
      cells.push(meta);
      if(thumb) thumb.onclick = () => openLightbox(cells, cells.indexOf(meta));
      if(liveTag){
        const idx = cells.indexOf(meta);
        liveTag.onclick = ev => {
          ev.stopPropagation();
          openLightbox(cells, idx);
        };
      }
    });

    // 每 4 张拼一个气泡
    const PER = 4;
    for(let i = 0; i < cells.length; i += PER){
      const chunk = cells.slice(i, i + PER);
      const bubble = document.createElement("div");
      bubble.className = "bubble n" + chunk.length;
      chunk.forEach(c => bubble.appendChild(c.cell));
      gallery.appendChild(bubble);
    }
    b.appendChild(gallery);
  }
  applyAutoState();          // 让缩略图上的实况角标与当前自动播放状态一致
  const kv = document.createElement("div"); kv.className = "kv";
  const created = it.created || (it.created_ts ? new Date(it.created_ts * 1000).toLocaleString("zh-CN", {hour12:false}).replace(/\//g, "-") : "");
  kv.innerHTML = `
    <span>标题</span><b class="kvtitle">${esc(it.title || "")}</b>
    <span>平台</span><b>${esc(it.platform_cn)}</b>
    <span>博主</span><b><a href="#" class="authorlink" data-author="${esc(it.author || "")}" data-author-key="${esc(it.author_id || it.author || "")}">${esc(it.author) || "未知博主"}</a>${it.author_url ? ` · <a href="${esc(it.author_url)}" class="outlink" data-native="${esc(nativeUserURLFor(it.platform, it.author_url, it.author_id))}">主页</a>` : ""}</b>
    <span>发布时间</span><b>${esc(created) || "—"}</b>
    <span>互动</span><b>♡ ${it.digg ?? "—"} ｜ 评论 ${it.comment ?? "—"} ｜ 收藏 ${it.collect ?? "—"}</b>
    <span>原帖</span><b><a href="${esc(it.source_url)}" target="_blank" class="outlink" data-native="${esc(nativeURLFor(it.platform, it.item_id, it.source_url))}">打开</a></b>`;
  b.appendChild(kv);
  // 有 .mov 配对才显示「导入到照片」
  const hasLive = hasLivePair(files);
  if(hasLive){
    const bar = document.createElement("div");
    bar.className = "dactbar";
    const btn = document.createElement("button");
    btn.className = "primary small";
    btn.textContent = "导入实况照片到「照片」App";
    btn.title = "把这组的 .jpg + .mov 合成真实况照片写入相册";
    btn.onclick = async () => {
      if(btn.disabled) return;
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = "正在准备实况…";
      // 0) 先把 01.jpg + 01_live.mp4 合成 App 认的 01.mov（已转过会直接复用）
      let prep = null;
      try{
        prep = await fetch("/api/prepare_live", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ folder: it.folder })
        }).then(x => x.json());
      }catch(e){}
      btn.disabled = false;
      btn.textContent = label;
      if(!prep || !prep.ok){
        const why = (prep && (prep.error || (prep.detail && prep.detail.error))) || "未知错误";
        toast("实况配对准备失败：" + why);
        return;
      }
      if(!prep.pairs){
        toast("这条作品里没有可导入的实况配对");
        return;
      }
      // 1) App 内直接桥接（最快）
      if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.importLive){
        window.webkit.messageHandlers.importLive.postMessage({ dir: it.folder });
        toast("已准备好 " + prep.pairs + " 组实况，开始导入");
        return;
      }
      // 2) 浏览器 / 桥不可用 → 写后端队列，App 轮询取走
      const r = await fetch("/api/import_live", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ item_id: it.id })}).then(x => x.json()).catch(() => null);
      if(r && r.ok) toast("已交给 App 排队导入");
      else toast("发起导入失败：" + ((r && r.error) || "未知错误"));
    };
    bar.appendChild(btn);
    b.insertBefore(bar, b.firstChild);
  }
  return { hasLive };
}

/* ---------- AI 分析 ---------- */
const PRI_TEXT = { high: "高", medium: "中", low: "低" };

/* ---------- 自定义视频播放器 ---------- */
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
const ICON_FULL = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_EXIT = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

function clockText(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  return h ? h + ":" + pad(m) + ":" + pad(ss) : m + ":" + pad(ss);
}

function buildPlayer(src, poster){
  const wrap = document.createElement("div");
  wrap.className = "player";

  const bg = document.createElement("div");
  bg.className = "pbg";
  if(poster) bg.style.backgroundImage = `url("${poster}")`;
  wrap.appendChild(bg);

  const v = document.createElement("video");
  v.src = src;
  if(poster) v.poster = poster;
  v.playsInline = true;
  v.preload = "metadata";
  wrap.appendChild(v);

  const bar = document.createElement("div");
  bar.className = "pbar";
  bar.innerHTML = `
    <button class="pbtn play" title="播放 / 暂停（空格）">${ICON_PLAY}</button>
    <div class="pseek" title="拖动跳转">
      <div class="rail"><div class="fill"></div></div>
      <div class="knob"></div>
    </div>
    <span class="ptime"><b>0:00</b> / 0:00</span>
    <button class="pbtn rate" title="倍速">1×</button>
    <button class="pbtn full" title="全屏（F）">${ICON_FULL}</button>`;
  wrap.appendChild(bar);

  const btnPlay = bar.querySelector(".play");
  const btnFull = bar.querySelector(".full");
  const seek = bar.querySelector(".pseek");
  const fill = bar.querySelector(".fill");
  const knob = bar.querySelector(".knob");
  const timeEl = bar.querySelector(".ptime");

  // 视频真正开始播放后，把模糊背景换成视频画面本身
  v.addEventListener("playing", () => {
    if(!bg.style.backgroundImage && v.videoWidth){
      try{
        const c = document.createElement("canvas");
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext("2d").drawImage(v, 0, 0);
        bg.style.backgroundImage = `url("${c.toDataURL("image/jpeg", 0.6)}")`;
      }catch(e){}
    }
  });
  v.addEventListener("loadedmetadata", render);

  function render(){
    const dur = v.duration || 0, cur = v.currentTime || 0;
    const pct = dur ? (cur / dur) * 100 : 0;
    fill.style.width = pct + "%";
    knob.style.left = pct + "%";
    timeEl.innerHTML = `<b>${clockText(cur)}</b> / ${clockText(dur)}`;
    btnPlay.innerHTML = v.paused ? ICON_PLAY : ICON_PAUSE;
    btnFull.innerHTML = document.fullscreenElement ? ICON_EXIT : ICON_FULL;
  }

  ["timeupdate","play","pause","ended","durationchange"].forEach(ev => v.addEventListener(ev, render));

  // 倍速：0.75 / 1 / 1.25 / 1.5 / 2 循环
  const RATES = [1, 1.25, 1.5, 2, 0.75];
  let rateIdx = 0;
  const btnRate = bar.querySelector(".rate");
  btnRate.onclick = () => {
    rateIdx = (rateIdx + 1) % RATES.length;
    v.playbackRate = RATES[rateIdx];
    btnRate.textContent = RATES[rateIdx] + "×";
  };

  btnPlay.onclick = () => { v.paused ? v.play() : v.pause(); };
  v.addEventListener("click", () => { v.paused ? v.play() : v.pause(); });

  btnFull.onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else wrap.requestFullscreen?.().catch(()=>{});
  };
  // Use per-element listener instead of global to avoid leak
  wrap.addEventListener("fullscreenchange", render);

  let dragging = false;
  function seekTo(clientX){
    const r = seek.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    if(v.duration) v.currentTime = pct * v.duration;
    fill.style.width = (pct * 100) + "%";
    knob.style.left = (pct * 100) + "%";
  }
  seek.addEventListener("pointerdown", e => {
    dragging = true; seek.classList.add("dragging");
    seek.setPointerCapture?.(e.pointerId); seekTo(e.clientX);
  });
  seek.addEventListener("pointermove", e => { if(dragging) seekTo(e.clientX); });
  seek.addEventListener("pointerup", e => {
    dragging = false; seek.classList.remove("dragging"); seekTo(e.clientX);
  });
  seek.addEventListener("pointercancel", () => { dragging = false; seek.classList.remove("dragging"); });

  wrap.tabIndex = 0;
  wrap.addEventListener("keydown", e => {
    switch(e.key){
      case " ": case "k": e.preventDefault(); v.paused ? v.play() : v.pause(); break;
      case "ArrowLeft": e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 5); break;
      case "ArrowRight": e.preventDefault(); v.currentTime = Math.min(v.duration||0, v.currentTime + 5); break;
      case "f": case "F": e.preventDefault(); btnFull.click(); break;
      case "m": case "M": e.preventDefault(); v.muted = !v.muted; break;
    }
  });

  render();
  return { wrap, video: v };
}

function fmtSec(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), ss = sec%60;
  const pad = n => String(n).padStart(2, "0");
  return h ? h + ":" + pad(m) + ":" + pad(ss) : m + ":" + pad(ss);
}

/* ---------- 历史记录 ---------- */
const HIST_KEY = "ma_history";
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch(e){ return []; } }
function saveHistory(h){ try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 60))); } catch(e){} }
function addHistory(url, title){
  let h = loadHistory().filter(x => x.url !== url);
  h.unshift({ url, title: title || "", ts: Date.now() });
  saveHistory(h);
}

function updateHistoryTitle(url, title){
  if(!url || !title) return;
  const h = loadHistory();
  const it = h.find(x => x.url === url);
  if(it && it.title !== title){ it.title = title; saveHistory(h); }
  if($("#hist").classList.contains("on")) renderHistory();
}
let histExpanded = false;
function renderHistory(){
  const h = loadHistory();
  const box = $("#hist");
  if(!h.length){ box.innerHTML = ""; box.classList.remove("on"); return; }
  const shown = histExpanded ? h : h.slice(0, 8);
  let html = shown.map(x => {
    const label = x.title || urlTitleMap[x.url] || x.url.replace(/^https?:\/\//, "");
    return `<div class="item" data-url="${esc(x.url)}" title="${esc(x.url)}">
      <span class="u">${esc(label)}</span>
      <span class="x" title="删除这条">×</span></div>`;
  }).join("");
  if(h.length > 8){
    html += `<button class="more" id="histMore">${histExpanded ? "收起" : "展开全部（" + h.length + " 条）"}</button>`;
  }
  html += `<button class="clear" id="histClear">清空历史记录</button>`;
  box.innerHTML = html;
  box.querySelectorAll(".item").forEach(el => {
    el.onclick = e => {
      if(e.target.classList.contains("x")){
        e.stopPropagation();
        const u = el.dataset.url;
        saveHistory(loadHistory().filter(x => x.url !== u));
        renderHistory();
        return;
      }
      $("#url").value = el.dataset.url;
      box.classList.remove("on");
      $("#url").focus();
    };
  });
  if($("#histMore")) $("#histMore").onclick = () => { histExpanded = !histExpanded; renderHistory(); };
  if($("#histClear")) $("#histClear").onclick = () => { saveHistory([]); renderHistory(); box.classList.remove("on"); };
  box.classList.add("on");
}

function extractUrls(text){
  const out = [], seen = new Set();
  const s = String(text || "").replace(/\u200b/g, "");
  const re = /https?:\/\/[^\s<>"'“”‘’，。；：！？、（）【】《》〈〉「」『』]+/gi;
  let m;
  while ((m = re.exec(s))) {
    let u = m[0].replace(/[)\]}>"'“”‘’，。；：！？、.,;:!?]+$/g, "");
    if (!/^https?:\/\//i.test(u)) continue;
    try { new URL(u); } catch (e) { continue; }
    if (!seen.has(u)) { seen.add(u); out.push(u); }
  }
  return out;
}
function extractUrl(text){ const a = extractUrls(text); return a.length ? a[0] : null; }

function isDouyinUserURL(u){
  return /^https?:\/\/(?:www\.)?douyin\.com\/user\//i.test(u || "");
}

  }).then(r => r.json());

  addTask(url);
}

async function startPolling(){
  if(taskTimer) return;
  const tick = async () => {
    try {
      let list = [];
      try { list = await fetch("/api/tasks?" + Date.now()).then(r => r.json()); } catch(e){}
      if(!Array.isArray(list)) list = [];
      try { renderTasks(list); } catch(e) { console.error("renderTasks", e); }
      const active = list.filter(t => t.status === "running" && !t.queued).length;
      const queued = list.filter(t => t.status === "running" && t.queued).length;
      const running = active + queued;
      const done = list.filter(t => t.status === "done").length;
      const failed = list.filter(t => t.status === "error").length;
      for (const t of list) {
        if (t.status !== "done") continue;
        const isNew = !seenDoneTasks.has(t.id);
        seenDoneTasks.add(t.id);
        if (isNew && !firstPoll) {
          if (t.duplicate || t.skipped) {
            if (!toastedDuplicates.has(t.id)) {
              toastedDuplicates.add(t.id);
              const nm = (t.item && t.item.title) || (t.progress && t.progress.step) || "这条";
              toast("「" + nm.slice(0, 20) + "」已存在");
            }
          } else {
            showNewItems(1);
          }
        }
      }
      if(running){
        setStatus("wait", active
          ? `处理中 ${active} 条` + (queued ? ` · 排队 ${queued}` : "")
          : `排队 ${queued} 条`);
      }else if(!_cdpConnected){
        setStatus("warn", "未连接");
      }else if(failed){
        setStatus("bad", `${failed} 条失败`);
      }else{
        setStatus("ok", "正常");
      }
      firstPoll = false;
      const pending = list.some(t => t.status === "running");
      if(!pending && !list.length){ try { renderTasks([]); } catch(e){} }
      // Memory leak prevention: clear tracking Sets when idle
      if(!pending && (!list.length || list.every(t => t.status === "done" || t.status === "error" || t.status === "cancelled"))){
        seenDoneTasks.clear();
        toastedDuplicates.clear();
        dismissedTasks.clear();
      }
      // Cap dismissedTasks at 500 entries
      if(dismissedTasks.size > 500){
        const arr = [...dismissedTasks];
        dismissedTasks = new Set(arr.slice(arr.length - 250));
      }
    } catch(e) {
      console.error("poll", e);
    } finally {
      // 无论如何都要续上，否则一次异常就再也不刷新了
      const delay = list.some(t => t.status === "running") ? 1200 : 5000;
      taskTimer = setTimeout(tick, delay);
    }
  };
  taskTimer = setTimeout(tick, 300);
}

let taskPopOpen = false;
let dismissedTasks = new Set();

// 按平台粗估耗时（秒），用于进度条
function etaFor(url){
  const u = (url || "").toLowerCase();
  if(/douyin|iesdouyin/.test(u)) return 25;
  if(/xhslink|xiaohongshu/.test(u)) return 18;
  if(/bilibili|b23\.tv/.test(u)) return 45;
  if(/youtube|youtu\.be/.test(u)) return 70;
  if(/instagram/.test(u)) return 40;
  if(/weibo/.test(u)) return 30;
  if(/reddit/.test(u)) return 35;
  if(/tiktok/.test(u)) return 30;
  return 40;
}
function renderTasks(list){
  const nowSec = Date.now() / 1000;
  const shown = list.filter(t => {
    if(dismissedTasks.has(t.id)) return false;
    if(t.status === "running") return true;
    // 失败的多留一会儿（20 秒），成功的 5 秒后自动消失
    const keep = t.status === "error" ? 20 : (t.status === "cancelled" ? 3 : 5);
    const fin = t.finished || 0;
    return fin > 0 && (nowSec - fin) < keep;
  }).slice(0, 40);
  const st = $("#status"), caret = $("#statusCaret"), pop = $("#taskPop");

  if(!shown.length){
    st.classList.remove("busy");
    pop.classList.remove("on");
    taskPopOpen = false;
    pop.innerHTML = "";
    $("#sbar").style.width = "0%";
    return;
  }
  st.classList.add("busy");
  if(taskPopOpen) pop.classList.add("on");

  // 状态栏只显示数量，进度在各任务行里
  const active = shown.filter(t => t.status === "running" && !t.queued);
  const queuedN = shown.filter(t => t.status === "running" && t.queued).length;
  const stText = document.getElementById("statusText");
  if(stText){
    stText.textContent = active.length
      ? `处理中 ${active.length} 条` + (queuedN ? ` · 排队 ${queuedN}` : "")
      : (queuedN ? `排队 ${queuedN} 条` : "正常");
  }

  pop.innerHTML = shown.map(t => {
    const running = t.status === "running";
    const queued = running && !!t.queued;
    const secs = t.started ? Math.max(0, Math.round(Date.now()/1000 - t.started)) : 0;
    // 任务名：优先用帖子标题，没有就用简化链接
    let label = (t.item && t.item.title) || "";
    if(!label){
      try{
        const u = new URL(t.url);
        label = u.hostname.replace(/^www\./, "") + u.pathname.replace(/\/$/, "");
      }catch(e){ label = t.url || ""; }
    }
    // 每个任务自己的进度
    // 正计时：mm:ss（超过 1 小时显示 h:mm:ss）
    const el = secs;
    const timeTxt = el < 3600
      ? Math.floor(el/60) + ":" + String(el%60).padStart(2,"0")
      : Math.floor(el/3600) + ":" + String(Math.floor(el%3600/60)).padStart(2,"0") + ":" + String(el%60).padStart(2,"0");
    let pct = 0, pending = true, note = timeTxt;
    let barCls = "";              // 进度条样式：indet=抓取中晃动 / pending=下载中淡化
    const pg = t.progress;
    if(queued){
      note = "排队中";
      barCls = "pending";
    } else if(pg && pg.phase === "download" && pg.total > pg.done){
      // 知道总量 → 真实百分比 + 剩余时间
      pct = Math.min(99, (pg.done / pg.total) * 100);
      pending = false;
      const spd = (pg.speed || 0) / 1048576;
      const eta = pg.eta || 0;
      note = spd > 0.05 ? spd.toFixed(1) + "MB/s" : "";
      if(eta >= 1) note += (note ? " · 剩 " : "") + (eta < 60 ? Math.round(eta) + "s" : Math.round(eta/60) + "m");
      if(!note) note = Math.round(pct) + "%";
    } else if(pg && pg.phase === "download"){
      // 字节在长但不知道总量（抖音）
      const mb = (pg.done || 0) / 1048576;
      const spd = (pg.speed || 0) / 1048576;
      note = mb.toFixed(1) + "MB" + (spd > 0.05 ? " · " + spd.toFixed(1) + "MB/s" : "");
      pending = true; barCls = "pending";
    } else if(pg && pg.phase === "connect"){ note = "连接中"; pending = true; }
    else if(pg && pg.phase === "verify"){ pct = 97; pending = false; note = "校验中"; }
    else if(pg && pg.phase === "parse"){ note = pg.step || "处理中"; pending = true; barCls = "indet"; }
    else if(running){ note = "准备中"; pending = true; barCls = "indet"; }

    const done = t.status === "done";
    const cancel = t.status === "cancelled";
    const skip = done && (t.skipped || t.duplicate);
    const dotCls = queued ? "queued" : (running ? "wait" : (cancel ? "cancel" : (done ? "ok" : "bad")));
    let endTxt = "完成";
    if(skip) endTxt = "已存在";
    else if(cancel) endTxt = "已取消";
    else if(!done) endTxt = t.error_reason ? "失败：" + t.error_reason.slice(0, 30) : "失败";
    return `<div class="taskrow" data-id="${esc(t.id)}">
      <span class="dot ${dotCls}"></span>
      <span class="u" title="${esc(t.url)}">${esc(label)}</span>
      ${running && !queued ? `<div class="tprog"><div class="tbar${barCls ? " " + barCls : ""}" style="width:${pct.toFixed(1)}%"></div></div>` : ""}
      <span class="s" title="${esc(t.error_reason || "")}">${running ? note : endTxt}</span>
      <button class="x" title="${running ? "取消这个任务" : "移除记录"}">✕</button>
    </div>`;
  }).join("");

  pop.querySelectorAll(".taskrow .x").forEach(btn => {
    btn.onclick = async ev => {
      ev.stopPropagation();
      const row = btn.closest(".taskrow");
      const id = row.dataset.id;
      const isRunning = row.querySelector(".dot")?.classList.contains("wait");
      if(!isRunning){
        // 已结束（完成/失败/取消）：直接从 UI 移除，不再等 API
        dismissedTasks.add(id);
        row.remove();
        return;
      }
      // 运行中：调 cancel API
      btn.disabled = true;
      btn.textContent = "…";
      try{
        const r = await fetch("/api/task/" + encodeURIComponent(id) + "/cancel",
                              {method:"POST"}).then(x=>x.json()).catch(()=>null);
        if(r && r.ok){
          dismissedTasks.add(id);
          row.remove();
        }else{
          btn.disabled = false; btn.textContent = "✕";
        }
      }catch(e){
        btn.disabled = false;
        btn.textContent = "✕";
      }
    };
  });
}


/* ---------- 图片放大 ---------- */


document.addEventListener("fullscreenchange", () => {
  const b = document.getElementById("mfull");
  if(b) b.title = document.fullscreenElement ? "退出全屏" : "窗口全屏（视频 + 概要同屏）";
});

let lbSlides = [], lbIdx = 0;
let lbFront = 0;                  // 0 → #lbimgA 在前，1 → #lbimgB 在前
let lbToken = 0;                  // 切换动画代号：新动作让旧回调全部失效
let lbSettleTimer = 0;
let lbAnimating = false;
let lbDrag = null;
let lbSwipedAt = 0;
let lbLastSwipeAt = 0;
let lbLiveToken = 0;

const livePref = {
  auto: localStorage.getItem("ma_live_auto") !== "0"
};

let lbZoom = 1, lbZx = 0, lbZy = 0, lbPan = null;
const LB_ZOOM_MAX = 4;

function lbStage(){ return $("#lightbox .lbstage"); }
function lbApplyZoom(){
  const st = lbStage();
  if(!st) return;
  st.style.transform = lbZoom <= 1.001 ? "" : `translate(${lbZx}px, ${lbZy}px) scale(${lbZoom})`;
  $("#lightbox").classList.toggle("zoomed", lbZoom > 1.001);
}
function lbResetZoom(){
  lbZoom = 1; lbZx = 0; lbZy = 0; lbPan = null;
  const st = lbStage();
  if(st){ st.style.transition = "none"; lbApplyZoom(); st.style.transition = ""; }
}
function lbSetZoom(s, cx, cy){
  const old = lbZoom;
  s = Math.max(1, Math.min(LB_ZOOM_MAX, s));
  if(Math.abs(s - old) < 0.001) return;
  if(cx === undefined){ cx = window.innerWidth / 2; cy = window.innerHeight / 2; }
  const px = cx - window.innerWidth / 2, py = cy - window.innerHeight / 2;
  if(old > 0.001){
    lbZx = px - (px - lbZx) * (s / old);
    lbZy = py - (py - lbZy) * (s / old);
  }
  lbZoom = s;
  if(lbZoom <= 1.001){ lbZoom = 1; lbZx = 0; lbZy = 0; }
  const st = lbStage();
  if(st) st.style.transition = "transform .12s ease-out";
  lbApplyZoom();
}

function lbLayer(i){ return $(i === 0 ? "#lbimgA" : "#lbimgB"); }
function lbCurImg(){ return lbLayer(lbFront); }
function lbBackImg(){ return lbLayer(1 - lbFront); }
function lbSlide(){ return lbSlides[lbIdx] || {}; }
function lbVid(){ return $("#lbvid"); }
function lbIsLive(meta){ return !!(meta && meta.img && meta.vid); }
function lbLivePlaying(){ const v = lbVid(); return v.style.display !== "none" && !v.paused && !v.ended; }

function applyAutoState(){
  const on = livePref.auto;
  const t = $("#lbAutoTxt");
  if(t) t.textContent = on ? "关闭自动播放" : "开启自动播放";
  // 菜单图标表示「点下去会变成的状态」：开着就显示带斜杠的（即将关闭）
  const off = document.querySelector("#lbLiveMenu .ic-off");
  const onIc = document.querySelector("#lbLiveMenu .ic-on");
  if(off) off.style.display = on ? "" : "none";
  if(onIc) onIc.style.display = on ? "none" : "";
  // chip 与缩略图角标：图标表示当前状态（参考图 1/2 的两个状态）
  document.querySelectorAll(".lc.on").forEach(el => { el.style.display = on ? "" : "none"; });
  document.querySelectorAll(".lc.off").forEach(el => { el.style.display = on ? "none" : ""; });
  try{ lbVid().loop = false; }catch(e){}
}

function updateLbChrome(){
  const meta = lbSlide();
  const live = lbIsLive(meta);
  const chip = $("#lbLiveBtn");
  chip.hidden = !live;
  if(!live){
    $("#lbLiveMenu").hidden = true;
    chip.classList.remove("open");
  }
  $("#lbCount").textContent = lbSlides.length > 1 ? (lbIdx + 1) + " / " + lbSlides.length : "";
  $("#lbPrev").hidden = lbSlides.length < 2;
  $("#lbNext").hidden = lbSlides.length < 2;
}

function lbSetLivePill(playing){
  const meta = lbSlide();
  const live = lbIsLive(meta);
  const btn = $("#lbLivePlay");
  if(!btn) return;
  btn.hidden = !live;
  btn.classList.toggle("playing", !!(live && playing));
  const txt = $("#lbLivePlayTxt");
  if(txt) txt.textContent = (live && playing) ? "实况播放中" : "播放实况";
  btn.title = (live && playing) ? "点击停止实况" : "点击播放实况";
}

let lbPreloaded = new Set();

function lbPreloadOne(m){
  if(!m || !m.img || lbPreloaded.has(m.img)) return;
  if(lbPreloaded.size > 10) lbPreloaded.clear();
  lbPreloaded.add(m.img);
  const im = new Image();
  im.decoding = "async";
  im.src = m.img;
  if(im.decode) im.decode().catch(() => {});
}

function lbPreload(idx){
  const n = lbSlides.length;
  if(n < 2) return;
  [idx + 1, idx - 1, idx + 2, idx - 2].forEach(i => lbPreloadOne(lbSlides[((i % n) + n) % n]));
}

function lbPreloadAll(){
  const n = lbSlides.length;
  if(n < 2 || n > 30) return;
  for(let i = 0; i < n; i++) lbPreloadOne(lbSlides[i]);
}

/* 实况视频：等元数据就绪再 play，避免刚换 src 就被 AbortError 打断 */
function lbPlayLive(meta){
  const vid = lbVid();
  if(!lbIsLive(meta)){ lbStopLive(); return; }
  const url = meta.vid;
  const token = ++lbLiveToken;

  vid.muted = true;
  vid.defaultMuted = true;
  vid.setAttribute("muted", "");
  vid.setAttribute("playsinline", "");
  vid.setAttribute("webkit-playsinline", "");
  vid.loop = false;
  vid.preload = "auto";
  if(vid.getAttribute("src") !== url){
    vid.setAttribute("src", url);
    try{ vid.load(); }catch(e){}
  }
  vid.hidden = false;
  vid.style.display = "block";
  vid.style.zIndex = "3";
  vid.style.transform = "translateX(0)";
  lbSetLivePill(true);

  let started = false;
  const start = () => {
    if(token !== lbLiveToken || started) return;
    started = true;
    try{ if(vid.readyState >= 1) vid.currentTime = 0; }catch(e){}
    let pr = null;
    try{ pr = vid.play(); }catch(e){}
    if(pr && pr.catch){
      pr.catch(err => {
        if(token !== lbLiveToken) return;
        const name = (err && err.name) || "";
        if(name === "AbortError") return;                  // 被切图打断，属于正常
        if(name === "NotSupportedError"){ lbLiveFallback(meta); return; }
        lbStopLive();                                      // 系统不允许自动播放 → 留按钮给用户点
      });
    }
  };
  if(vid.readyState >= 2){
    start();
  }else{
    const onReady = () => {
      vid.removeEventListener("canplay", onReady);
      vid.removeEventListener("loadeddata", onReady);
      start();
    };
    vid.addEventListener("canplay", onReady);
    vid.addEventListener("loadeddata", onReady);
    setTimeout(() => {
      vid.removeEventListener("canplay", onReady);
      vid.removeEventListener("loadeddata", onReady);
      if(token === lbLiveToken) start();
    }, 700);
  }
}

function lbStopLive(){
  const vid = lbVid();
  lbLiveToken++;
  try{ vid.pause(); }catch(e){}
  vid.hidden = true;
  vid.style.display = "none";
  vid.style.transform = "translateX(0)";
  lbSetLivePill(false);
}

/* 浏览器解不了的编码（HEVC / .mov 等）→ 让后端转一份 H.264 再播 */
function lbLiveFallback(meta){
  if(!meta || !meta.vid || meta._fallbackTried) return;
  meta._fallbackTried = true;
  let raw = "";
  try{ raw = new URL(meta.vid, location.href).searchParams.get("p") || ""; }catch(e){}
  if(!raw){ lbStopLive(); return; }
  const token = lbLiveToken;
  fetch("/api/live_mp4?p=" + encodeURIComponent(raw))
    .then(r => r.json())
    .then(r => {
      if(token !== lbLiveToken) return;
      if(r && r.ok && r.url){
        meta.vid = r.url;
        lbPlayLive(meta);
      }else{
        lbStopLive();
        toast("这条实况视频无法解码，已显示静态图");
      }
    })
    .catch(() => {
      if(token !== lbLiveToken) return;
      lbStopLive();
      toast("实况视频转码失败，已显示静态图");
    });
}

function lbToggleLive(meta){
  if(!lbIsLive(meta)) return;
  if(lbLivePlaying()) lbStopLive();
  else lbPlayLive(meta);
}

function lbRender(meta){
  lbToken++;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  lbStopLive();
  const cur = lbCurImg(), back = lbBackImg();
  cur.hidden = false;
  cur.style.transition = "none";
  cur.style.transform = "translateX(0)";
  cur.style.zIndex = "2";
  cur.dataset.idx = String(lbIdx);
  const want = (meta && meta.img) || "";
  if(cur.getAttribute("src") !== want) cur.src = want;
  back.hidden = true;
  back.style.transition = "none";
  back.style.transform = "translateX(0)";
  back.style.zIndex = "1";
  back.dataset.idx = "";
  updateLbChrome();
  lbSetLivePill(false);
  if(lbIsLive(meta) && livePref.auto) lbPlayLive(meta);
}

/* 立刻收尾正在跑的切换：把目标层放到正面，避免卡在半路 */
function lbSettle(token, silent){
  if(token && token !== lbToken) return;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  const meta = lbSlide();
  const want = meta.img || "";
  let target = lbCurImg();
  if(target.dataset.idx !== String(lbIdx)) target = lbBackImg();
  const other = (target === lbCurImg()) ? lbBackImg() : lbCurImg();
  target.hidden = false;
  target.style.transition = "none";
  target.style.transform = "translateX(0)";
  target.style.zIndex = "2";
  if(want && target.getAttribute("src") !== want) target.src = want;
  other.hidden = true;
  other.style.transition = "none";
  other.style.transform = "translateX(0)";
  other.style.zIndex = "1";
  lbFront = (target.id === "lbimgA") ? 0 : 1;
  lbToken++;
  lbSetLivePill(false);
  if(!silent && lbIsLive(meta) && livePref.auto) lbPlayLive(meta);
}

/** 切一张：拖拽/滚轮/键盘都走这里；不再有「切换中吞掉输入」的锁 */
function lbGo(dir, fromDx){
  lbResetZoom();
  const n = lbSlides.length;
  if(n < 2) return;
  if(lbAnimating) lbSettle(0, true);

  const nextIdx = (lbIdx + dir + n) % n;
  const meta = lbSlides[nextIdx] || {};
  const cur = lbCurImg(), nxt = lbBackImg();
  const token = ++lbToken;
  const outX = dir > 0 ? "-100vw" : "100vw";
  const inX  = dir > 0 ? "100vw" : "-100vw";

  lbStopLive();
  lbIdx = nextIdx;

  cur.hidden = false;
  cur.style.transition = "none";
  cur.style.transform = (typeof fromDx === "number" && fromDx) ? `translateX(${fromDx}px)` : "translateX(0)";
  cur.style.zIndex = "1";

  nxt.hidden = false;
  nxt.style.transition = "none";
  nxt.style.transform = inX;
  nxt.style.zIndex = "2";
  nxt.dataset.idx = String(nextIdx);
  nxt.onload = null;
  nxt.onerror = null;

  const want = meta.img || "";
  if(want && nxt.getAttribute("src") !== want) nxt.src = want;

  lbAnimating = true;
  updateLbChrome();
  lbSetLivePill(false);
  lbPreload(lbIdx);

  // 连续快滑时把过渡压短，手速多快就跟多快
  const now = Date.now();
  const fast = now - lbLastSwipeAt < 320;
  lbLastSwipeAt = now;
  const dur = fast ? 0.1 : 0.2;

  cur.style.transition = `transform ${dur}s cubic-bezier(.25,.7,.3,1)`;
  nxt.style.transition = `transform ${dur}s cubic-bezier(.25,.7,.3,1)`;
  requestAnimationFrame(() => {
    if(token !== lbToken) return;
    cur.style.transform = outX;
    nxt.style.transform = "translateX(0)";
    clearTimeout(lbSettleTimer);
    lbSettleTimer = setTimeout(() => lbSettle(token), dur * 1000 + 90);
  });
}

function lbShow(i, dir){
  if(!lbSlides.length || lbSlides.length < 2) return;
  const nextIdx = (i + lbSlides.length) % lbSlides.length;
  if(nextIdx === lbIdx) return;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!dir || reduced){
    lbResetZoom();
    if(lbAnimating) lbSettle(0, true);
    lbIdx = nextIdx;
    lbRender(lbSlides[lbIdx]);
  }else{
    lbGo(dir > 0 ? 1 : -1);
  }
}

function openLightbox(slides, index){
  lbResetZoom();
  lbSlides = slides || [];
  lbIdx = Math.max(0, Math.min(index || 0, lbSlides.length - 1));
  lbFront = 0;
  lbPreloaded = new Set();
  lbToken++;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  lbDrag = null;
  lbSwipedAt = 0;
  ["#lbimgA", "#lbimgB"].forEach((sel, i) => {
    const el = $(sel);
    el.hidden = i !== 0;
    el.style.transition = "none";
    el.style.transform = "translateX(0)";
    el.style.zIndex = i === 0 ? "2" : "1";
    el.dataset.idx = "";
  });
  applyAutoState();
  $("#lightbox").classList.add("on");
  const meta = lbSlide();
  const cur = lbCurImg();
  cur.dataset.idx = String(lbIdx);
  const want = meta.img || "";
  if(cur.getAttribute("src") !== want) cur.src = want;
  updateLbChrome();
  lbSetLivePill(false);
  if(lbIsLive(meta) && livePref.auto) lbPlayLive(meta);
  lbPreloadAll();
  lbPreload(lbIdx);
}

function closeLightbox(){

/* ---------- 滑动：跟手拖拽（指针捕获，松手立即能再滑） ---------- */
$("#lightbox").addEventListener("pointerdown", e => {
  if(!$("#lightbox").classList.contains("on")) return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  if(e.target.closest(".lbtop, .lbNav, .lblive")) return;
  if(lbZoom > 1.01){
    lbPan = { id: e.pointerId, x: e.clientX, y: e.clientY, tx: lbZx, ty: lbZy };
    $("#lightbox").classList.add("dragging");
    try{ $("#lightbox").setPointerCapture(e.pointerId); }catch(err){}
    const st = lbStage(); if(st) st.style.transition = "none";
    e.preventDefault();
    return;
  }
  if(lbSlides.length < 2) return;
  if(lbAnimating) lbSettle(0, true);            // 上一张还在动 → 立刻收尾，不吞这次手势
  lbDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, active: false, t0: 0,
             wasPlaying: lbLivePlaying() };
  try{ $("#lightbox").setPointerCapture(e.pointerId); }catch(err){}
});

$("#lightbox").addEventListener("pointermove", e => {
  if(lbPan){
    if(e.pointerId !== lbPan.id) return;
    lbZx = lbPan.tx + (e.clientX - lbPan.x);
    lbZy = lbPan.ty + (e.clientY - lbPan.y);
    lbSwipedAt = Date.now();
    lbApplyZoom();
    return;
  }
  if(!lbDrag || e.pointerId !== lbDrag.id) return;
  const dx = e.clientX - lbDrag.x, dy = e.clientY - lbDrag.y;
  if(!lbDrag.active){
    if(Math.abs(dx) < 6) return;
    if(Math.abs(dy) > Math.abs(dx) * 1.25) return;   // 竖向手势不抢
    lbDrag.active = true;
    lbDrag.t0 = Date.now();                          // 记录真正开始拖的时刻，用来算速度
    lbStopLive();                                    // 拖动时先把实况视频收起来
    $("#lightbox").classList.add("dragging");
    const cur = lbCurImg();
    cur.style.transition = "none";
    cur.style.zIndex = "2";
  }
  lbDrag.dx = dx;
  lbCurImg().style.transform = `translateX(${dx}px)`;
});

function lbEndDrag(e){
  if(lbPan){
    if(e && e.pointerId !== undefined && e.pointerId !== lbPan.id) return;
    lbPan = null;
    lbSwipedAt = Date.now();
    $("#lightbox").classList.remove("dragging");
    const st = lbStage(); if(st) st.style.transition = "";
    return;
  }
  if(!lbDrag) return;
  if(e && e.pointerId !== undefined && e.pointerId !== lbDrag.id) return;
  const st = lbDrag;
  lbDrag = null;
  $("#lightbox").classList.remove("dragging");
  if(!st.active) return;
  lbSwipedAt = Date.now();
  const el = lbCurImg();
  const threshold = Math.max(44, Math.min(80, window.innerWidth * 0.09));
  // 快速一甩往往位移不大，但速度很快：速度够就切
  const dt = Math.max(1, Date.now() - (st.t0 || Date.now()));
  const speed = Math.abs(st.dx) / dt;
  if(Math.abs(st.dx) >= threshold || (speed > 0.55 && Math.abs(st.dx) > 16)){
    lbGo(st.dx < 0 ? 1 : -1, st.dx);
  }else{
    el.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
    el.style.transform = "translateX(0)";
    // 只是轻拖又回弹：原来在播的实况接着播
    if(st.wasPlaying && lbIsLive(lbSlide())) lbPlayLive(lbSlide());
  }
}
$("#lightbox").addEventListener("pointerup", lbEndDrag);
$("#lightbox").addEventListener("pointercancel", lbEndDrag);
$("#lightbox").addEventListener("lostpointercapture", lbEndDrag);

/* 触控板/滚轮：一次手势只切一张；手势停下来 160ms 立刻重新上膛，松手就能接着滑 */
let lbWheelAcc = 0, lbWheelArmed = true, lbWheelIdle = 0, lbWheelLastAt = 0;
$("#lightbox").addEventListener("wheel", e => {
  if(!$("#lightbox").classList.contains("on")) return;
  e.preventDefault();                     // 灯箱打开时别让背后的页面跟着滚
  if(e.ctrlKey || e.metaKey){             // 触控板捏合 → 缩放
    lbSetZoom(lbZoom * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
    return;
  }
  if(lbZoom > 1.01){                      // 放大后双指/滚轮 → 四处平移
    lbZx -= e.deltaX;
    lbZy -= e.deltaY;
    const st = lbStage(); if(st) st.style.transition = "none";
    lbApplyZoom();
    return;
  }
  if(lbSlides.length < 2) return;
  const dx = e.deltaX, dy = e.deltaY;
  const d = Math.abs(dx) >= Math.abs(dy) ? dx : (e.shiftKey ? dy : 0);
  if(!d) return;
  const now = performance.now();
  if(now - lbWheelLastAt > 120){ lbWheelAcc = 0; lbWheelArmed = true; }  // 新手势立刻上膛
  lbWheelLastAt = now;
  lbWheelAcc += d;
  clearTimeout(lbWheelIdle);
  lbWheelIdle = setTimeout(() => { lbWheelAcc = 0; lbWheelArmed = true; }, 120);
  if(lbWheelArmed && Math.abs(lbWheelAcc) > 40){
    lbWheelArmed = false;
    lbWheelAcc = 0;
    lbGo(d > 0 ? 1 : -1);
  }
}, {passive:false});

  if (BATCH.tab === "paste" || BATCH.tab === "list") return { platform: "", kind: "" };

      + (urls.length > 6 ? '<div>… 还有 ' + (urls.length - 6) + ' 个</div>' : "");

async function batchStatus(){
  try {
    const { platform } = batchPK();
    if (!platform) {
      $("#batchLogin").style.display = "none";
      $("#batchLoginTip").textContent = "";
      return;
    }
    const r = await fetch("/api/source/status?platform=" + encodeURIComponent(platform)).then(x => x.json());
    const ok = !!r[platform];
    const nick = r[platform + "_nickname"] || "";
    const st = r.login || {};
    const inLogin = st.state === "waiting_tasks" || st.state === "waiting_scan";
    $("#batchLoginTip").textContent = ok ? ("已登录" + (nick ? " · " + nick : "")) : (inLogin ? (st.message || "登录中…") : "未登录");
    $("#batchLoginTip").className = "bhint" + (ok ? "" : " warn");
    $("#batchLogin").style.display = (ok || inLogin) ? "none" : "";
    if (inLogin) startLoginPoll();
  } catch (e) {
    $("#batchLogin").style.display = "";
    $("#batchLoginTip").textContent = "登录状态未知";
  }
}

function startLoginPoll(){
  if (BATCH.poll) return;
  BATCH.poll = setInterval(async () => {
    try {
      const r = await fetch("/api/source/login/status").then(x => x.json());
      const st = r.login || {};
      $("#batchLoginTip").textContent = st.message || "登录中…";
      $("#batchLoginTip").className = "bhint warn";
      $("#batchLogin").disabled = true;
      if (["done", "error", "cancelled", "idle"].includes(st.state)) {
        clearInterval(BATCH.poll); BATCH.poll = 0;
        $("#batchLogin").disabled = false;
        if (st.state === "done") {
          toast("登录成功");
          $("#batchLogin").style.display = "none";
          batchStatus(); // 刷新以显示账号名
          batchLoad(false);
        } else if (st.state === "error" || st.state === "cancelled") {
          toast(st.message || "登录失败");
          $("#batchLoginTip").textContent = "未登录";
          $("#batchLoginTip").className = "bhint warn";
          $("#batchLogin").style.display = "";
        }
      }
    } catch (e) {}
  }, 1500);
}

async function batchLoad(refresh){
  if (BATCH.tab === "paste" || BATCH.tab === "list") return;
  const { platform, kind } = batchPK();
  if (!platform) return;
  const tabAtStart = BATCH.tab;
  BATCH.loadedTab = tabAtStart;
  const grid = $("#batchGrid");
  grid.style.display = "";
  grid.innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">读取中…</div>';
  $("#batchInfo").textContent = "";
  const q = new URLSearchParams({ platform, kind, limit: ($("#batchLimit")?.value || "200") });
  if (refresh) q.set("refresh", "1");
  if (BATCH.url) q.set("url", BATCH.url);
  try {
    const r = await fetch("/api/source/items?" + q).then(x => x.json());
    if (BATCH.loadedTab !== tabAtStart) return;
    if (!r.ok) {
      if (!r.logged_in) {
        grid.innerHTML = "";
        $("#batchLoginTip").textContent = "未登录";
        $("#batchLoginTip").className = "bhint warn";
        $("#batchLogin").style.display = "";
        grid.innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">未登录，点右上角「登录」扫码</div>';
      } else {
        grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">' + esc(r.error || "读取失败") + '</div>';
      }
      return;
    }
    BATCH.items = r.items || [];
    BATCH.sel.clear();
    renderBatch();
  } catch (e) {
    if (BATCH.loadedTab !== tabAtStart) return;
    grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">读取失败：' + esc(e.message) + '</div>';
  }
}

async function batchLogin(){
  const { platform } = batchPK();
  if (!platform) return;
  $("#batchLogin").disabled = true;
  toast("正在暂停队列并准备登录窗口…");
  try {
    const r = await fetch("/api/source/login", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ platform }) }).then(x => x.json());
    if (r.already) {
      toast("已经登录了");
      $("#batchLogin").disabled = false;
      $("#batchLogin").style.display = "none";
      batchStatus(); // 刷新以显示账号名
      batchLoad(false);
      return;
    }
    if (!r.ok) {
      toast(r.error || "登录启动失败");
      $("#batchLogin").disabled = false;
      if (r.login) startLoginPoll();
      return;
    }
    startLoginPoll();
  } catch (e) {
    toast("登录启动失败：" + e.message);
    $("#batchLogin").disabled = false;
  }
}

function batchListInit(){
  $("#batchLoginTip").textContent = "";
  $("#batchLogin").style.display = "none";
  $("#batchInfo").textContent = "";
  if (BATCH.items && BATCH.items.length) { renderBatch(); return; }
  $("#batchGrid").innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">支持：抖音博主、B站合集/分P、YouTube 频道/播放列表、X / Instagram / 微博主页</div>';
}

async function batchListLoad(){
  const raw = $("#batchListUrl").value || "";
  const url = extractUrl(raw);
  if (!url) { toast("没识别到链接"); return; }
  BATCH.listUrl = url;
  BATCH.loadedTab = "list";
  BATCH.items = []; BATCH.sel.clear(); BATCH.url = "";
  const grid = $("#batchGrid");
  grid.innerHTML = '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">读取中…</div>';
  $("#batchInfo").textContent = "";
  try {
    const r = await fetch("/api/source/items?platform=auto&kind=list&url=" + encodeURIComponent(url)
      + "&limit=" + encodeURIComponent($("#batchLimit")?.value || "200") + "&refresh=1")
      .then(x => x.json());
    if (BATCH.tab !== "list" || BATCH.loadedTab !== "list") return;
    if (!r.ok) {
      grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">' + esc(r.error || "读取失败") + '</div>';
      return;
    }
    BATCH.items = r.items || [];
    BATCH.sel.clear();
    renderBatch();
  } catch (e) {
    if (BATCH.tab !== "list") return;
    grid.innerHTML = '<div class="bhint warn" style="grid-column:1/-1;padding:30px 6px">读取失败：' + esc(e.message) + '</div>';
  }
}

function batchVisible(){
  const q = ($("#batchSearch").value || "").trim().toLowerCase();
  const onlyNew = $("#batchOnlyNew").checked;
  return BATCH.items.filter(it => {
    if (onlyNew && it.archived) return false;
    if (q && !(((it.title || "") + " " + (it.id || "")).toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderBatch(){
  const list = batchVisible();
  const total = BATCH.items.length;
  const arch = BATCH.items.filter(x => x.archived).length;
  const empty = !total ? "没有读到作品"
    : (list.length ? "" : ($("#batchOnlyNew")?.checked ? "这个列表里的作品都已归档；取消「只看未归档」可以查看" : "没有匹配的作品"));
  $("#batchGrid").innerHTML = list.map(it => {
    const sel = BATCH.sel.has(String(it.id));
    let cover = it.cover || "";
    if (cover.startsWith("//")) cover = "https:" + cover;
    const isCol = it.type === "collection";
    return `<div class="bcard${sel ? " sel" : ""}" data-id="${esc(it.id)}" data-type="${isCol ? "col" : "item"}">
      ${isCol ? '<span class="badge">收藏夹</span>' : `<input type="checkbox" class="chk" ${sel ? "checked" : ""}>`}
      ${cover ? `<img class="cov" src="${esc(cover)}" loading="lazy" referrerpolicy="no-referrer">` : '<div class="cov"></div>'}
      <div class="bt">${esc(it.title || it.id)}</div>
      <div class="ba">${it.archived ? '<span class="arch">已归档</span>' : ""}${isCol && !it.archived ? "点开查看" : ""}</div>
    </div>`;
  }).join("") || '<div class="bhint" style="grid-column:1/-1;padding:30px 6px">' + empty + '</div>';
  $("#batchInfo").textContent = total ? ("显示 " + list.length + " / 共 " + total + " · 已归档 " + arch) : "";
  batchCount();
}

async function batchGo(){
  let urls = [];
  if (BATCH.tab === "paste") {
    urls = extractUrls($("#batchText")?.value || "");
  } else {
    urls = BATCH.items.filter(it => BATCH.sel.has(String(it.id))).map(it => it.url);
  }
  if (!urls.length) { toast("没有可归档的内容"); return; }
  $("#batchGo").disabled = true;
  try {
    const r = await fetch("/api/archive_batch", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ urls }) }).then(x => x.json());
    if (r.ok) { toast("已加入 " + r.count + " 条，任务面板里看进度"); batchClose(); }
    else toast(r.error || "加入失败");
  } catch (e) {
    toast("加入失败：" + e.message);
  }
  $("#batchGo").disabled = false;
}

$("#btnBatch").onclick = () => {
  BATCH.tab = "douyin|like"; BATCH.url = ""; BATCH.listUrl = ""; BATCH.items = []; BATCH.sel.clear(); BATCH.loadedTab = "";
  $("#batchSearch").value = ""; $("#batchOnlyNew").checked = true;
  $("#batchText").value = "";
  $("#batch").classList.add("on");
  batchTabs(); batchStatus(); batchLoad(false);
};
$("#batchClose").onclick = batchClose;
$("#batch").addEventListener("click", e => { if (e.target.id === "batch") batchClose(); });
$("#batchTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-src]");
  if (!b || b.dataset.src === BATCH.tab) return;
  BATCH.tab = b.dataset.src; BATCH.url = ""; BATCH.items = []; BATCH.sel.clear(); BATCH.loadedTab = "";
  $("#batchSearch").value = ""; $("#batchOnlyNew").checked = true;
  batchTabs();
  if (BATCH.tab === "paste") { renderPastePreview(); return; }
  if (BATCH.tab === "list") { batchListInit(); return; }
  batchStatus(); batchLoad(false);
});
$("#batchRefresh").onclick = () => {
  if (BATCH.tab === "list") batchListLoad();
  else if (BATCH.tab !== "paste") batchLoad(true);
};
$("#batchListGo").onclick = () => batchListLoad();
$("#batchSearch").oninput = () => renderBatch();
$("#batchOnlyNew").onchange = () => renderBatch();
$("#batchAll").onclick = () => {
  const list = batchVisible().filter(it => it.type !== "collection");
  const all = list.length > 0 && list.every(it => it.archived || BATCH.sel.has(String(it.id)));
  list.forEach(it => { if (!it.archived) { if (all) BATCH.sel.delete(String(it.id)); else BATCH.sel.add(String(it.id)); } });
  renderBatch();
};
$("#batchBack").onclick = () => { BATCH.url = ""; BATCH.sel.clear(); $("#batchBack").style.display = "none"; batchLoad(false); };
$("#batchLogin").onclick = batchLogin;
$("#batchGo").onclick = batchGo;
$("#batchText").oninput = () => renderPastePreview();
const backTop = $("#backTop");
if(backTop){
  const mainEl = document.querySelector("main");
  const useMain = !!(mainEl && mainEl.offsetParent !== null &&
                     ["auto","scroll"].includes(getComputedStyle(mainEl).overflowY));
  const scrollBox = useMain ? mainEl : document.scrollingElement;
  const syncBackTop = () => {
    const y = (scrollBox && scrollBox.scrollTop) || window.scrollY || 0;
    backTop.classList.toggle("on", y > 500);
  };
  window.addEventListener("scroll", syncBackTop, {passive:true});
  if(scrollBox && scrollBox !== document.scrollingElement){
    scrollBox.addEventListener("scroll", syncBackTop, {passive:true});
  }
  backTop.onclick = () => {
    if(scrollBox && scrollBox.scrollTo) scrollBox.scrollTo({top:0, behavior:"smooth"});
    window.scrollTo({top:0, behavior:"smooth"});
  };
  syncBackTop();
}
$("#batchGrid").addEventListener("click", e => {
  const card = e.target.closest(".bcard");
  if (!card) return;
  const id = card.dataset.id;
  if (card.dataset.type === "col") {
    const it = BATCH.items.find(x => String(x.id) === id);
    if (it) { BATCH.url = it.url; BATCH.sel.clear(); $("#batchBack").style.display = ""; batchLoad(false); }
    return;
  }
  e.preventDefault();
  if (BATCH.sel.has(id)) BATCH.sel.delete(id); else BATCH.sel.add(id);
  card.classList.toggle("sel", BATCH.sel.has(id));
  const chk = card.querySelector(".chk");
  if (chk) chk.checked = BATCH.sel.has(id);
  batchCount();
});
</script>
</body>
</html>
