const ITEMS_PAGE = 60;
let hasMoreItems = false;
let _loadToken = 0;

function isRowMode(){
  // 全部 / 单平台视图都用苹果相册式分行布局（平台视图按该平台博主挨着展示 + 置顶逻辑）
  return !state.author && !state.author_key
         && !state.collection && !state.q;
}

function itemsQuery(offset){
  // 全部视图（苹果相册式）一次加载全部，不分页；筛选视图保持分页
  const lim = isRowMode() ? 9999 : ITEMS_PAGE;
  const p = new URLSearchParams({ q: state.q, platform: state.platform,
                                  limit: String(lim), offset: String(offset || 0) });
  if(state.author_key) p.set("author_key", state.author_key);
  else p.set("author", state.author);
  if(state.collection) p.set("collection", state.collection);
  return p;
}

function updateLoadMore(){
  const box = $("#loadMore");
  if(box) box.classList.toggle("hidden", !hasMoreItems);
}

async function loadAll(){
  saveState();
  const myToken = ++_loadToken;
  try{
    const [items, plats, authors, stats, cols] = await Promise.all([
      fetch("/api/items?" + itemsQuery(0)).then(r => r.json()),
      fetch("/api/platforms").then(r => r.json()),
      fetch("/api/authors").then(r => r.json()),
      fetch("/api/stats").then(r => r.json()),
      fetch("/api/collections").then(r => r.json()).catch(() => [])
    ]);
    if(myToken !== _loadToken) return; // stale, discard
    collectionsCache = Array.isArray(cols) ? cols : [];
    // 分类被删掉了 → 清掉选择重新加载
    if(state.collection && !collectionsCache.some(c => String(c.id) === String(state.collection))){
      state.collection = null;
      return loadAll();
    }
    const shown = state.active ? (items || []) : [];
    itemsCache = shown;
    hasMoreItems = (items || []).length >= ITEMS_PAGE;
    updateLoadMore();
    __authors = authors || [];
    __platforms = plats || [];
    renderItems(shown); renderPlatforms(plats); renderAuthors(authors);
    renderCollections(collectionsCache);

    // 返回全部按钮 + 打开主页按钮：从行头或侧栏点进博主时显示
    const bhEl = $("#backHome");
    if(bhEl){
      const inAuthorView = !!(state.author || state.author_key);
      if((_fromRowMode || _fromSidebar) && inAuthorView){
        bhEl.classList.remove("hidden");
        const nameEl = $("#backHomeName");
        if(nameEl) nameEl.textContent = state.author || "";
        // 主页行头进来 → 「返回」（回原滚动位置）；侧栏进来 → 「定位」（回该博主的行）
        const backBtn = $("#btnBackHome");
        if(backBtn) backBtn.textContent = _entryRoute === "sidebar" ? "定位" : "← 返回";
        // 查找博主主页 URL：库里没有就按平台拼，保证所有博主都有这个按钮
        const authorData = (__authors || []).find(a =>
          (a.author_key || a.author) === (state.author_key || state.author))
          || { author: state.author, author_key: state.author_key,
               author_id: state.author_key, platform: state.platform || "",
               author_url: "" };
        const authorUrl = authorHomeURLFor(authorData);
        const homeBtn = $("#btnAuthorHome");
        if(homeBtn){
          homeBtn.style.display = "";
          homeBtn.onclick = () => {
            if(!authorUrl){ toast("这个博主没有可跳转的主页地址"); return; }
            const native = nativeUserURLFor(authorData.platform, authorUrl,
                          authorData.author_id || authorData.author_key);
            if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openURL){
              // App 内：优先本机客户端，没装回落浏览器
              window.webkit.messageHandlers.openURL.postMessage({ url: authorUrl, native });
            }else{
              window.location.href = "mediaarchive://open?url=" + encodeURIComponent(authorUrl)
                + (native ? "&native=" + encodeURIComponent(native) : "");
            }
          };
        }
      }else{
        bhEl.classList.add("hidden");
      }
    }
    // 回到主页时的滚动位置：优先定位到该博主的行，找不到再回落记忆位置
    const mainEl = document.querySelector("main");
    if(!_fromRowMode && !_fromSidebar){
      if(_returnAuthorKey && mainEl){
        const key = _returnAuthorKey;
        const fallback = _homeScrollTop;
        _returnAuthorKey = "";
        _homeScrollTop = 0;
        const scrollToRow = () => {
          const rowEl = [...document.querySelectorAll("#grid .author-row")]
            .find(r => r.dataset.authorKey === key);
          if(!rowEl) return false;
          const top = rowEl.getBoundingClientRect().top - mainEl.getBoundingClientRect().top
                      + mainEl.scrollTop - 64;
          mainEl.scrollTop = Math.max(0, top);
          return true;
        };
        requestAnimationFrame(() => {
          // 行还没渲染出来时回落记忆位置
          if(!scrollToRow() && fallback > 0) mainEl.scrollTop = fallback;
          // 图片懒加载会改变行高，稍后再校准一次
          setTimeout(scrollToRow, 350);
        });
      }else if(_homeScrollTop > 0 && mainEl){
        requestAnimationFrame(() => { mainEl.scrollTop = _homeScrollTop; });
        _homeScrollTop = 0;
      }
    }else if(mainEl){
      mainEl.scrollTop = 0;
    }
    _fromRowMode = false;
    _fromSidebar = false;
    restoreScroll();      // 刷新/重开页面：回到刷新前的滚动位置，不跳顶
    const emptyEl = $("#empty");
    if(emptyEl){
      if(state.active && shown.length === 0){
        emptyEl.style.display = "";
        emptyEl.innerHTML = state.collection
          ? '<div class="big">☆</div>这个分类还没有内容：右键左侧分类标题 → 添加作品'
          : '<div class="big">◍</div>没有匹配的作品';
      }else if(!state.active){
        emptyEl.style.display = "";
        emptyEl.innerHTML = '<div class="big">◍</div>点左侧「全部」、平台或博主开始浏览';
      }else{
        emptyEl.style.display = "none";
      }
    }
    (items || []).forEach(i => { if(i.source_url) urlTitleMap[i.source_url] = i.title; });
    const sp = $("#statBody");
    if(sp) sp.innerHTML = `总计 <b>${stats.items}</b> 条作品<br>占用空间 <b>${fmtSize(stats.size)}</b>`;
    const miss = items.filter(i => i.missing).length;
    if(miss > 0 && !state.q && !state.platform && !state.author){
      $("#bannerText").textContent = `有 ${miss} 条记录的文件已不存在（可能在 Finder 里被删掉了）`;
      $("#banner").classList.remove("hidden");
    }else{
      $("#banner").classList.add("hidden");
    }
  }catch(e){
    setStatus("bad", "数据读取失败");
  }
}

// 这条作品里有没有「图 + 实况伴生视频」的配对
function hasLivePair(files){
  const imgs = new Set();
  (files || []).forEach(f => { if(f.kind === "image") imgs.add(f.name.replace(/\.[^.]+$/, "")); });
  return (files || []).some(f => {
    if(f.kind !== "video") return false;
    const base = f.name.replace(/\.[^.]+$/, "");
    if(/\.mov$/i.test(f.name)) return imgs.has(base);
    if(/_live$/i.test(base)) return imgs.has(base.replace(/_live$/i, ""));
    return false;
  });
}

function mediaPath(url){
  try{ return new URL(url, location.origin).searchParams.get("p") || ""; }catch(e){ return ""; }
}
function mediaVer(url){
  try{ return new URL(url, location.origin).searchParams.get("v") || ""; }catch(e){ return ""; }
}
function thumbURL(f){
  const p = mediaPath(f && f.url);
  return p ? "/api/thumb?v=" + encodeURIComponent(mediaVer(f.url)) + "&p=" + encodeURIComponent(p) + "&w=720" : "";
}
function posterURL(f){
  const p = mediaPath(f && f.url);
  return p ? "/api/poster?v=" + encodeURIComponent(mediaVer(f.url)) + "&p=" + encodeURIComponent(p) : "";
}

function renderItems(items){
  const g = $("#grid");
  $("#empty").style.display = "none";

  // 判断是否用苹果相册式分行布局：
  // 只在「全部」视图（没有指定博主/平台/分类/搜索）时启用
  const useRow = isRowMode() && items.length > 0;

  // 先在离屏 fragment 里构建，再一次性替换到 grid，避免清空→重建的闪烁
  const frag = document.createDocumentFragment();
  const tmp = document.createElement("div");
  if(useRow){
    renderItemsGrouped(tmp, items);
  }else{
    renderItemsFlat(tmp, items);
  }
  // 把 tmp 的子节点移到 fragment（detach），然后一次性塞进 g
  while(tmp.firstChild) frag.appendChild(tmp.firstChild);
  g.className = "grid" + (useRow ? " row-mode" : "");
  g.replaceChildren(frag);
  // 键盘导航绑到 g 上（replaceChildren 后子节点已在 g 里）
  attachGridKeyboard(g);
}

/* ---- 平铺网格（原有逻辑，用于筛选/搜索/单博主视图） ---- */
function renderItemsFlat(g, items){
  const frag = document.createDocumentFragment();
  items.forEach(it => {
    const card = buildCard(it);
    frag.appendChild(card);
  });
  g.appendChild(frag);
}

/* ---- 按博主分组的横滚行（苹果相册式） ---- */
function renderItemsGrouped(g, items){
  // 按 author_key 分组，保持 items 数组中的出现顺序
  const groups = new Map();
  items.forEach(it => {
    const key = it.author_key || it.author_id || it.author || "未知博主";
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  });

  // 排序：按 pins.json 里的顺序排（索引越小越靠前），未置顶的保持原序排在后面
  const pinOrder = (__authors || []).filter(a => a.pinned).map(a => a.author_key || a.author);
  const pinIdx = new Map(pinOrder.map((k, i) => [k, i]));
  const sortedKeys = [...groups.keys()].sort((a, b) => {
    const ia = pinIdx.has(a) ? pinIdx.get(a) : 999999;
    const ib = pinIdx.has(b) ? pinIdx.get(b) : 999999;
    return ia - ib;
  });

  sortedKeys.forEach(key => {
    const groupItems = groups.get(key);
    const first = groupItems[0];
    const authorName = first.author || "未知博主";
    const platformCn = first.platform_cn || "";
    const isSingle = groupItems.length <= 1;
    const authorKey = first.author_key || first.author_id || first.author || "";
    const isPinned = pinIdx.has(authorKey);

    const row = document.createElement("div");
    row.className = "author-row" + (isSingle ? " single" : "");
    row.dataset.authorKey = key;

    // 头部
    const hdr = document.createElement("div");
    hdr.className = "author-row-hdr";
    hdr.innerHTML = `${isPinned ? '<span class="ar-pin" title="已置顶">📌</span>' : ''}
      <span class="ar-name">${esc(authorName)}</span>
      <svg class="ar-chev" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      <span class="ar-cnt">${groupItems.length} 条</span>
      ${platformCn ? `<span class="ar-plat">${esc(platformCn)}</span>` : ""}`;
    hdr.onclick = () => {
      const mainEl = document.querySelector("main");
      _homeScrollTop = mainEl ? mainEl.scrollTop : 0;
      _fromRowMode = true;
      _restoreDone = true;   // 用户主动点进行头：别再被刷新还原拽回旧位置
      _entryRoute = "row";
      state.author = authorName;
      state.author_key = authorKey;
      state.platform = "";
      state.collection = null;
      loadAll();
    };
    // 右键菜单：置顶 / 移到最前 / 取消置顶 / 重命名
    hdr.oncontextmenu = (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const m = document.getElementById("ctxmenu");
      const aPlatform = first.platform || "";
      let html = "";
      if(!isPinned){
        html += `<div class="ctxrow" data-act="pin">置顶「${esc(authorName)}」</div>`;
      }else{
        html += `<div class="ctxrow" data-act="top">移到最前</div>`;
        html += `<div class="ctxrow" data-act="unpin">取消置顶「${esc(authorName)}」</div>`;
      }
      html += `<div class="ctxrow" data-act="rename">重命名博主…</div>`;
      html += `<div class="ctxrow" data-act="hide">隐藏博主「${esc(authorName)}」</div>`;
      m.innerHTML = html;
      m.style.left = Math.min(ev.clientX, window.innerWidth - 220) + "px";
      m.style.top = Math.min(ev.clientY, window.innerHeight - 140) + "px";
      m.classList.add("on");
      const pinBtn = m.querySelector("[data-act='pin']");
      if(pinBtn) pinBtn.onclick = () => {
        m.classList.remove("on");
        fetch("/api/pin", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "authors", key: authorKey, pinned: true })
        }).then(() => loadAll());
      };
      const topBtn = m.querySelector("[data-act='top']");
      if(topBtn) topBtn.onclick = () => {
        m.classList.remove("on");
        fetch("/api/pin", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "authors", key: authorKey, action: "top" })
        }).then(() => loadAll());
      };
      const unpinBtn = m.querySelector("[data-act='unpin']");
      if(unpinBtn) unpinBtn.onclick = () => {
        m.classList.remove("on");
        fetch("/api/pin", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kind: "authors", key: authorKey, pinned: false })
        }).then(() => loadAll());
      };
      const renameBtn = m.querySelector("[data-act='rename']");
      if(renameBtn) renameBtn.onclick = () => {
        m.classList.remove("on");
        renameAuthorFlow(authorName, authorKey, aPlatform);
      };
      const hideBtn = m.querySelector("[data-act='hide']");
      if(hideBtn) hideBtn.onclick = () => {
        m.classList.remove("on");
        hideConfirm("author", authorKey || authorName, "博主「" + authorName + "」及其作品");
      };
    };
    row.appendChild(hdr);

    // 横向轨道
    const trackWrap = document.createElement("div");
    trackWrap.className = "author-track-wrap";
    const track = document.createElement("div");
    track.className = "author-track";
    groupItems.forEach(it => track.appendChild(buildCard(it)));
    trackWrap.appendChild(track);

    // 左右箭头
    if(!isSingle){
      const mkArrow = (dir, cls) => {
        const btn = document.createElement("button");
        btn.className = "ar-arrow " + cls;
        btn.innerHTML = dir < 0
          ? '<svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>';
        btn.onclick = () => track.scrollBy({ left: dir * 380, behavior: "smooth" });
        return btn;
      };
      trackWrap.appendChild(mkArrow(-1, "left"));
      trackWrap.appendChild(mkArrow(1, "right"));

      // 滚动时更新箭头可见性 + 右侧渐变
      const updateArrows = () => {
        const atStart = track.scrollLeft <= 2;
        const atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
        trackWrap.querySelector(".ar-arrow.left").style.opacity = atStart ? "0" : "";
        trackWrap.querySelector(".ar-arrow.right").style.opacity = atEnd ? "0" : "";
        trackWrap.classList.toggle("has-more", !atEnd);
      };
      track.addEventListener("scroll", updateArrows, { passive: true });
      requestAnimationFrame(updateArrows);
    }

    row.appendChild(trackWrap);
    g.appendChild(row);
  });
}

/* ---- 构建单张卡片（两种模式共用） ---- */
function buildCard(it){
  const fl = it.files || [];
  const vidF = fl.find(f => f.kind === "video" && !/_live|^\d+\.mov$/i.test(f.name));
  const imgF = fl.find(f => f.kind === "image");
  const isVid = !!vidF;
  const card = document.createElement("div");
  card.className = "card" + (it.missing ? " missing" : "") + (it.analyzed ? " analyzed" : "");
  card.dataset.id = String(it.id);
  card.tabIndex = 0;
  const isEmpty = !!(it.empty && it.folder_exists);
  const isMissing = !!(it.missing && !isEmpty);
  const badgeCls = isMissing ? "miss" : (isEmpty ? "wait" : (isVid ? "v" : "i"));
  const badgeTxt = isMissing ? "文件已丢失" : (isEmpty ? "待添加文件"
    : (it.type === "视频" ? "视频" : it.type === "音频" ? "音频" : "图文"));
  card.innerHTML = `
    <div class="thumb">
      ${vidF ? `<img src="${posterURL(vidF)}" loading="lazy" decoding="async" alt="">`
             : imgF ? `<img src="${thumbURL(imgF)}" loading="lazy" decoding="async" alt="">`
             : `<div class="ph">${isEmpty ? "＋" : "◌"}</div>`}
      <div class="badge ${badgeCls}">${badgeTxt}</div>
    </div>
    <div class="body">
      <div class="title">${esc(it.title) || "（无标题）"}</div>
      <div class="author"><a href="#" class="authorlink" data-author="${esc(it.author || "")}" data-author-key="${esc(it.author_id || it.author || "")}">${esc(it.author) || "未知博主"}</a></div>
      <div class="meta">
        <span>${esc(it.platform_cn)}</span>
        <span>${it.created || it.saved}</span>
        ${it.digg ? `<span>♡ ${it.digg}</span>` : ""}
      </div>
    </div>`;
  if(selected.has(it.id)) card.classList.add("selected");
  let downPos = null;
  let longTimer = null;
  let longFired = false;
  card.onmousedown = ev => {
    downPos = { x: ev.clientX, y: ev.clientY };
    longFired = false;
    longTimer = setTimeout(() => {
      longTimer = null;
      longFired = true;
      enterBulkMode();
      if(!selected.has(it.id)) toggleSelect(it.id, card);
    }, 500);
  };
  card.onmouseup = () => { if(longTimer){ clearTimeout(longTimer); longTimer = null; } };
  card.onmouseleave = () => { if(longTimer){ clearTimeout(longTimer); longTimer = null; } };
  card.onclick = (ev) => {
    if(longFired){ longFired = false; return; }
    if(downPos){
      const moved = Math.hypot(ev.clientX - downPos.x, ev.clientY - downPos.y);
      downPos = null;
      if(moved > 5) return;
    }
    if(longTimer === null && bulkMode && !selected.has(it.id) === false) { /* 继续走多选切换 */ }
    const sel = window.getSelection && window.getSelection();
    if(sel && sel.toString().trim().length > 0) return;
    if(ev.target.closest(".authorlink") || ev.target.closest("a[href^='http']")) return;
    if(selected.size > 0){ toggleSelect(it.id, card); return; }
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openDetail){
      window.webkit.messageHandlers.openDetail.postMessage({
        id: String(it.id), title: it.title || "",
        platform: it.platform || "", item_id: it.item_id || ""
      });
    }else{
      openItem(it);
    }
  };
  return card;
}

/* ---- 键盘导航（两种模式共用） ---- */
function attachGridKeyboard(g){
  if(g._gridKbAttached) return;
  g._gridKbAttached = true;
  g.addEventListener("keydown", e => {
    const card = e.target.closest(".card");
    if(!card) return;
    if(e.key === "Enter"){
      e.preventDefault();
      card.click();
      return;
    }
    // 在横滚行内：左右键在同一行内移动，上下键跳到相邻行
    const row = card.closest(".author-row");
    if(row){
      const track = row.querySelector(".author-track");
      const cards = [...track.querySelectorAll(".card")];
      const idx = cards.indexOf(card);
      if(idx < 0) return;
      let next = -1;
      if(e.key === "ArrowRight") next = Math.min(idx + 1, cards.length - 1);
      else if(e.key === "ArrowLeft") next = Math.max(idx - 1, 0);
      else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        const rows = [...g.querySelectorAll(".author-row")];
        const ri = rows.indexOf(row);
        const targetRow = e.key === "ArrowDown" ? rows[ri + 1] : rows[ri - 1];
        if(targetRow){
          const tc = targetRow.querySelector(".card");
          if(tc) tc.focus();
        }
        return;
      }
      if(next >= 0 && next !== idx){
        e.preventDefault();
        cards[next].focus();
        cards[next].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      }
      return;
    }
    // 平铺 grid 模式
    const cards = [...g.querySelectorAll(".card")];
    const idx = cards.indexOf(card);
    if(idx < 0) return;
    const gridStyle = getComputedStyle(g);
    const cols = gridStyle.gridTemplateColumns.split(" ").length || 1;
    let next = -1;
    if(e.key === "ArrowRight") next = Math.min(idx + 1, cards.length - 1);
    else if(e.key === "ArrowLeft") next = Math.max(idx - 1, 0);
    else if(e.key === "ArrowDown") next = Math.min(idx + cols, cards.length - 1);
    else if(e.key === "ArrowUp") next = Math.max(idx - cols, 0);
    if(next >= 0 && next !== idx){
      e.preventDefault();
      cards[next].focus();
    }
  });
}

let panelZ = 60;
let urlTitleMap = {};   // source_url → 标题

function addResizers(p){
  const MINW = 420, MINH = 260;
  ["n","s","e","w","ne","nw","se","sw"].forEach(dir => {
    const h = document.createElement("div");
    h.className = "rs " + dir;
    p.appendChild(h);
    h.addEventListener("mousedown", e => {
      e.preventDefault(); e.stopPropagation();
      const r = p.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const sw = r.width, sh = r.height, sl = r.left, st = r.top;
      const move = ev => {
        let w = sw, hh = sh, l = sl, t = st;
        if(dir.includes("e")) w = Math.max(MINW, sw + (ev.clientX - sx));
        if(dir.includes("s")) hh = Math.max(MINH, sh + (ev.clientY - sy));
        if(dir.includes("w")){ w = Math.max(MINW, sw - (ev.clientX - sx)); l = sl + (sw - w); }
        if(dir.includes("n")){ hh = Math.max(MINH, sh - (ev.clientY - sy)); t = st + (sh - hh); }
        p.style.width = w + "px";
        p.style.height = hh + "px";
        p.style.left = l + "px";
        p.style.top = t + "px";
      };
      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  });
}

/* ↑↓ 切换同博主的作品；详情窗口里 itemsCache 是空的，现拉同博主列表。
   panel 传 null 表示详情窗口模式：直接整页跳到下一条 */
async function arrowSwitchHandler(it, panel, e){
  if(e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  if(window.__maCfg && window.__maCfg.arrow_switch_works === false) return;
  if(e.target && e.target.matches && e.target.matches("input,textarea,select")) return;
  const lb = document.getElementById("lightbox");
  if(lb && lb.classList.contains("on")) return;   // 灯箱开着时方向键归灯箱
  const ak = it.author_key || it.author_id || it.author || "";
  if(!ak) return;
  let siblings = (itemsCache || []).filter(x =>
    (x.author_key || x.author_id || x.author || "") === ak);
  if(!siblings.some(x => String(x.id) === String(it.id))){
    try{
      const d = await fetch("/api/items?author_key=" + encodeURIComponent(ak) + "&limit=500")
        .then(r => r.json());
      siblings = Array.isArray(d) ? d : ((d && d.items) || []);
    }catch(err){ return; }
  }
  if(siblings.length <= 1) return;
  const idx = siblings.findIndex(x => String(x.id) === String(it.id));
  if(idx < 0) return;
  e.preventDefault();
  const next = e.key === "ArrowDown"
    ? siblings[(idx + 1) % siblings.length]
    : siblings[(idx - 1 + siblings.length) % siblings.length];
  if(panel){ panel.remove(); openItem(next); }
  else { location.href = "/?detail=" + encodeURIComponent(next.id); }
}

function openItem(it){
  // 已打开的同一作品 → 置顶
  const exist = [...document.querySelectorAll(".dpanel")].find(p => p.dataset.item === String(it.id));
  if(exist){ exist.style.zIndex = ++panelZ; return; }

  const idx = document.querySelectorAll(".dpanel").length;
  const p = document.createElement("div");
  p.className = "dpanel";
  p.dataset.item = String(it.id);
  p.style.left = Math.min(72 + idx * 26, Math.max(20, window.innerWidth - 960)) + "px";
  p.style.top = Math.min(56 + idx * 26, Math.max(20, window.innerHeight - 640)) + "px";
  p.style.zIndex = ++panelZ;
  p.innerHTML = `
    <div class="phead">
      <div class="traffic">
        <button class="dotbtn close" data-act="close" title="关闭">✕</button>
        <button class="dotbtn min" data-act="min" title="收起">−</button>
        <button class="dotbtn max" data-act="full" title="全屏">⤢</button>
      </div>
      <div class="t">${esc(it.title) || "（无标题）"}</div>
      <button class="small" data-act="reveal">Finder</button>
    </div>
    <div class="dactbar">
      <button class="small" data-act="addfiles">添加照片或视频…</button>
      <button class="small" data-act="moveauthor">移动到博主…</button>
      <button class="small" data-act="copyauthor">复制到博主…</button>
      <span class="sp"></span>
    </div>
    <div class="pbody"></div>`;
  document.body.appendChild(p);
  p.focus();   // 拿到焦点，↑↓ 切换同博主作品的 keydown 才收得到

  const body = p.querySelector(".pbody");
  const meta = renderPanelContent(it, body) || {};

  // 八向拖拽改大小
  addResizers(p);

  // 置顶
  p.addEventListener("mousedown", () => { p.style.zIndex = ++panelZ; }, true);

  // 拖动
  const head = p.querySelector(".phead");
  head.addEventListener("mousedown", e => {
    if(e.target.closest("button")) return;
    const ox = e.clientX - p.offsetLeft, oy = e.clientY - p.offsetTop;
    const move = ev => {
      p.style.left = Math.max(0, Math.min(window.innerWidth - 120, ev.clientX - ox)) + "px";
      p.style.top = Math.max(0, Math.min(window.innerHeight - 60, ev.clientY - oy)) + "px";
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  // 按钮
  p.querySelector('[data-act="close"]').onclick = () => p.remove();
  p.querySelector('[data-act="min"]').onclick = () => {
    p.classList.toggle("minimized");
    p.querySelector('[data-act="min"]').textContent = p.classList.contains("minimized") ? "+" : "−";
    p.querySelector('[data-act="min"]').title = p.classList.contains("minimized") ? "展开" : "收起";
  };
  // 双击标题栏也能收起/展开
  p.querySelector(".phead").addEventListener("dblclick", e => {
    if(e.target.closest("button")) return;
    p.querySelector('[data-act="min"]').click();
  });
  p.querySelector('[data-act="reveal"]').onclick = () => fetch("/api/reveal", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ path: it.folder })
  });
  // 面板操作条：添加文件 / 移动到博主 / 复制到博主
  const actAdd = p.querySelector('[data-act="addfiles"]');
  if(actAdd) actAdd.onclick = async () => { await addFilesToItem(it); refreshOpenPanel(it.id); };
  const actMove = p.querySelector('[data-act="moveauthor"]');
  if(actMove) actMove.onclick = async () => {
    await moveItemsToAuthor([it.id], "move"); refreshOpenPanel(it.id);
  };
  const actCopy = p.querySelector('[data-act="copyauthor"]');
  if(actCopy) actCopy.onclick = async () => {
    await moveItemsToAuthor([it.id], "copy"); refreshOpenPanel(it.id);
  };
  const maxBtn = p.querySelector('[data-act="full"]');
  maxBtn.onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else p.requestFullscreen?.().catch(() => toast("这个环境不支持全屏"));
  };
  p.addEventListener("fullscreenchange", () => {
    const on = document.fullscreenElement === p;
    maxBtn.textContent = on ? "⤡" : "⤢";
    maxBtn.title = on ? "退出全屏" : "全屏";
  });
  p.addEventListener("webkitfullscreenchange", () => {
    const on = document.webkitFullscreenElement === p;
    maxBtn.textContent = on ? "⤡" : "⤢";
  });

  // 上下键切换同博主的作品（设置里可关：arrow_switch_works）
  p.tabIndex = -1;
  p.addEventListener("keydown", e => arrowSwitchHandler(it, p, e));

  return p;
}

// 原帖优先交给本机客户端（有注册对应 scheme 才用），否则回落到网页
function nativeURLFor(platform, itemId, sourceUrl){
  const id = itemId ? String(itemId) : "";
  switch(String(platform || "").toLowerCase()){
    case "xiaohongshu":
      return id ? "xhsdiscover://item/" + encodeURIComponent(id) : "xhsdiscover://";
    case "douyin":
      // 同主页：客户端只认 douyin-pc://webview?url=… 格式
      return id ? "douyin-pc://webview?url=" + encodeURIComponent("https://www.douyin.com/video/" + id) : "";
    case "telegram": {
      const m = String(sourceUrl || "").match(/t\.me\/(?:s\/)?([^/?#]+)\/(\d+)/);
      return m ? "tg://resolve?domain=" + encodeURIComponent(m[1]) + "&post=" + m[2] : "tg://";
    }
    case "bilibili":
      return id ? "bilibili://video/" + encodeURIComponent(id) : "bilibili://";
    case "youtube":
      return id ? "youtube://watch?v=" + encodeURIComponent(id) : "youtube://";
    case "tiktok":
      return id ? "snssdk1233://aweme/detail/" + encodeURIComponent(id) : "snssdk1233://";
    case "weibo": return "sinaweibo://";
    case "reddit": return "reddit://";
    case "instagram": return "instagram://";
    case "kuaishou": return "kwai://";
    default: return "";
  }
}

// 博主主页网页地址：库里没存 author_url 时按平台 + ID 拼出来，保证每个博主都有得跳
function authorHomeURLFor(a){
  if(!a) return "";
  if(a.author_url) return a.author_url;
  const id = String(a.author_id || a.author_key || "");
  const name = String(a.author || "");
  switch(String(a.platform || "").toLowerCase()){
    case "douyin":
      return id ? "https://www.douyin.com/user/" + encodeURIComponent(id) : "";
    case "xiaohongshu":
      return id ? "https://www.xiaohongshu.com/user/profile/" + encodeURIComponent(id) : "";
    case "bilibili":
      return id ? "https://space.bilibili.com/" + encodeURIComponent(id)
                : (name ? "https://search.bilibili.com/up?keyword=" + encodeURIComponent(name) : "");
    case "weibo":
      return id ? "https://weibo.com/" + encodeURIComponent(id)
                : (name ? "https://s.weibo.com/weibo?q=" + encodeURIComponent(name) : "");
    case "x": case "twitter":
      return name ? "https://x.com/" + encodeURIComponent(name) : "";
    case "telegram":
      return name ? "https://t.me/" + encodeURIComponent(name) : "";
    case "youtube":
      return id ? "https://www.youtube.com/channel/" + encodeURIComponent(id)
                : (name ? "https://www.youtube.com/results?search_query=" + encodeURIComponent(name) : "");
    case "threads": case "instagram":
      return name ? "https://www.threads.net/@" + encodeURIComponent(name) : "";
    default:
      return "";
  }
}

// 博主主页也优先交给本机客户端
function nativeUserURLFor(platform, authorUrl, authorId){
  const u = String(authorUrl || "");
  const id = String(authorId || "");
  switch(String(platform || "").toLowerCase()){
    case "xiaohongshu": {
      const m = u.match(/user\/profile\/([0-9a-f]+)/i);
      const uid = (m && m[1]) || id;
      return uid ? "xhsdiscover://user/" + encodeURIComponent(uid) : "xhsdiscover://";
    }
    case "douyin": {
      // 抖音 Mac 客户端的深链格式是 douyin-pc://webview?url=<编码后的网页地址>
      // （asar 里 scheme parser 要求 webview 路径 + url 查询参数；/user/profile/ 旧格式会被忽略）
      const m = u.match(/user\/([^/?#]+)/);
      const uid = (m && m[1]) || id;
      return uid ? "douyin-pc://webview?url=" + encodeURIComponent("https://www.douyin.com/user/" + uid) : "";
    }
    case "telegram": {
      const m = u.match(/t\.me\/([^/?#]+)/);
      return m ? "tg://resolve?domain=" + encodeURIComponent(m[1]) : "tg://";
    }
    case "bilibili": {
      const m = u.match(/space\.bilibili\.com\/(\d+)/);
      return m ? "bilibili://space/" + m[1] : "bilibili://";
    }
    case "youtube":
      return "youtube://";
    default:
      return "";
  }
}

function renderPanelContent(it, b){
  b.innerHTML = "";
  const files = it.files || [];
  // 只把「真正的实况配对」合成一组：01.jpg + 01_live.mp4，或 01.jpg + 01.mov。
  // 普通同名视频（01.mp4）不再跟图片配对，避免把普通图文误标成实况。
  const imgByStem = new Map();
  files.forEach(f => {
    if(f.kind !== "image") return;
    const stem = f.name.replace(/\.[^.]+$/, "");
    if(!imgByStem.has(stem)) imgByStem.set(stem, f);
  });
  const groups = new Map();
  const groupOf = key => {
    if(!groups.has(key)) groups.set(key, {});
    return groups.get(key);
  };
  files.forEach(f => {
    if(f.kind === "audio") return;   // 音频只用于导出，界面上不展示
    const base = f.name.replace(/\.[^.]+$/, "");
    if(f.kind === "image"){
      const g = groupOf(base);
      if(!g.image) g.image = f;
      return;
    }
    const stem = base.replace(/_(live|mov)$/i, "");
    const liveName = /_live$/i.test(base) || /\.mov$/i.test(f.name);
    if(liveName && imgByStem.has(stem)){
      const g = groupOf(stem);
      if(!g.video) g.video = f;      // 实况伴生视频：跟着图片走
    }else{
      const g = groupOf("__v__:" + f.url);
      g.video = f;                   // 普通视频：单独一格
    }
  });
  const keys = [...groups.keys()].sort((a, b) => {
    const ai = a.startsWith("__v__:"), bi = b.startsWith("__v__:");
    if(ai !== bi) return ai ? 1 : -1;
    return a.localeCompare(b, "zh-CN", {numeric: true});
  });

  if(it.missing){
    const isEmpty = !!(it.empty && it.folder_exists);
    const tip = document.createElement("div");
    tip.className = "banner";
    tip.style.cssText = "margin:0 0 14px;flex-wrap:wrap";
    if(isEmpty){
      // 目录在但还没放文件（刚建的作品）→ 提示添加，不算「丢失」
      tip.innerHTML = `<span>这条作品还没有文件。可以选照片或视频放进去。</span>
        <button class="small" id="_nwAdd">添加照片或视频…</button>`;
    }else{
      tip.innerHTML = `<span>这条记录的文件已经不在磁盘上了（可能在 Finder 里被挪走或删除）。</span>
        <button class="small" id="_nwRescan">找回（重新扫描）</button>
        <button class="small" id="_nwRelocate">指定新位置…</button>`;
    }
    b.appendChild(tip);
    setTimeout(() => {
      const addBtn = tip.querySelector("#_nwAdd");
      if(addBtn) addBtn.onclick = () => addFilesToItem(it);
      const rescanBtn = tip.querySelector("#_nwRescan");
      if(rescanBtn) rescanBtn.onclick = () => rescanOneItem(it);
      const relocBtn = tip.querySelector("#_nwRelocate");
      if(relocBtn) relocBtn.onclick = () => relocateItemManually(it);
    }, 0);
  }

  const onlyVideo = keys.length === 1 && groups.get(keys[0]).video
                    && !groups.get(keys[0]).image;
  if(onlyVideo){
    const vsrc = groups.get(keys[0]).video.url;
    let vposter = "";
    try{
      vposter = "/api/poster?p=" + encodeURIComponent(decodeURIComponent(vsrc.split("p=")[1] || ""));
    }catch(e){}
    const pl = buildPlayer(vsrc, vposter);
    b.appendChild(pl.wrap);
    setTimeout(() => pl.video.play().catch(()=>{}), 200);
  }else if(keys.length){
    // 图文：Telegram 式气泡网格，每气泡最多 4 张
    const gallery = document.createElement("div");
    gallery.className = "pgallery";

    const cells = [];
    keys.forEach(k => {
      const g = groups.get(k);
      const cell = document.createElement("div");
      cell.className = "bcell";

      let thumb = null;
      if(g.image){
        const im = document.createElement("img");
        im.src = thumbURL(g.image); im.loading = "lazy"; im.decoding = "async";
        cell.appendChild(im);
        thumb = im;
      }else if(g.video){
        const pl = buildPlayer(g.video.url, (() => {
          try{ return "/api/poster?p=" + encodeURIComponent(decodeURIComponent(g.video.url.split("p=")[1] || "")); }
          catch(e){ return ""; }
        })());
        cell.appendChild(pl.wrap);
        thumb = pl.wrap;
      }

      // 实况 = 同 stem 的图 + 实况伴生视频（01.jpg + 01_live.mp4 / 01.mov）
      const isLive = !!(g.image && g.video);
      let liveTag = null;
      if(isLive){
        // 跟灯箱里的实况 chip 用同一套 DOM，视觉 1:1
        liveTag = document.createElement("button");
        liveTag.type = "button";
        liveTag.className = "livechip ltag";
        liveTag.title = "查看实况";
        liveTag.innerHTML = document.getElementById("lbLiveBtn").innerHTML;
        cell.appendChild(liveTag);
      }
      const meta = {
        cell,
        img: g.image ? g.image.url : "",
        thumb: g.image ? thumbURL(g.image) : "",   // 灯箱先用缩略图秒开，原图后台替换
        vid: isLive ? g.video.url : "",     // 非实况时清空 vid，避免误判
        isLive
      };
      cells.push(meta);
      if(liveTag){
        const idx = cells.indexOf(meta);
        liveTag.onclick = ev => {
          ev.stopPropagation();
          openLightbox(cells, idx);
        };
      }
      // 单击：多选模式下勾选/取消，否则开灯箱
      cell.onclick = (ev) => {
        if(ev.target.closest(".livechip")) return;
        if(photoSelMode && photoSelItemId === String(it.id)){
          togglePhotoSel(meta);
          return;
        }
        openLightbox(cells, cells.indexOf(meta));
      };
      // 右键图片：添加 / 删除单个文件；多选模式下改成勾选
      cell.oncontextmenu = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        if(photoSelMode && photoSelItemId === String(it.id)){
          togglePhotoSel(meta);
          return;
        }
        const m = document.getElementById("ctxmenu");
        const fileLabel = g.image ? g.image.name : (g.video ? g.video.name : "文件");
        m.innerHTML = `<div class="ctxrow" data-act="addimg">添加照片或视频…</div>`
          + `<div class="ctxrow" data-act="selmode">多选照片</div>`
          + `<div class="ctxrow ctxdanger" data-act="delfile">删除「${esc(fileLabel)}」</div>`;
        m.style.left = Math.min(ev.clientX, window.innerWidth - 220) + "px";
        m.style.top = Math.min(ev.clientY, window.innerHeight - 130) + "px";
        m.classList.add("on");
        m.querySelector("[data-act='addimg']").onclick = () => {
          m.classList.remove("on");
          addFilesToItem(it).then(() => refreshOpenPanel(it.id));
        };
        m.querySelector("[data-act='selmode']").onclick = () => {
          m.classList.remove("on");
          enterPhotoSel(it, meta);
        };
        m.querySelector("[data-act='delfile']").onclick = async () => {
          m.classList.remove("on");
          const ok = await askConfirm("删除文件", "确定从这条作品里移除「" + fileLabel + "」？\n文件会移到废纸篓。", "删除", true);
          if(!ok) return;
          const filePath = g.image ? mediaPath(g.image.url) : (g.video ? mediaPath(g.video.url) : "");
          if(!filePath) return;
          const r = await fetch("/api/delete_file", { method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ item_id: it.id, path: filePath })
          }).then(x => x.json()).catch(() => null);
          if(r && r.ok){ toast("已移除"); refreshOpenPanel(it.id); }
          else toast("失败：" + ((r && r.error) || ""));
        };
      };
      // 长按图片 500ms：进入照片多选模式并勾上这张
      let _lpTimer = null;
      cell.addEventListener("mousedown", (ev) => {
        if(ev.button !== 0) return;
        _lpTimer = setTimeout(() => {
          _lpTimer = null;
          enterPhotoSel(it, meta);
        }, 500);
      });
      cell.addEventListener("mouseup", () => { if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer = null; } });
      cell.addEventListener("mouseleave", () => { if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer = null; } });
    });

    // 苹果相册式扁平网格：所有 cell 直接放进 pgallery，缩放改 --dw 控制列数
    cells.forEach(c => gallery.appendChild(c.cell));
    b.appendChild(gallery);

    // ---- 照片多选操作条 ----
    const pselBar = document.createElement("div");
    pselBar.className = "pselbar";
    pselBar.style.display = "none";
    pselBar.innerHTML = `<span class="pselcount">已选 0 张</span>
      <button class="small" data-psel="all">全选</button>
      <span class="sp"></span>
      <button class="small" data-psel="del" style="color:var(--danger)">删除选中</button>
      <button class="small" data-psel="cancel">取消</button>`;
    b.insertBefore(pselBar, b.firstChild);

    function photoKey(mm){ return mm.img || mm.vid; }
    function updatePhotoSelUI(){
      const on = photoSelMode && photoSelItemId === String(it.id);
      pselBar.style.display = on ? "" : "none";
      cells.forEach(mm => mm.cell.classList.toggle("psel", on && photoSel.has(photoKey(mm))));
      if(on) pselBar.querySelector(".pselcount").textContent = "已选 " + photoSel.size + " 张";
    }
    function enterPhotoSel(item, meta){
      if(photoSelItemId !== String(item.id)) photoSel.clear();
      photoSelMode = true;
      photoSelItemId = String(item.id);
      const k = photoKey(meta);
      if(k) photoSel.add(k);
      updatePhotoSelUI();
      toast("照片多选：点照片勾选 / 取消，再点「删除选中」批量删");
    }
    function togglePhotoSel(meta){
      const k = photoKey(meta);
      if(!k) return;
      if(photoSel.has(k)) photoSel.delete(k); else photoSel.add(k);
      updatePhotoSelUI();
    }
    pselBar.querySelector("[data-psel='all']").onclick = () => {
      cells.forEach(mm => { const k = photoKey(mm); if(k) photoSel.add(k); });
      updatePhotoSelUI();
    };
    pselBar.querySelector("[data-psel='cancel']").onclick = () => {
      photoSelMode = false; photoSelItemId = null; photoSel.clear();
      updatePhotoSelUI();
    };
    pselBar.querySelector("[data-psel='del']").onclick = async () => {
      const ks = [...photoSel];
      if(!ks.length){ toast("还没选照片"); return; }
      const ok = await askConfirm("删除照片",
        "删除选中的 " + ks.length + " 个文件？\n文件会移到废纸篓。", "删除", true);
      if(!ok) return;
      let done = 0;
      for(const k of ks){
        const p = mediaPath(k);
        if(!p) continue;
        const r = await fetch("/api/delete_file", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item_id: it.id, path: p })
        }).then(x => x.json()).catch(() => null);
        if(r && r.ok) done++;
      }
      photoSelMode = false; photoSelItemId = null; photoSel.clear();
      toast("已删除 " + done + " 个文件");
      refreshOpenPanel(it.id);
    };
    updatePhotoSelUI();
  }
  applyAutoState();          // 让缩略图上的实况角标与当前自动播放状态一致
  const kv = document.createElement("div"); kv.className = "kv";
  const created = it.created || (it.created_ts ? new Date(it.created_ts * 1000).toLocaleString("zh-CN", {hour12:false}).replace(/\//g, "-") : "");
  kv.innerHTML = `
    <span>标题</span><b class="kvtitle">${esc(it.title || "")}</b>
    <span>平台</span><b>${esc(it.platform_cn)}</b>
    <span>博主</span><b><a href="#" class="authorlink" data-author="${esc(it.author || "")}" data-author-key="${esc(it.author_id || it.author || "")}">${esc(it.author) || "未知博主"}</a>${(() => { const hu = authorHomeURLFor(it); return hu ? ` · <a href="${esc(hu)}" class="outlink" data-native="${esc(nativeUserURLFor(it.platform, hu, it.author_id))}">主页</a>` : ""; })()}</b>
    <span>发布时间</span><b>${esc(created) || "—"}</b>
    <span>互动</span><b>♡ ${it.digg ?? "—"} ｜ 评论 ${it.comment ?? "—"} ｜ 收藏 ${it.collect ?? "—"}</b>
    <span>原帖</span><b><a href="${esc(it.source_url)}" target="_blank" class="outlink" data-native="${esc(nativeURLFor(it.platform, it.item_id, it.source_url))}">打开</a></b>`;
  b.appendChild(kv);
  // 有 .mov 配对才显示「导入到照片」
  const hasLive = hasLivePair(files);
  // 「导入实况照片到照片 App」按钮已移除（用户不需要）
  return { hasLive };
}

/* ---------- AI 分析 ---------- */
const PRI_TEXT = { high: "高", medium: "中", low: "低" };

/* ---------- 自定义视频播放器 ---------- */
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
const ICON_FULL = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_EXIT = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

function clockText(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  const pad = n => String(n).padStart(2, "0");
  return h ? h + ":" + pad(m) + ":" + pad(ss) : m + ":" + pad(ss);
}

function buildPlayer(src, poster){
  const wrap = document.createElement("div");
  wrap.className = "player";

  const bg = document.createElement("div");
  bg.className = "pbg";
  if(poster) bg.style.backgroundImage = `url("${poster}")`;
  wrap.appendChild(bg);

  const v = document.createElement("video");
  v.src = src;
  if(poster) v.poster = poster;
  v.playsInline = true;
  v.preload = "metadata";
  wrap.appendChild(v);

  const bar = document.createElement("div");
  bar.className = "pbar";
  bar.innerHTML = `
    <button class="pbtn play" title="播放 / 暂停（空格）">${ICON_PLAY}</button>
    <div class="pseek" title="拖动跳转">
      <div class="rail"><div class="fill"></div></div>
      <div class="knob"></div>
    </div>
    <span class="ptime"><b>0:00</b> / 0:00</span>
    <button class="pbtn rate" title="倍速">1×</button>
    <button class="pbtn full" title="全屏（F）">${ICON_FULL}</button>`;
  wrap.appendChild(bar);

  const btnPlay = bar.querySelector(".play");
  const btnFull = bar.querySelector(".full");
  const seek = bar.querySelector(".pseek");
  const fill = bar.querySelector(".fill");
  const knob = bar.querySelector(".knob");
  const timeEl = bar.querySelector(".ptime");

  // 视频真正开始播放后，把模糊背景换成视频画面本身
  v.addEventListener("playing", () => {
    if(!bg.style.backgroundImage && v.videoWidth){
      try{
        const c = document.createElement("canvas");
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext("2d").drawImage(v, 0, 0);
        bg.style.backgroundImage = `url("${c.toDataURL("image/jpeg", 0.6)}")`;
      }catch(e){}
    }
  });
  v.addEventListener("loadedmetadata", render);

  function render(){
    const dur = v.duration || 0, cur = v.currentTime || 0;
    const pct = dur ? (cur / dur) * 100 : 0;
    fill.style.width = pct + "%";
    knob.style.left = pct + "%";
    timeEl.innerHTML = `<b>${clockText(cur)}</b> / ${clockText(dur)}`;
    btnPlay.innerHTML = v.paused ? ICON_PLAY : ICON_PAUSE;
    btnFull.innerHTML = document.fullscreenElement ? ICON_EXIT : ICON_FULL;
  }

  ["timeupdate","play","pause","ended","durationchange"].forEach(ev => v.addEventListener(ev, render));

  // 倍速：0.75 / 1 / 1.25 / 1.5 / 2 循环
  const RATES = [1, 1.25, 1.5, 2, 0.75];
  let rateIdx = 0;
  const btnRate = bar.querySelector(".rate");
  btnRate.onclick = () => {
    rateIdx = (rateIdx + 1) % RATES.length;
    v.playbackRate = RATES[rateIdx];
    btnRate.textContent = RATES[rateIdx] + "×";
  };

  btnPlay.onclick = () => { v.paused ? v.play() : v.pause(); };
  v.addEventListener("click", () => { v.paused ? v.play() : v.pause(); });

  btnFull.onclick = () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else wrap.requestFullscreen?.().catch(()=>{});
  };
  // Use per-element listener instead of global to avoid leak
  wrap.addEventListener("fullscreenchange", render);

  let dragging = false;
  function seekTo(clientX){
    const r = seek.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    if(v.duration) v.currentTime = pct * v.duration;
    fill.style.width = (pct * 100) + "%";
    knob.style.left = (pct * 100) + "%";
  }
  seek.addEventListener("pointerdown", e => {
    dragging = true; seek.classList.add("dragging");
    seek.setPointerCapture?.(e.pointerId); seekTo(e.clientX);
  });
  seek.addEventListener("pointermove", e => { if(dragging) seekTo(e.clientX); });
  seek.addEventListener("pointerup", e => {
    dragging = false; seek.classList.remove("dragging"); seekTo(e.clientX);
  });
  seek.addEventListener("pointercancel", () => { dragging = false; seek.classList.remove("dragging"); });

  wrap.tabIndex = 0;
  wrap.addEventListener("keydown", e => {
    switch(e.key){
      case " ": case "k": e.preventDefault(); v.paused ? v.play() : v.pause(); break;
      case "ArrowLeft": e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 5); break;
      case "ArrowRight": e.preventDefault(); v.currentTime = Math.min(v.duration||0, v.currentTime + 5); break;
      case "f": case "F": e.preventDefault(); btnFull.click(); break;
      case "m": case "M": e.preventDefault(); v.muted = !v.muted; break;
    }
  });

  render();
  return { wrap, video: v };
}

function fmtSec(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), ss = sec%60;
  const pad = n => String(n).padStart(2, "0");
  return h ? h + ":" + pad(m) + ":" + pad(ss) : m + ":" + pad(ss);
}

function extractUrls(text){
  const out = [], seen = new Set();
  const s = String(text || "").replace(/\u200b/g, "");
  const re = /https?:\/\/[^\s<>"'“”‘’，。；：！？、（）【】《》〈〉「」『』]+/gi;
  let m;
  while ((m = re.exec(s))) {
    let u = m[0].replace(/[)\]}>"'“”‘’，。；：！？、.,;:!?]+$/g, "");
    if (!/^https?:\/\//i.test(u)) continue;
    try { new URL(u); } catch (e) { continue; }
    if (!seen.has(u)) { seen.add(u); out.push(u); }
  }
  return out;
}
function extractUrl(text){ const a = extractUrls(text); return a.length ? a[0] : null; }

let taskTimer = null;
let seenDoneTasks = new Set();
let firstPoll = true;
let newItemsCount = 0;
let toastedDuplicates = new Set();

function showNewItems(n){
  newItemsCount += n;
  const el = $("#freshPill");
  el.hidden = false;
  el.textContent = newItemsCount + " 条新作品 · 点击刷新";
}

async function startPolling(){
  if(taskTimer) return;
  const tick = async () => {
    // list 必须声明在 try 外面：finally 里要用它算下次轮询间隔，
    // 否则 try 里一旦抛异常，finally 引用不到 list → 轮询彻底停摆
    let list = [];
    try {
      try { list = await fetch("/api/tasks?" + Date.now()).then(r => r.json()); } catch(e){}
      if(!Array.isArray(list)) list = [];
      try { renderTasks(list); } catch(e) { console.error("renderTasks", e); }
      const active = list.filter(t => t.status === "running" && !t.queued).length;
      const queued = list.filter(t => t.status === "running" && t.queued).length;
      const running = active + queued;
      const done = list.filter(t => t.status === "done").length;
      // 用户叉掉的不再计入失败数，否则状态栏一直红着
      const failed = list.filter(t => t.status === "error" && !dismissedTasks.has(t.id)).length;
      for (const t of list) {
        if (t.status !== "done") continue;
        const isNew = !seenDoneTasks.has(t.id);
        seenDoneTasks.add(t.id);
        if (isNew && !firstPoll) {
          if (t.duplicate || t.skipped) {
            if (!toastedDuplicates.has(t.id)) {
              toastedDuplicates.add(t.id);
              const nm = (t.item && t.item.title) || (t.progress && t.progress.step) || "这条";
              toast("「" + nm.slice(0, 20) + "」已存在");
            }
          } else {
            showNewItems(1);
          }
        }
      }
      if(running){
        setStatus("wait", active
          ? `处理中 ${active} 条` + (queued ? ` · 排队 ${queued}` : "")
          : `排队 ${queued} 条`);
      }else if(!_cdpConnected){
        setStatus("warn", "未连接");
      }else if(failed){
        setStatus("bad", `${failed} 条失败`);
      }else{
        setStatus("ok", "正常");
      }
      firstPoll = false;
      const pending = list.some(t => t.status === "running");
      if(!pending && !list.length){ try { renderTasks([]); } catch(e){} }
      // Memory leak prevention: clear tracking Sets when idle
      // 注意：不能清 dismissedTasks——用户刚叉掉的失败任务还在后端列表里（20s 才过期），
      // 清了就会重新弹出来。只清 toast 去重和 done 标记。
      if(!pending && (!list.length || list.every(t => t.status === "done" || t.status === "error" || t.status === "cancelled"))){
        seenDoneTasks.clear();
        toastedDuplicates.clear();
      }
      // Cap dismissedTasks at 500 entries
      if(dismissedTasks.size > 500){
        const arr = [...dismissedTasks];
        dismissedTasks = new Set(arr.slice(arr.length - 250));
      }
    } catch(e) {
      console.error("poll", e);
    } finally {
      // 无论如何都要续上，否则一次异常就再也不刷新了
      let delay = 5000;
      try { delay = list.some(t => t.status === "running") ? 1200 : 5000; } catch(e){}
      taskTimer = setTimeout(tick, delay);
    }
  };
  taskTimer = setTimeout(tick, 300);
}

let taskPopOpen = false;
let dismissedTasks = new Set();

// 按平台粗估耗时（秒），用于进度条
function etaFor(url){
  const u = (url || "").toLowerCase();
  if(/douyin|iesdouyin/.test(u)) return 25;
  if(/xhslink|xiaohongshu/.test(u)) return 18;
  if(/bilibili|b23\.tv/.test(u)) return 45;
  if(/youtube|youtu\.be/.test(u)) return 70;
  if(/instagram/.test(u)) return 40;
  if(/weibo/.test(u)) return 30;
  if(/reddit/.test(u)) return 35;
  if(/tiktok/.test(u)) return 30;
  return 40;
}
function renderTasks(list){
  const nowSec = Date.now() / 1000;
  const shown = list.filter(t => {
    if(dismissedTasks.has(t.id)) return false;
    if(t.status === "running") return true;
    // 失败的多留一会儿（20 秒），成功的 5 秒后自动消失
    const keep = t.status === "error" ? 20 : (t.status === "cancelled" ? 3 : 5);
    const fin = t.finished || 0;
    return fin > 0 && (nowSec - fin) < keep;
  });
  const st = $("#status"), caret = $("#statusCaret"), pop = $("#taskPop");
  // #statusCaret / #sbar 这两个元素在当前布局里已经没有了，取不到就跳过，
  // 别让一个空引用把整个任务轮询渲染打断
  const sbar = $("#sbar");

  if(!shown.length){
    if(st) st.classList.remove("busy");
    if(pop){ pop.classList.remove("on"); pop.innerHTML = ""; }
    taskPopOpen = false;
    if(sbar) sbar.style.width = "0%";
    return;
  }
  if(st) st.classList.add("busy");
  if(pop && taskPopOpen) pop.classList.add("on");

  // 状态栏只显示数量，进度在各任务行里
  const active = shown.filter(t => t.status === "running" && !t.queued);
  const queuedN = shown.filter(t => t.status === "running" && t.queued).length;
  const stText = document.getElementById("statusText");
  if(stText){
    stText.textContent = active.length
      ? `处理中 ${active.length} 条` + (queuedN ? ` · 排队 ${queuedN}` : "")
      : (queuedN ? `排队 ${queuedN} 条` : "正常");
  }

  pop.innerHTML = shown.map(t => {
    const running = t.status === "running";
    const queued = running && !!t.queued;
    const secs = t.started ? Math.max(0, Math.round(Date.now()/1000 - t.started)) : 0;
    // 任务名：优先用帖子标题，没有就用简化链接
    let label = (t.item && t.item.title) || "";
    if(!label){
      try{
        const u = new URL(t.url);
        label = u.hostname.replace(/^www\./, "") + u.pathname.replace(/\/$/, "");
      }catch(e){ label = t.url || ""; }
    }
    // 每个任务自己的进度
    // 正计时：mm:ss（超过 1 小时显示 h:mm:ss）
    const el = secs;
    const timeTxt = el < 3600
      ? Math.floor(el/60) + ":" + String(el%60).padStart(2,"0")
      : Math.floor(el/3600) + ":" + String(Math.floor(el%3600/60)).padStart(2,"0") + ":" + String(el%60).padStart(2,"0");
    let pct = 0, pending = true, note = timeTxt;
    let barCls = "";              // 进度条样式：indet=抓取中晃动 / pending=下载中淡化
    const pg = t.progress;
    if(queued){
      note = "排队中";
      barCls = "pending";
    } else if(pg && pg.phase === "download" && pg.total > pg.done){
      // 知道总量 → 真实百分比 + 剩余时间
      pct = Math.min(99, (pg.done / pg.total) * 100);
      pending = false;
      const spd = (pg.speed || 0) / 1048576;
      const eta = pg.eta || 0;
      note = spd > 0.05 ? spd.toFixed(1) + "MB/s" : "";
      if(eta >= 1) note += (note ? " · 剩 " : "") + (eta < 60 ? Math.round(eta) + "s" : Math.round(eta/60) + "m");
      if(!note) note = Math.round(pct) + "%";
    } else if(pg && pg.phase === "download"){
      // 字节在长但不知道总量（抖音）
      const mb = (pg.done || 0) / 1048576;
      const spd = (pg.speed || 0) / 1048576;
      note = mb.toFixed(1) + "MB" + (spd > 0.05 ? " · " + spd.toFixed(1) + "MB/s" : "");
      pending = true; barCls = "pending";
    } else if(pg && pg.phase === "connect"){ note = "连接中"; pending = true; }
    else if(pg && pg.phase === "verify"){ pct = 97; pending = false; note = "校验中"; }
    else if(pg && pg.phase === "parse"){ note = pg.step || "处理中"; pending = true; barCls = "indet"; }
    else if(running){ note = "准备中"; pending = true; barCls = "indet"; }

    const done = t.status === "done";
    const cancel = t.status === "cancelled";
    const skip = done && (t.skipped || t.duplicate);
    const dotCls = queued ? "queued" : (running ? "wait" : (cancel ? "cancel" : (done ? "ok" : "bad")));
    let endTxt = "完成";
    if(skip) endTxt = "已存在";
    else if(cancel) endTxt = "已取消";
    else if(!done) endTxt = t.error_reason ? "失败：" + t.error_reason.slice(0, 30) : "失败";
    return `<div class="taskrow" data-id="${esc(t.id)}">
      <span class="dot ${dotCls}"></span>
      <span class="u" title="${esc(t.url)}">${esc(label)}</span>
      ${running && !queued ? `<div class="tprog"><div class="tbar${barCls ? " " + barCls : ""}" style="width:${pct.toFixed(1)}%"></div></div>` : ""}
      <span class="s" title="${esc(t.error_reason || "")}">${running ? note : endTxt}</span>
      <button class="x" title="${running ? "取消这个任务" : "移除记录"}">✕</button>
    </div>`;
  }).join("");

  pop.querySelectorAll(".taskrow .x").forEach(btn => {
    btn.onclick = async ev => {
      ev.stopPropagation();
      const row = btn.closest(".taskrow");
      const id = row.dataset.id;
      const isRunning = row.querySelector(".dot")?.classList.contains("wait");
      if(!isRunning){
        // 已结束（完成/失败/取消）：直接从 UI 移除，不再等 API
        dismissedTasks.add(id);
        row.remove();
        return;
      }
      // 运行中：调 cancel API
      btn.disabled = true;
      btn.textContent = "…";
      try{
        const r = await fetch("/api/task/" + encodeURIComponent(id) + "/cancel",
                              {method:"POST"}).then(x=>x.json()).catch(()=>null);
        if(r && r.ok){
          dismissedTasks.add(id);
          row.remove();
        }else{
          btn.disabled = false; btn.textContent = "✕";
        }
      }catch(e){
        btn.disabled = false;
        btn.textContent = "✕";
      }
    };
  });
}

let lbZoom = 1, lbZx = 0, lbZy = 0, lbPan = null;
const LB_ZOOM_MAX = 4;

function lbStage(){ return $("#lightbox .lbstage"); }
function lbApplyZoom(){
  const st = lbStage();
  if(!st) return;
  st.style.transform = lbZoom <= 1.001 ? "" : `translate(${lbZx}px, ${lbZy}px) scale(${lbZoom})`;
  $("#lightbox").classList.toggle("zoomed", lbZoom > 1.001);
}
function lbResetZoom(){
  lbZoom = 1; lbZx = 0; lbZy = 0; lbPan = null;
  const st = lbStage();
  if(st){ st.style.transition = "none"; lbApplyZoom(); st.style.transition = ""; }
}
function lbSetZoom(s, cx, cy){
  const old = lbZoom;
  s = Math.max(1, Math.min(LB_ZOOM_MAX, s));
  if(Math.abs(s - old) < 0.001) return;
  if(cx === undefined){ cx = window.innerWidth / 2; cy = window.innerHeight / 2; }
  const px = cx - window.innerWidth / 2, py = cy - window.innerHeight / 2;
  if(old > 0.001){
    lbZx = px - (px - lbZx) * (s / old);
    lbZy = py - (py - lbZy) * (s / old);
  }
  lbZoom = s;
  if(lbZoom <= 1.001){ lbZoom = 1; lbZx = 0; lbZy = 0; }
  const st = lbStage();
  if(st) st.style.transition = "transform .12s ease-out";
  lbApplyZoom();
}

  lbPreloaded.add(m.img);
  // 预加载也先缓存缩略图（秒开），再后台拉原图
  if(m.thumb){
    const th = new Image();
    th.decoding = "async";
    th.src = m.thumb;
  }
  const im = new Image();
  im.decoding = "async";
  im.src = m.img;
  if(im.decode) im.decode().catch(() => {});
}

function lbPreload(idx){
  const n = lbSlides.length;
  if(n < 2) return;
  [idx + 1, idx - 1, idx + 2, idx - 2].forEach(i => lbPreloadOne(lbSlides[((i % n) + n) % n]));
}

function lbPreloadAll(){
  const n = lbSlides.length;
  if(n < 2 || n > 30) return;
  for(let i = 0; i < n; i++) lbPreloadOne(lbSlides[i]);
}

/* 实况视频：等元数据就绪再 play，避免刚换 src 就被 AbortError 打断 */
function lbPlayLive(meta){
  const vid = lbVid();
  if(!lbIsLive(meta)){ lbStopLive(); return; }
  const url = meta.vid;
  const token = ++lbLiveToken;

  vid.muted = true;
  vid.defaultMuted = true;
  vid.setAttribute("muted", "");
  vid.setAttribute("playsinline", "");
  vid.setAttribute("webkit-playsinline", "");
  vid.loop = false;
  vid.preload = "auto";
  if(vid.getAttribute("src") !== url){
    vid.setAttribute("src", url);
    try{ vid.load(); }catch(e){}
  }
  vid.hidden = false;
  vid.style.display = "block";
  vid.style.zIndex = "3";
  vid.style.transform = "translateX(0)";
  lbSetLivePill(true);

  let started = false;
  const start = () => {
    if(token !== lbLiveToken || started) return;
    started = true;
    try{ if(vid.readyState >= 1) vid.currentTime = 0; }catch(e){}
    let pr = null;
    try{ pr = vid.play(); }catch(e){}
    if(pr && pr.catch){
      pr.catch(err => {
        if(token !== lbLiveToken) return;
        const name = (err && err.name) || "";
        if(name === "AbortError") return;                  // 被切图打断，属于正常
        if(name === "NotSupportedError"){ lbLiveFallback(meta); return; }
        lbStopLive();                                      // 系统不允许自动播放 → 留按钮给用户点
      });
    }
  };
  if(vid.readyState >= 2){
    start();
  }else{
    const onReady = () => {
      vid.removeEventListener("canplay", onReady);
      vid.removeEventListener("loadeddata", onReady);
      start();
    };
    vid.addEventListener("canplay", onReady);
    vid.addEventListener("loadeddata", onReady);
    setTimeout(() => {
      vid.removeEventListener("canplay", onReady);
      vid.removeEventListener("loadeddata", onReady);
      if(token === lbLiveToken) start();
    }, 700);
  }
}

function lbStopLive(){
  const vid = lbVid();
  lbLiveToken++;
  try{ vid.pause(); }catch(e){}
  vid.hidden = true;
  vid.style.display = "none";
  vid.style.transform = "translateX(0)";
  lbSetLivePill(false);
}

/* 浏览器解不了的编码（HEVC / .mov 等）→ 让后端转一份 H.264 再播 */
function lbLiveFallback(meta){
  if(!meta || !meta.vid || meta._fallbackTried) return;
  meta._fallbackTried = true;
  let raw = "";
  try{ raw = new URL(meta.vid, location.href).searchParams.get("p") || ""; }catch(e){}
  if(!raw){ lbStopLive(); return; }
  const token = lbLiveToken;
  fetch("/api/live_mp4?p=" + encodeURIComponent(raw))
    .then(r => r.json())
    .then(r => {
      if(token !== lbLiveToken) return;
      if(r && r.ok && r.url){
        meta.vid = r.url;
        lbPlayLive(meta);
      }else{
        lbStopLive();
        toast("这条实况视频无法解码，已显示静态图");
      }
    })
    .catch(() => {
      if(token !== lbLiveToken) return;
      lbStopLive();
      toast("实况视频转码失败，已显示静态图");
    });
}

function lbToggleLive(meta){
  if(!lbIsLive(meta)) return;
  if(lbLivePlaying()) lbStopLive();
  else lbPlayLive(meta);
}

function lbRender(meta){
  lbToken++;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  lbStopLive();
  const cur = lbCurImg(), back = lbBackImg();
  cur.hidden = false;
  cur.style.transition = "none";
  cur.style.transform = "translateX(0)";
  cur.style.zIndex = "2";
  cur.dataset.idx = String(lbIdx);
  const want = (meta && meta.img) || "";
  const thumb = (meta && meta.thumb) || "";
  // 照片多时原图大（5-20MB），先用缩略图秒开，原图后台加载完再无缝替换
  if(thumb && want){
    if(cur.getAttribute("src") !== thumb) cur.src = thumb;
    const token = lbToken;
    const hi = new Image();
    hi.onload = () => {
      if(token !== lbToken) return;   // 已经切到下一张了，丢弃
      if(cur.dataset.idx === String(lbIdx) && cur.getAttribute("src") !== want){
        cur.src = want;
      }
    };
    hi.src = want;
  }else{
    if(cur.getAttribute("src") !== want) cur.src = want;
  }
  back.hidden = true;
  back.style.transition = "none";
  back.style.transform = "translateX(0)";
  back.style.zIndex = "1";
  back.dataset.idx = "";
  updateLbChrome();
  lbSetLivePill(false);
  if(lbIsLive(meta) && livePref.auto) lbPlayLive(meta);
}

/* 立刻收尾正在跑的切换：把目标层放到正面，避免卡在半路 */
function lbSettle(token, silent){
  if(token && token !== lbToken) return;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  const meta = lbSlide();
  const want = meta.img || "";
  let target = lbCurImg();
  if(target.dataset.idx !== String(lbIdx)) target = lbBackImg();
  const other = (target === lbCurImg()) ? lbBackImg() : lbCurImg();
  target.hidden = false;
  target.style.transition = "none";
  target.style.transform = "translateX(0)";
  target.style.zIndex = "2";
  if(want && target.getAttribute("src") !== want) target.src = want;
  other.hidden = true;
  other.style.transition = "none";
  other.style.transform = "translateX(0)";
  other.style.zIndex = "1";
  lbFront = (target.id === "lbimgA") ? 0 : 1;
  lbToken++;
  lbSetLivePill(false);
  if(!silent && lbIsLive(meta) && livePref.auto) lbPlayLive(meta);
}

/** 切一张：拖拽/滚轮/键盘都走这里；不再有「切换中吞掉输入」的锁 */
function lbGo(dir, fromDx){
  lbResetZoom();
  const n = lbSlides.length;
  if(n < 2) return;
  if(lbAnimating) lbSettle(0, true);

  const nextIdx = (lbIdx + dir + n) % n;
  const meta = lbSlides[nextIdx] || {};
  const cur = lbCurImg(), nxt = lbBackImg();
  const token = ++lbToken;
  const outX = dir > 0 ? "-100vw" : "100vw";
  const inX  = dir > 0 ? "100vw" : "-100vw";

  lbStopLive();
  lbIdx = nextIdx;

  cur.hidden = false;
  cur.style.transition = "none";
  cur.style.transform = (typeof fromDx === "number" && fromDx) ? `translateX(${fromDx}px)` : "translateX(0)";
  cur.style.zIndex = "1";

  nxt.hidden = false;
  nxt.style.transition = "none";
  nxt.style.transform = inX;
  nxt.style.zIndex = "2";
  nxt.dataset.idx = String(nextIdx);
  nxt.onload = null;
  nxt.onerror = null;

  const want = meta.img || "";
  const thumb = meta.thumb || "";
  // 滑动切换也先上缩略图，原图后台替换
  if(thumb && want){
    if(nxt.getAttribute("src") !== thumb) nxt.src = thumb;
    const token = lbToken;
    const hi = new Image();
    hi.onload = () => {
      if(token !== lbToken) return;
      if(nxt.dataset.idx === String(nextIdx) && nxt.getAttribute("src") !== want){
        nxt.src = want;
      }
    };
    hi.src = want;
  }else{
    if(want && nxt.getAttribute("src") !== want) nxt.src = want;
  }

  lbAnimating = true;
  updateLbChrome();
  lbSetLivePill(false);
  lbPreload(lbIdx);

  // 连续快滑时把过渡压短，手速多快就跟多快
  const now = Date.now();
  const fast = now - lbLastSwipeAt < 320;
  lbLastSwipeAt = now;
  const dur = fast ? 0.1 : 0.2;

  cur.style.transition = `transform ${dur}s cubic-bezier(.25,.7,.3,1)`;
  nxt.style.transition = `transform ${dur}s cubic-bezier(.25,.7,.3,1)`;
  requestAnimationFrame(() => {
    if(token !== lbToken) return;
    cur.style.transform = outX;
    nxt.style.transform = "translateX(0)";
    clearTimeout(lbSettleTimer);
    lbSettleTimer = setTimeout(() => lbSettle(token), dur * 1000 + 90);
  });
}

function lbShow(i, dir){
  if(!lbSlides.length || lbSlides.length < 2) return;
  const nextIdx = (i + lbSlides.length) % lbSlides.length;
  if(nextIdx === lbIdx) return;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!dir || reduced){
    lbResetZoom();
    if(lbAnimating) lbSettle(0, true);
    lbIdx = nextIdx;
    lbRender(lbSlides[lbIdx]);
  }else{
    lbGo(dir > 0 ? 1 : -1);
  }
}

function openLightbox(slides, index){
  lbResetZoom();
  lbSlides = slides || [];
  lbIdx = Math.max(0, Math.min(index || 0, lbSlides.length - 1));
  lbFront = 0;
  lbPreloaded = new Set();
  lbToken++;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  lbDrag = null;
  lbSwipedAt = 0;
  ["#lbimgA", "#lbimgB"].forEach((sel, i) => {
    const el = $(sel);
    el.hidden = i !== 0;
    el.style.transition = "none";
    el.style.transform = "translateX(0)";
    el.style.zIndex = i === 0 ? "2" : "1";
    el.dataset.idx = "";
  });
  applyAutoState();
  $("#lightbox").classList.add("on");
  const meta = lbSlide();
  const cur = lbCurImg();
  cur.dataset.idx = String(lbIdx);
  const want = meta.img || "";
  const thumb = meta.thumb || "";
  // 先用缩略图秒开，原图后台替换（同 lbRender 逻辑）
  if(thumb && want){
    if(cur.getAttribute("src") !== thumb) cur.src = thumb;
    const token = lbToken;
    const hi = new Image();
    hi.onload = () => {
      if(token !== lbToken) return;
      if(cur.dataset.idx === String(lbIdx) && cur.getAttribute("src") !== want){
        cur.src = want;
      }
    };
    hi.src = want;
  }else{
    if(cur.getAttribute("src") !== want) cur.src = want;
  }
  updateLbChrome();
  lbSetLivePill(false);
  if(lbIsLive(meta) && livePref.auto) lbPlayLive(meta);
  lbPreloadAll();
  lbPreload(lbIdx);
}

function closeLightbox(){
  lbResetZoom();
  $("#lightbox").classList.remove("on", "dragging");
  lbToken++;
  clearTimeout(lbSettleTimer);
  lbAnimating = false;
  lbDrag = null;
  lbSlides = [];
  lbStopLive();
  const vid = lbVid();
  try{ vid.pause(); }catch(e){}
  vid.removeAttribute("src");
  try{ vid.load(); }catch(e){}
  vid.hidden = true;
  vid.style.display = "none";
  $("#lbimgA").hidden = true;
  $("#lbimgB").hidden = true;
  $("#lbLiveBtn").hidden = true;
  $("#lbLiveMenu").hidden = true;
  $("#lbLiveBtn").classList.remove("open");
  $("#lbLivePlay").hidden = true;
}

lbVid().addEventListener("play", () => lbSetLivePill(true));
lbVid().addEventListener("pause", () => { if(!lbLivePlaying()) lbSetLivePill(false); });

/* ---------- 滑动：跟手拖拽（指针捕获，松手立即能再滑） ---------- */
$("#lightbox").addEventListener("pointerdown", e => {
  if(!$("#lightbox").classList.contains("on")) return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  if(e.target.closest(".lbtop, .lbNav, .lblive")) return;
  if(lbZoom > 1.01){
    lbPan = { id: e.pointerId, x: e.clientX, y: e.clientY, tx: lbZx, ty: lbZy };
    $("#lightbox").classList.add("dragging");
    try{ $("#lightbox").setPointerCapture(e.pointerId); }catch(err){}
    const st = lbStage(); if(st) st.style.transition = "none";
    e.preventDefault();
    return;
  }
  if(lbSlides.length < 2) return;
  if(lbAnimating) lbSettle(0, true);            // 上一张还在动 → 立刻收尾，不吞这次手势
  lbDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, active: false, t0: 0,
             wasPlaying: lbLivePlaying() };
  try{ $("#lightbox").setPointerCapture(e.pointerId); }catch(err){}
});

$("#lightbox").addEventListener("pointermove", e => {
  if(lbPan){
    if(e.pointerId !== lbPan.id) return;
    lbZx = lbPan.tx + (e.clientX - lbPan.x);
    lbZy = lbPan.ty + (e.clientY - lbPan.y);
    lbSwipedAt = Date.now();
    lbApplyZoom();
    return;
  }
  if(!lbDrag || e.pointerId !== lbDrag.id) return;
  const dx = e.clientX - lbDrag.x, dy = e.clientY - lbDrag.y;
  if(!lbDrag.active){
    if(Math.abs(dx) < 6) return;
    if(Math.abs(dy) > Math.abs(dx) * 1.25) return;   // 竖向手势不抢
    lbDrag.active = true;
    lbDrag.t0 = Date.now();                          // 记录真正开始拖的时刻，用来算速度
    lbStopLive();                                    // 拖动时先把实况视频收起来
    $("#lightbox").classList.add("dragging");
    const cur = lbCurImg();
    cur.style.transition = "none";
    cur.style.zIndex = "2";
  }
  lbDrag.dx = dx;
  lbCurImg().style.transform = `translateX(${dx}px)`;
});

function lbEndDrag(e){
  if(lbPan){
    if(e && e.pointerId !== undefined && e.pointerId !== lbPan.id) return;
    lbPan = null;
    lbSwipedAt = Date.now();
    $("#lightbox").classList.remove("dragging");
    const st = lbStage(); if(st) st.style.transition = "";
    return;
  }
  if(!lbDrag) return;
  if(e && e.pointerId !== undefined && e.pointerId !== lbDrag.id) return;
  const st = lbDrag;
  lbDrag = null;
  $("#lightbox").classList.remove("dragging");
  if(!st.active) return;
  lbSwipedAt = Date.now();
  const el = lbCurImg();
  const threshold = Math.max(44, Math.min(80, window.innerWidth * 0.09));
  // 快速一甩往往位移不大，但速度很快：速度够就切
  const dt = Math.max(1, Date.now() - (st.t0 || Date.now()));
  const speed = Math.abs(st.dx) / dt;
  if(Math.abs(st.dx) >= threshold || (speed > 0.55 && Math.abs(st.dx) > 16)){
    lbGo(st.dx < 0 ? 1 : -1, st.dx);
  }else{
    el.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
    el.style.transform = "translateX(0)";
    // 只是轻拖又回弹：原来在播的实况接着播
    if(st.wasPlaying && lbIsLive(lbSlide())) lbPlayLive(lbSlide());
  }
}
$("#lightbox").addEventListener("pointerup", lbEndDrag);
$("#lightbox").addEventListener("pointercancel", lbEndDrag);
$("#lightbox").addEventListener("lostpointercapture", lbEndDrag);

/* 触控板/滚轮：一次手势只切一张；手势停下来 160ms 立刻重新上膛，松手就能接着滑 */
let lbWheelAcc = 0, lbWheelArmed = true, lbWheelIdle = 0, lbWheelLastAt = 0;
$("#lightbox").addEventListener("wheel", e => {
  if(!$("#lightbox").classList.contains("on")) return;
  e.preventDefault();                     // 灯箱打开时别让背后的页面跟着滚
  if(e.ctrlKey || e.metaKey){             // 触控板捏合 → 缩放
    lbSetZoom(lbZoom * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
    return;
  }
  if(lbZoom > 1.01){                      // 放大后双指/滚轮 → 四处平移
    lbZx -= e.deltaX;
    lbZy -= e.deltaY;
    const st = lbStage(); if(st) st.style.transition = "none";
    lbApplyZoom();
    return;
  }
  if(lbSlides.length < 2) return;
  const dx = e.deltaX, dy = e.deltaY;
  const d = Math.abs(dx) >= Math.abs(dy) ? dx : (e.shiftKey ? dy : 0);
  if(!d) return;
  const now = performance.now();
  if(now - lbWheelLastAt > 120){ lbWheelAcc = 0; lbWheelArmed = true; }  // 新手势立刻上膛
  lbWheelLastAt = now;
  lbWheelAcc += d;
  clearTimeout(lbWheelIdle);
  lbWheelIdle = setTimeout(() => { lbWheelAcc = 0; lbWheelArmed = true; }, 120);
  if(lbWheelArmed && Math.abs(lbWheelAcc) > 40){
    lbWheelArmed = false;
    lbWheelAcc = 0;
    lbGo(d > 0 ? 1 : -1);
  }
}, {passive:false});

$("#lightbox").addEventListener("dblclick", e => {

  const t = e.target;
  if(t.id !== "lbimgA" && t.id !== "lbimgB") return;

});

/* 点空白关闭；点图片播/停实况；拖拽后的那次 click 丢掉 */
$("#lightbox").addEventListener("click", e => {
  if(!$("#lightbox").classList.contains("on")) return;
  if(Date.now() - lbSwipedAt < 350) return;
  const t = e.target;
  if(t.closest(".lbtop, .lbNav, .lblive")) return;
  const meta = lbSlide();
  if(t.id === "lbimgA" || t.id === "lbimgB" || t.id === "lbvid"){
    if(lbZoom > 1.01){ lbResetZoom(); return; }
    if(lbIsLive(meta)) lbToggleLive(meta);
    return;
  }
  closeLightbox();
});

document.addEventListener("keydown", e => {
  if(!$("#lightbox").classList.contains("on")) return;
  if(e.key === "Escape"){ e.preventDefault(); e.stopImmediatePropagation(); closeLightbox(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); lbShow(lbIdx - 1, -1); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); lbShow(lbIdx + 1, 1); }

    if(lbIsLive(meta)){ e.preventDefault(); lbToggleLive(meta); }
  }
});

async function fetchSuggest(q){
  const box = $("#suggest");
  if(!box) return;
  if(!q){ box.classList.add("hidden"); box.innerHTML = ""; return; }
  let j = null;
  try{ j = await fetch("/api/suggest?q=" + encodeURIComponent(q)).then(x => x.json()); }catch(e){}
  const auth = (j && j.authors) || [], plat = (j && j.platforms) || [];
  if(!auth.length && !plat.length){ box.classList.add("hidden"); box.innerHTML = ""; return; }
  let html = "";
  plat.forEach(p => {
    html += '<div class="sgrow" data-kind="platform" data-name="' + esc(p.name) + '">'
      + '<span class="sgtag">平台</span><span>' + esc(p.name) + '</span>'
      + '<span class="sgn">' + (p.n || "") + '</span></div>';
  });
  auth.forEach(a => {
    html += '<div class="sgrow" data-kind="author" data-name="' + esc(a.name) + '">'
      + '<span class="sgtag">博主</span><span>' + esc(a.name) + '</span>'
      + (a.platform_cn ? '<span class="sgtag">' + esc(a.platform_cn) + '</span>' : '')
      + '<span class="sgn">' + (a.n || "") + '</span></div>';
  });
  box.innerHTML = html;
  box.classList.remove("hidden");
}
$("#suggest").addEventListener("mousedown", e => {
  const row = e.target.closest(".sgrow");
  if(!row) return;
  e.preventDefault();
  const name = row.dataset.name || "";
  const kind = row.dataset.kind;
  $("#suggest").classList.add("hidden");
  state.active = true;
  state.author = ""; state.author_key = ""; state.collection = null; state.q = "";
  $("#q").value = "";
  if(kind === "platform"){
    state.platform = name;   // 平台视图：行模式按该平台博主挨着展示 + 置顶
  }else{
    state.author = name;     // 博主视图
  }
  loadAll();

/* ---------- 解析历史窗口 ---------- */
function histFmtTime(ts){
  const d = new Date((ts || 0) * 1000);
  const p = n => String(n).padStart(2, "0");
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function histRowHTML(r){
  const fail = r.status !== "done";
  const title = r.title || r.url || "（无标题）";
  const tag = r.status === "cancelled" ? '<span class="htag">已取消</span>'
            : (r.duplicate || r.skipped) ? '<span class="htag">重复跳过</span>' : "";
  const sub = fail && r.error ? '<div class="herr">' + esc(r.error) + '</div>'
            : (!r.title && r.url ? '<div class="hurl">' + esc(r.url) + '</div>' : "");
  return '<div class="hrow" data-url="' + esc(r.url || "") + '">'
    + '<span class="htime">' + histFmtTime(r.ts) + '</span>'
    + (r.platform ? '<span class="hplat">' + esc(r.platform) + '</span>' : "")
    + '<div class="hmain"><div class="htitle">' + esc(title) + '</div>' + sub + '</div>'
    + tag
    + '<div class="hacts">'
    + '<button class="small" data-act="open">打开原页</button>'
    + '<button class="small" data-act="copy">复制</button>'
    + (fail && r.status !== "cancelled" ? '<button class="small" data-act="retry">重试</button>' : "")
    + '</div></div>';
}
async function loadHist(){
  const body = $("#histBody");
  if(!body) return;
  body.innerHTML = '<div class="histgroup">读取中…</div>';
  let items = [];
  try{
    const j = await fetch("/api/history").then(x => x.json());
    items = j.items || [];
  }catch(e){}
  const fails = items.filter(r => r.status !== "done");
  const oks = items.filter(r => r.status === "done");
  const cnt = $("#histCount");
  if(cnt) cnt.textContent = "失败 " + fails.length + " / 成功 " + oks.length;
  let html = '<div class="histgroup fail">失败 / 取消 · ' + fails.length + '</div>';
  html += fails.length ? fails.map(histRowHTML).join("")
                       : '<div class="hrow"><span class="hurl">暂无</span></div>';
  html += '<div class="histgroup">成功 · ' + oks.length + '</div>';
  html += oks.length ? oks.map(histRowHTML).join("")
                     : '<div class="hrow"><span class="hurl">暂无</span></div>';
  body.innerHTML = html;
}

(function(){

(function(){

  const leave = e => { e.preventDefault(); if(drop.contains(e.relatedTarget)) return;
                       over=false; drop.classList.remove("over"); };
  const ondrop = e => {
    e.preventDefault(); over=false; drop.classList.remove("over");
    const files = [...(e.dataTransfer && e.dataTransfer.files || [])];
    if(files.length) nwAddFiles(files);

  [drop, list].forEach(el => {
    el.addEventListener("dragenter", enter);
    el.addEventListener("dragover", e => e.preventDefault());
    el.addEventListener("dragleave", leave);
    el.addEventListener("drop", ondrop);
  });
})();

  let _dWheelAcc = 0;
  addEventListener("wheel", e => {
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    _dWheelAcc += e.deltaY;
    if(_dWheelAcc <= -5){
      const prev = dzoom;
      setDZoom(dzoom + ZOOM_STEP);
      _dWheelAcc = (dzoom === prev) ? 0 : _dWheelAcc + 5;
    }else if(_dWheelAcc >= 5){
      const prev = dzoom;
      setDZoom(dzoom - ZOOM_STEP);
      _dWheelAcc = (dzoom === prev) ? 0 : _dWheelAcc - 5;
    }
  }, { passive:false });
  // 键盘
  addEventListener("keydown", e => {
    if(!(e.metaKey || e.ctrlKey)) return;
    if(e.key === "+" || e.key === "="){ e.preventDefault(); setDZoom(dzoom + ZOOM_STEP); }
    else if(e.key === "-"){ e.preventDefault(); setDZoom(dzoom - ZOOM_STEP); }
    else if(e.key === "0"){ e.preventDefault(); setDZoom(1); }
  });

const BATCH = { tab: "douyin|like", items: [], sel: new Set(), url: "", listUrl: "", poll: 0, loadedTab: "",
  cache: {},  /* per-tab cache: { items, sel, url, listUrl } */
  jobs: {}    /* per-tab in-flight parse job: { ac, started } —— 切 tab 不打断 */ };

function batchSaveCache(){
  const key = BATCH.tab;
  if (!key) return;
  BATCH.cache[key] = {
    items: BATCH.items.slice(),
    sel: new Set(BATCH.sel),
    url: BATCH.url,
    listUrl: BATCH.listUrl
  };
}

function batchRestoreCache(tab){
  const c = BATCH.cache[tab];
  if (c) {
    BATCH.items = c.items.slice();
    BATCH.sel = new Set(c.sel);
    BATCH.url = c.url || "";
    BATCH.listUrl = c.listUrl || "";
    return true;
  }
  return false;
}

  if (BATCH.tab === "paste" || BATCH.tab === "list") return { platform: "", kind: "" };
